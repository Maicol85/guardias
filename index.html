<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GuardiaSync — CeiboMed</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #eef0f3; min-height: 100vh; color: #111827; }
textarea, input, select { font-family: inherit; outline: none; }
button { font-family: inherit; cursor: pointer; }
@keyframes fade { from { opacity:0; transform:translateY(4px) } to { opacity:1; transform:none } }

/* HEADER */
.header { background: #0f172a; height: 52px; padding: 0 22px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
.header-logo { display: flex; align-items: center; gap: 14px; }
.header-title { font-family: Georgia, serif; font-size: 1.2rem; color: white; }
.header-title span { color: #60a5fa; }
.header-sep { width: 1px; height: 18px; background: rgba(255,255,255,0.15); }
.header-suite { font-size: 0.68rem; color: rgba(255,255,255,0.35); letter-spacing: 1.5px; text-transform: uppercase; }
.badge-alerta { background: #b91c1c; color: white; font-size: 0.72rem; font-weight: 700; padding: 3px 10px; border-radius: 4px; }

/* NAV */
.nav { background: #fff; border-bottom: 1px solid #d1d5db; display: flex; }
.nav-btn { display: flex; align-items: center; gap: 6px; padding: 9px 20px; border: none; border-bottom: 2px solid transparent; background: transparent; color: #6b7280; font-size: 0.81rem; font-weight: 400; cursor: pointer; transition: all 0.15s; }
.nav-btn.active { color: #1d4ed8; border-bottom-color: #1d4ed8; font-weight: 600; }

/* MAIN */
.main { padding: 18px 22px; max-width: 1060px; margin: 0 auto; animation: fade 0.2s ease; }

/* TOOLBAR */
.toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; flex-wrap: wrap; gap: 8px; }
.toolbar-left { display: flex; align-items: center; gap: 8px; }
.toolbar-right { display: flex; gap: 8px; align-items: center; }
.mes-titulo { font-family: Georgia, serif; font-size: 1.2rem; font-weight: 600; color: #111827; min-width: 160px; }

/* BOTONES */
.btn { display: inline-flex; align-items: center; gap: 5px; padding: 8px 16px; border-radius: 6px; font-size: 0.82rem; font-weight: 600; border: none; transition: all 0.15s; cursor: pointer; }
.btn-primary { background: #1d4ed8; color: white; }
.btn-primary:hover { background: #1e40af; }
.btn-secondary { background: #fff; color: #374151; border: 1px solid #d1d5db; }
.btn-secondary:hover { background: #f9fafb; }
.btn-danger { background: #b91c1c; color: white; }
.btn-ghost { background: transparent; color: #1d4ed8; border: 1px solid #eff6ff; }
.btn-sm { padding: 4px 11px; font-size: 0.74rem; }
.btn-full { width: 100%; justify-content: center; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }

/* NOTA MES */

/* PANEL NOTAS DEL MES */
.notas-panel { background: #fff; border: 1px solid #d1d5db; border-radius: 10px; padding: 14px 16px; margin-top: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.06); }
.notas-panel-title { font-family: Georgia, serif; font-size: 1rem; color: #111827; margin-bottom: 10px; }
.notas-panel textarea { width: 100%; min-height: 100px; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 0.85rem; color: #374151; resize: vertical; line-height: 1.5; background: #fefdf9; }
.notas-panel textarea:focus { border-color: #1d4ed8; }

/* LEYENDA */
.leyenda { margin-bottom: 14px; }
.leyenda-linea { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.leyenda-toggle { display: flex; align-items: center; gap: 5px; padding: 3px 10px; border: 1px solid #d1d5db; border-radius: 5px; background: #fff; cursor: pointer; font-family: inherit; font-size: 0.68rem; font-weight: 700; color: #6b7280; text-transform: uppercase; letter-spacing: .5px; }
.leyenda-toggle:hover { border-color: #9ca3af; color: #374151; }
.leyenda-toggle.abierto { background: #eef2ff; border-color: #a5b4fc; color: #3730a3; }
.leyenda-chevron { font-size: 0.6rem; opacity: .7; }
.leyenda-detalle { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 7px; padding: 7px 9px; background: #f8fafc; border: 1px solid #e5e7eb; border-radius: 6px; }
.leyenda-grupo { display: flex; align-items: center; gap: 4px; }
.leyenda-label { font-size: 0.65rem; font-weight: 700; color: #6b7280; text-transform: uppercase; letter-spacing: 1px; margin-right: 2px; }
.leyenda-item { display: flex; align-items: center; gap: 3px; padding: 2px 8px; border-radius: 4px; }
.leyenda-dot { width: 7px; height: 7px; border-radius: 2px; display: inline-block; flex-shrink: 0; }
.leyenda-sep { width: 1px; height: 14px; background: #d1d5db; margin: 0 4px; }

/* FILTRO MÉDICO */
.filtro-select { padding: 5px 9px; border: 1px solid #d1d5db; border-radius: 5px; font-size: 0.77rem; background: #fff; color: #374151; }
.menu-dropdown { position: absolute; top: calc(100% + 5px); right: 0; z-index: 300; min-width: 208px; background: #fff; border: 1px solid #d1d5db; border-radius: 8px; box-shadow: 0 8px 22px rgba(15,23,42,.16); padding: 5px; }
.menu-item { display: block; width: 100%; text-align: left; background: transparent; border: none; padding: 8px 11px; border-radius: 6px; font-size: 0.8rem; font-weight: 500; color: #374151; cursor: pointer; font-family: inherit; white-space: nowrap; }
.menu-item:hover { background: #eff6ff; color: #1e40af; }
.menu-sep { height: 1px; background: #e5e7eb; margin: 4px 6px; }
.resumen-fila { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-bottom: 1px solid #f1f5f9; cursor: pointer; border-radius: 6px; }
.resumen-fila:hover { background: #eff6ff; }

/* CALENDARIO GRILLA */
.cal-wrap { background: #fff; border-radius: 10px; border: 1px solid #d1d5db; overflow: hidden; box-shadow: 0 4px 24px rgba(0,0,0,0.12); }
.cal-header { display: grid; grid-template-columns: repeat(7, 1fr); background: #0f172a; }
.cal-dow { padding: 8px 0; text-align: center; font-size: 0.7rem; font-weight: 700; color: rgba(255,255,255,0.45); letter-spacing: 1px; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); }
.cal-cell { min-height: 110px; border-right: 1px solid #d1d5db; border-bottom: 1px solid #d1d5db; background: #fff; cursor: pointer; position: relative; transition: background 0.12s; }
.cal-cell:hover { background: #f0f4f8 !important; }
.cal-cell.vacio { background: #f8f9fa; cursor: default; }
.cal-cell.vacio:hover { background: #f8f9fa !important; }
.cal-cell.finde { background: #fafafa; }
.cal-cell.hoy { background: #f0f7ff; }
.cal-cell.sin-cubrir { background: #fff5f5; }

/* NÚMERO DÍA */
.cal-num-wrap { padding: 5px 7px; display: flex; justify-content: space-between; align-items: flex-start; }
.cal-num { width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.78rem; font-weight: 500; color: #374151; }
.cal-num.hoy { background: #1d4ed8; color: white; font-weight: 700; }
.cal-num.finde { color: #6b7280; }
.cal-flags { display: flex; gap: 4px; }

/* ASIGNACIONES EN CELDA — CAMBIO 3: menos color */
.cal-asigs { padding: 0 5px 5px; display: flex; flex-direction: column; gap: 1px; }
.asig-row { padding: 2px 4px; border-radius: 2px; }
/* Guardia: borde neutro gris, sin color individual del médico */
.asig-row.guardia { border-left: 2px solid #94a3b8; background: transparent; }
/* Apoyo: mantiene color del rol */
.asig-row.apoyo { border-left: 2px solid var(--rol-color); background: var(--rol-bg); }
.asig-rol-label { font-size: 0.56rem; font-weight: 700; line-height: 1.2; }
/* CAMBIO 2: nombre + horario en gris neutro para guardias */
.asig-nombre { font-size: 0.62rem; font-weight: 700; line-height: 1.3; color: #1e293b; }
.asig-nombre .horario { font-weight: 400; color: #6b7280; margin-left: 3px; }
.asig-nombre.apoyo-nombre { font-weight: 600; }
.asig-sin-cubrir { padding: 2px 4px; border-radius: 2px; border-left: 2px solid #b91c1c; background: #fef2f2; }

/* FOOTER */
.footer { margin-top: 18px; font-size: 0.68rem; color: #6b7280; text-align: center; }

/* EQUIPO */
.equipo-header { display: grid; grid-template-columns: auto 2fr 2fr 1fr auto; background: #0f172a; }
.equipo-th { padding: 8px 14px; font-size: 0.67rem; font-weight: 700; color: rgba(255,255,255,0.45); letter-spacing: 1px; text-transform: uppercase; }
.equipo-row { display: grid; grid-template-columns: auto 2fr 2fr 1fr auto; border-top: 1px solid #d1d5db; align-items: center; }
.equipo-row:nth-child(even) { background: #fafafa; }
.equipo-td { padding: 10px 14px; }
.avatar { border-radius: 3px; display: flex; align-items: center; justify-content: center; font-weight: 700; color: white; flex-shrink: 0; }

/* ESTADÍSTICAS */
.stats-header { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr 1fr; background: #0f172a; }
.stats-th { padding: 9px 16px; font-size: 0.67rem; font-weight: 700; color: rgba(255,255,255,0.45); letter-spacing: 1px; text-transform: uppercase; }
.stats-row { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr 1fr; border-top: 1px solid #d1d5db; align-items: center; }
.stats-row:nth-child(even) { background: #fafafa; }
.stats-td { padding: 10px 16px; }

/* MODAL BASE */
.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 300; display: flex; align-items: center; justify-content: center; padding: 16px; }
.modal-box { background: #fff; border-radius: 14px; padding: 24px; width: 100%; box-shadow: 0 4px 24px rgba(0,0,0,0.18); max-height: 90vh; overflow-y: auto; }
/* Modal con cuerpo scrolleable: los botones de acción nunca quedan fuera de pantalla */
.modal-scroll { display: flex; flex-direction: column; max-height: 88vh; overflow: hidden; }
.modal-scroll-head { flex: 0 0 auto; }
.modal-scroll-body { flex: 1 1 auto; min-height: 0; max-height: 80vh; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.modal-scroll-foot { flex: 0 0 auto; padding-top: 12px; margin-top: 10px; border-top: 1px solid #e5e7eb; }
/* Tabla de previsualización del reporte RRHH */
.rr-tabla { width: 100%; border-collapse: collapse; font-size: 0.78rem; min-width: 780px; }
.rr-tabla th { background: #f1f5f9; border: 1px solid #cbd5e1; padding: 6px 8px; text-align: center;
  font-size: 0.64rem; font-weight: 700; text-transform: uppercase; letter-spacing: .4px; color: #475569; }
.rr-tabla th.rr-th-edit { background: #eff6ff; color: #1e40af; }
.rr-tabla td { border: 1px solid #e2e8f0; padding: 3px 8px; color: #334155; }
.rr-tabla tbody tr:nth-child(even) td { background: #fafafa; }
.rr-nom { font-weight: 600; color: #111827; white-space: nowrap; }
.rr-num { text-align: center; color: #64748b; }
.rr-edit { padding: 2px 4px !important; }
.rr-edit input { width: 100%; border: 1px solid #bfdbfe; border-radius: 5px; padding: 3px 6px;
  font-family: inherit; font-size: 0.78rem; color: #111827; background: #fff; }
.rr-edit input:focus { outline: none; border-color: #2563eb; background: #eff6ff; }
.rr-edit input[type=number] { text-align: center; }
.rr-tabla tfoot td { background: #e2e8f0; font-weight: 700; color: #111827; border: 1px solid #cbd5e1; }

/* MODAL DÍA */
.modal-dia { max-width: 460px; }
.modal-dia-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.modal-dia-asig { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 8px; margin-bottom: 6px; }
.modal-dia-asig-info { flex: 1; }

/* MODAL COPIAR */
.modal-copiar { max-width: 420px; }
.modal-preview { background: #eef0f3; border-radius: 8px; padding: 12px 14px; margin-bottom: 20px; border: 1px solid #d1d5db; }

/* MODAL MÉDICO */
.modal-medico { max-width: 340px; }
.color-swatch { width: 24px; height: 24px; border-radius: 4px; cursor: pointer; transition: all 0.12s; }

/* SECTION */
.section-title { font-family: Georgia, serif; font-size: 1.1rem; color: #111827; margin-bottom: 16px; }
.card-wrap { background: #fff; border: 1px solid #d1d5db; border-radius: 10px; overflow: hidden; }

/* FORM ELEMENTS */
.form-label { font-size: 0.72rem; font-weight: 600; color: #6b7280; margin-bottom: 4px; }
.form-input { width: 100%; padding: 7px 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 0.82rem; background: #fff; }
.form-select { width: 100%; padding: 7px 9px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 0.82rem; background: #fff; color: #374151; }
.form-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }

@media (max-width: 640px) {
  .main { padding: 12px 10px; }
  .cal-cell { min-height: 80px; }
  .asig-nombre { font-size: 0.55rem; }
  .header-coord { display: none; }   /* en móvil el header solo muestra institución y servicio */

  /* Las 7 columnas no entran en un celular: se hace scroll horizontal manteniendo
     un ancho mínimo por celda para que el contenido siga siendo legible. */
  .cal-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .cal-header, .cal-grid { min-width: 630px; }   /* 7 columnas × 90px */
  .cal-cell, .cal-grid > div { min-width: 90px; }
}

/* ─── TOAST DE GUARDADO ─────────────────────────────────────── */
.toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 600;
  display: flex; align-items: center; gap: 12px; background: #111827; color: #fff;
  padding: 10px 16px; border-radius: 9px; box-shadow: 0 8px 24px rgba(0,0,0,.25);
  font-size: 0.8rem; font-weight: 500; max-width: calc(100vw - 28px); animation: fade .2s ease; }
.toast button { background: transparent; border: 1px solid rgba(255,255,255,.28); color: #93c5fd;
  border-radius: 6px; padding: 4px 9px; font-size: 0.74rem; font-weight: 600; cursor: pointer;
  font-family: inherit; white-space: nowrap; }
.toast button:hover { background: rgba(255,255,255,.08); }
</style>
</head>
<body>

<!-- ─── LOGIN (CAMBIO 4) ─────────────────────────────────────── -->
<div id="login" style="position:fixed;inset:0;z-index:500;background:#0f172a;display:flex;align-items:center;justify-content:center;padding:20px;">
  <div style="width:100%;max-width:360px;text-align:center;animation:fade 0.3s ease;">
    <div style="margin-bottom:26px;">
      <div id="login-logo"></div>
      <div style="font-family:Georgia,serif;font-size:1.9rem;color:#fff;letter-spacing:0.5px;">Guardia<span style="color:#60a5fa;">Sync</span></div>
      <div style="font-size:0.7rem;color:rgba(255,255,255,0.4);letter-spacing:2px;text-transform:uppercase;margin-top:6px;">CeiboMed</div>
      <div id="login-servicio" style="margin-top:14px;"></div>
    </div>
    <input id="login-pass" type="password" placeholder="Contraseña"
      onkeydown="if(event.key==='Enter')intentarLogin()"
      oninput="document.getElementById('login-error').style.display='none'"
      style="width:100%;padding:11px 14px;border:1px solid rgba(255,255,255,0.15);border-radius:8px;background:#1e293b;color:#fff;font-size:0.9rem;margin-bottom:10px;text-align:center;">
    <button onclick="intentarLogin()"
      style="width:100%;padding:11px 14px;border:none;border-radius:8px;background:#1d4ed8;color:#fff;font-size:0.9rem;font-weight:600;cursor:pointer;">Ingresar</button>
    <div id="login-error" style="display:none;color:#f87171;font-size:0.8rem;margin-top:12px;">Contraseña incorrecta</div>
  </div>
</div>

<div id="app"></div>

<script>
// ─── DATOS ───────────────────────────────────────────────────

const C = {
  bg:"#eef0f3", surface:"#ffffff", ink:"#111827",
  soft:"#374151", muted:"#6b7280", border:"#d1d5db",
  night:"#0f172a", accent:"#1d4ed8", accentLt:"#eff6ff",
  red:"#b91c1c", redLt:"#fef2f2",
  green:"#15803d", greenLt:"#f0fdf4",
  amber:"#b45309", amberLt:"#fffbeb",
  teal:"#0e7490", tealLt:"#ecfeff",
  purple:"#6d28d9", purpleLt:"#f5f3ff",
};

const MESES = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const DIAS_SEMANA = ["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"];
const DIAS_FULL = ["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];

const ROLES_BASE = [
  { id:"D12",  label:"08–20 hs",    color:"#334155", bg:"#f8fafc", desc:"Diurno 12hs",         grupo:"Guardia"  },
  { id:"N12",  label:"20–08 hs",    color:"#334155", bg:"#f1f5f9", desc:"Nocturno 12hs",        grupo:"Guardia"  },
  { id:"A6",   label:"Apoyo 6hs",   color:"#b45309", bg:"#fffbeb", desc:"Apoyo 6 horas",        grupo:"Apoyo"    },
  { id:"A4",   label:"Apoyo 4hs",   color:"#b45309", bg:"#fffbeb", desc:"Apoyo 4 horas",        grupo:"Apoyo"    },
  { id:"A8",   label:"Apoyo 8hs",   color:"#b45309", bg:"#fffbeb", desc:"Apoyo 8 horas",        grupo:"Apoyo"    },
  { id:"POL",  label:"Policlínica", color:"#0e7490", bg:"#ecfeff", desc:"Policlínica PA",       grupo:"Especial" },
  { id:"INT",  label:"Interno",     color:"#6d28d9", bg:"#f5f3ff", desc:"Interno/Estudiante",   grupo:"Especial" },
  { id:"X",    label:"Personaliz.", color:"#15803d", bg:"#f0fdf4", desc:"Rol libre",            grupo:"Otro"     },
  { id:"PEN",  label:"⚠️ Pendiente", color:"#dc2626", bg:"#fef2f2", desc:"Pendiente de cubrir",  grupo:"Especial" },
];

// ─── TURNO PENDIENTE DE CUBRIR ───────────────────────────────
// Médico fantasma: NO está en `medicos` (no sale en Equipo, ni en Estadísticas,
// ni en el filtro del calendario), pero sí se ofrece en el selector del modal del día.
const MEDICO_PENDIENTE = { id:0, nombre:"PENDIENTE", sigla:"⚠️", color:"#dc2626" };
// Un turno está pendiente si tiene el rol PEN o el médico fantasma.
function esPendiente(a) { return !!a && (a.rol === "PEN" || Number(a.medicoId) === 0); }
// Asignaciones que realmente cubren el día (las pendientes no cuentan como cobertura).
function asigsReales(fecha) { return (diaData(fecha).asignaciones || []).filter(a => !esPendiente(a)); }

// ORDEN para sorting: D12 primero, N12 segundo, resto después
const ROL_ORDEN = { D12:0, N12:1 };

let medicos = [
  { id:1,  nombre:"Quiñones",    sigla:"QUI", color:"#1d4ed8" },
  { id:2,  nombre:"A. Cuña",     sigla:"ACU", color:"#15803d" },
  { id:3,  nombre:"B. Arbiza",   sigla:"ARB", color:"#7c3aed" },
  { id:4,  nombre:"H. Pereira",  sigla:"PER", color:"#b45309" },
  { id:5,  nombre:"Trivel",      sigla:"TRI", color:"#0e7490" },
  { id:6,  nombre:"Panizza",     sigla:"PAN", color:"#be185d" },
  { id:7,  nombre:"H. Colón",    sigla:"COL", color:"#374151" },
  { id:8,  nombre:"C. Balle",    sigla:"BAL", color:"#4d7c0f" },
  { id:9,  nombre:"Borrero",     sigla:"BOR", color:"#9a3412" },
  { id:10, nombre:"S. Rodriguez",sigla:"ROD", color:"#1e40af" },
  { id:11, nombre:"Ayala",       sigla:"AYA", color:"#6d28d9" },
  { id:12, nombre:"Valor",       sigla:"VAL", color:"#065f46" },
  { id:13, nombre:"Dos Santos",  sigla:"DOS", color:"#7f1d1d" },
  { id:14, nombre:"E. García",   sigla:"GAR", color:"#b91c1c" },
];

// ─── ESTADO ──────────────────────────────────────────────────

let state = {
  view: "calendario",
  anio: 2026,
  mes: 7,
  calendario: null,
  historialMeses: {},
  filtroMedico: "",
  modalDia: null,
  modalCopiar: null,
  modalMedico: false,
  addMedico: "",
  addRol: "D12",
  editHorario: null,
  copiarDiaOrigen: null,
  swapDiaOrigen: null,
  medicoSelModal: new Set(),   // uids tildados en el modal del día abierto
  swapMedicoOrigen: null,      // { fecha, uids:[] } — intercambio de médicos puntuales
  swapMedicoDestino: null,     // fecha destino elegida, mientras se arma el emparejamiento
  modoCal: "mes",       // "mes" | "semana"
  semanaAncla: null,    // fecha ancla de la vista semanal
  histModal: null,      // fecha cuyo historial se muestra
  jefe: (function(){ try { return sessionStorage.getItem("guardias_jefe") === "1"; } catch(e){ return false; } })(),  // MEJORA 13
  ausPanel: false,        // panel de ausencias abierto
  ausDetalleFecha: null,  // detalle de ausencias de un día
  ausForm: { medicoId:"", tipo:"licencia", fDesde:"", fHasta:"", motivo:"" },
  nuevoMedico: { nombre:"", sigla:"", color:"#1d4ed8" },
  config: null,           // configuración del servicio (se carga en initPatronDefault)
  modalPDF: null,         // opciones de exportación de PDF elegidas en el modal
  menuToolbar: false,     // menú "≡" de la toolbar desplegado
  leyendaGrupo: null,     // grupo de la leyenda desplegado (acordeón); null = todos colapsados
  compartido: false,      // true al abrir un link ?share= : solo lectura, sin persistencia
  notasCompartidas: "",   // notas del mes que vienen dentro del link compartido
  modalShare: null,       // modal con el link para compartir
  modalDiaVista: null,    // día abierto en solo lectura (sin edición)

function generarMesVacio(anio, mes) {
  const cal = {};
  const total = new Date(anio, mes+1, 0).getDate();
  for(let d=1; d<=total; d++) {
    const f = `${anio}-${String(mes+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    cal[f] = { asignaciones:[], notas:"" };
  }
  return cal;
}

// ─── PATRÓN SEMANAL POR DEFECTO (planilla real) ──────────────
// dow: 0=Domingo 1=Lunes 2=Martes 3=Miércoles 4=Jueves 5=Viernes 6=Sábado
// medicoId: 1 Quiñones · 2 A. Cuña · 3 B. Arbiza · 4 H. Pereira · 5 Trivel · 6 Panizza
//           7 H. Colón · 8 C. Balle · 9 Borrero · 10 S. Rodriguez · 11 Ayala · 13 Dos Santos · 14 E. García
const PATRON_SEMANAL = {
  1: [ {medicoId:1, rol:"D12"}, {medicoId:10, rol:"N12"}, {medicoId:14, rol:"A6"} ],                                                     // Lunes
  2: [ {medicoId:2, rol:"D12", horario:"08-14hs"}, {medicoId:3, rol:"D12", horario:"14-20hs"}, {medicoId:1, rol:"N12"}, {medicoId:14, rol:"A4"} ], // Martes (diurno compartido)
  3: [ {medicoId:4, rol:"D12"}, {medicoId:11, rol:"N12"}, {medicoId:14, rol:"A6"} ],                                                     // Miércoles
  4: [ {medicoId:5, rol:"D12"}, {medicoId:13, rol:"N12"}, {medicoId:14, rol:"A4"} ],                                                     // Jueves
  5: [ {medicoId:6, rol:"D12"}, {medicoId:5, rol:"N12"}, {medicoId:14, rol:"A4"} ],                                                      // Viernes
  6: [ {medicoId:7, rol:"D12"}, {medicoId:8, rol:"N12"} ],                                                                                // Sábado
  0: [ {medicoId:9, rol:"D12"}, {medicoId:2, rol:"N12"} ],                                                                                // Domingo
};
// Genera un mes completo aplicando el patrón semanal a cada día según su día de semana.
function aplicarPatronMes(anio, mes) {
  const cal = generarMesVacio(anio, mes);
  const total = new Date(anio, mes + 1, 0).getDate();
  for (let d = 1; d <= total; d++) {
    const f = `${anio}-${String(mes + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
    const dow = new Date(anio, mes, d).getDay();
    const patron = PATRON_SEMANAL[dow] || [];
    cal[f].asignaciones = patron.map((a, i) => ({ ...a, id: Date.now() + d * 100 + i }));
  }
  return cal;
}
function cargarAgosto2026() { return aplicarPatronMes(2026, 7); }

// ─── CONFIGURACIÓN DEL SERVICIO (localStorage "guardias_config") ──
// turnos: { [dow base-lunes 0=Lun…6=Dom]: [ {id, rol, nombre, horario, requeridos} ] }
// Define la plantilla de cobertura: qué turnos necesita cada día de semana y cuántos médicos.
const CONFIG_KEY = "guardias_config";
function configPorDefecto() {
  const turnos = {};
  for (let dl = 0; dl < 7; dl++) turnos[dl] = [];
  // Se siembra desde el patrón semanal histórico (base-domingo) agrupando por rol + horario.
  Object.keys(PATRON_SEMANAL).forEach(dowDom => {
    const dl = (Number(dowDom) + 6) % 7;   // a base-lunes
    const agrup = {};
    PATRON_SEMANAL[dowDom].forEach(t => {
      const horario = t.horario || getRol(t.rol).label;
      const k = t.rol + "|" + horario;
      if (!agrup[k]) agrup[k] = { rol: t.rol, horario, requeridos: 0 };
      agrup[k].requeridos++;
    });
    turnos[dl] = Object.values(agrup).map((t, i) => ({
      id: `t${dl}_${i}`, rol: t.rol, nombre: getRol(t.rol).desc, horario: t.horario, requeridos: t.requeridos,
    }));
  });
  // Los tres campos arrancan VACÍOS: un valor de ejemplo hardcodeado terminaba
  // apareciendo en el header, el PDF y el link como si el usuario lo hubiera escrito.
  return { institucion: "", servicio: "", coordinador: "", turnos };
}

// base64 con soporte UTF-8: btoa() solo acepta Latin-1 y los nombres traen ñ/acentos.
function b64Encode(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = "";
  bytes.forEach(b => { bin += String.fromCharCode(b); });
  return btoa(bin);
}
function b64Decode(b64) {
  const bin = atob(b64);
  return new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0)));
}
// base64url: sin +, / ni = para que el link no necesite escapes.
function aB64Url(s) { return s.replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); }
function deB64Url(s) { const t = s.replace(/-/g, "+").replace(/_/g, "/"); return t + "=".repeat((4 - t.length % 4) % 4); }

// El paquete se arma compacto (arrays en vez de objetos, sin uid/id, solo días con guardias
// y solo los médicos usados) porque todo esto termina dentro de una URL.
function paqueteCompartir() {
  const cfg = state.config || {};
  const dias = {};
  const usados = new Set();
  Object.keys(state.calendario || {}).forEach(f => {
    const asigs = state.calendario[f].asignaciones || [];
    if (!asigs.length) return;
    dias[dnum(f)] = asigs.map(a => {
      usados.add(Number(a.medicoId));
      const h = (a.horario && String(a.horario).trim()) ? String(a.horario) : "";
      return h ? [Number(a.medicoId), a.rol, h] : [Number(a.medicoId), a.rol];
    });
  });
  const pkg = {
    v: 1, a: state.anio, m: state.mes, d: dias,
    md: medicos.filter(m => usados.has(m.id)).map(m => [m.id, m.nombre, m.sigla, m.color]),
  };
  if (cfg.institucion || cfg.servicio || cfg.coordinador) pkg.s = [cfg.institucion || "", cfg.servicio || "", cfg.coordinador || ""];
  const notas = cargarNotasMes();
  if (notas && notas.trim()) pkg.n = notas;
  return pkg;
}
function generarLinkCompartir() {
  return SHARE_BASE + "?share=" + aB64Url(b64Encode(JSON.stringify(paqueteCompartir())));
}
function leerShareDeURL() {
  try {
    const m = String(location.search || "").match(/[?&]share=([^&#]+)/);
    if (!m) return null;
    const pkg = JSON.parse(b64Decode(deB64Url(decodeURIComponent(m[1]))));
    return (pkg && pkg.d && typeof pkg.a === "number" && typeof pkg.m === "number") ? pkg : null;
  } catch (e) { return null; }
}
// Carga el mes compartido en memoria. NADA de esto toca localStorage (ver guardas
// en guardarEstado/guardarNotasMes/histLog/ausGetMes/cargarLogo).
function aplicarPaqueteCompartido(pkg) {
  state.compartido = true;
  state.jefe = false;
  state.anio = pkg.a;
  state.mes = pkg.m;
  if (Array.isArray(pkg.md) && pkg.md.length) {
    medicos = pkg.md.map(x => ({ id: x[0], nombre: x[1], sigla: x[2], color: x[3] }));
  }
  const s = pkg.s || [];
  state.config = { institucion: s[0] || "", servicio: s[1] || "", coordinador: s[2] || "", turnos: {} };
  state.notasCompartidas = pkg.n || "";
  const cal = generarMesVacio(pkg.a, pkg.m);
  Object.keys(pkg.d || {}).forEach(dn => {
    const f = `${pkg.a}-${String(pkg.m + 1).padStart(2, "0")}-${String(dn).padStart(2, "0")}`;
    if (!cal[f]) return;
    cal[f].asignaciones = (pkg.d[dn] || []).map((x, i) => {
      const o = { medicoId: x[0], rol: x[1], id: i };
      if (x[2]) o.horario = x[2];
      return o;
    });
  });
  state.calendario = cal;
  state.historialMeses[`${pkg.a}-${pkg.m}`] = cal;
}

// Copiar al portapapeles con fallback (navigator.clipboard exige contexto seguro).
function copiarTexto(txt, cb) {
  const fallback = () => {
    try {
      const ta = document.createElement("textarea");
      ta.value = txt; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.focus(); ta.select();
      const ok = document.execCommand("copy");
      document.body.removeChild(ta);
      return ok;
    } catch (e) { return false; }
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(() => cb(true)).catch(() => cb(fallback()));
  } else { cb(fallback()); }
}

// ─── PUBLICAR EL MES COMO GIST DE GITHUB ─────────────────────
// El token se guarda en su PROPIA clave, nunca dentro de guardias_config: así no puede
// colarse en el paquete que viaja en los links compartidos ni en un export del mes.
// ⚠️ Igual queda en localStorage de una app pública: cualquier XSS puede leerlo, y un
// token con scope "gist" alcanza TODOS los gists de la cuenta. Conviene que sea
// fine-grained, solo permiso gist, y con vencimiento.
const GH_TOKEN_KEY = "guardias_gh_token";
function cargarGhToken() {
  if (state.compartido) return "";   // quien abre un link nunca usa ni ve el token
  try { return localStorage.getItem(GH_TOKEN_KEY) || ""; } catch (e) { return ""; }
}
function guardarGhToken(v) {
  if (state.compartido) return;
  try {
    const t = String(v || "").trim();
    if (t) localStorage.setItem(GH_TOKEN_KEY, t); else localStorage.removeItem(GH_TOKEN_KEY);
  } catch (e) {}
}
function borrarGhToken() {
  if (!confirm("¿Borrar el token de GitHub guardado en este navegador?")) return;
  try { localStorage.removeItem(GH_TOKEN_KEY); } catch (e) {}
  render();
}
function gistKeyMes(anio, mes) { return `guardias_gist_${anio}_${mes}`; }
function gistIdGuardado() {
  try { return localStorage.getItem(gistKeyMes(state.anio, state.mes)) || ""; } catch (e) { return ""; }
}
function nombreArchivoGist() { return `guardiasync_${state.mes + 1}_${state.anio}.json`; }

async function publicarMes() {
  const token = cargarGhToken();
  if (!token) { alert("Configurá primero el token de GitHub en ⚙️ Configuración."); return; }

  const cuerpo = {
    description: `GuardiaSync — ${MESES[state.mes]} ${state.anio}${(state.config || {}).servicio ? " · " + state.config.servicio : ""}`,
    public: false,   // gist secreto: no se lista, pero cualquiera con el link lo ve
    files: { [nombreArchivoGist()]: { content: JSON.stringify(paqueteCompartir()) } },
  };
  const cabeceras = {
    "Authorization": "Bearer " + token,
    "Accept": "application/vnd.github+json",
    "Content-Type": "application/json",
  };

  state.publicando = true; render();
  try {
    let id = gistIdGuardado();
    let res = null;
    if (id) {
      res = await fetch("https://api.github.com/gists/" + encodeURIComponent(id), { method: "PATCH", headers: cabeceras, body: JSON.stringify(cuerpo) });
      // El gist pudo haberse borrado a mano: en ese caso se crea uno nuevo.
      if (res.status === 404) { id = ""; res = null; }
    }
    if (!res) {
      res = await fetch("https://api.github.com/gists", { method: "POST", headers: cabeceras, body: JSON.stringify(cuerpo) });
    }
    if (res.status === 401) throw new Error("El token no es válido o venció.");
    if (res.status === 403) throw new Error("GitHub rechazó el pedido (permisos o límite de uso).");
    if (!res.ok) throw new Error("GitHub respondió " + res.status + ".");

    const g = await res.json();
    if (!g || !g.id) throw new Error("La respuesta de GitHub no trajo el id del gist.");
    try { localStorage.setItem(gistKeyMes(state.anio, state.mes), g.id); } catch (e) {}
    state.publicando = false;
    state.modalGist = { link: SHARE_BASE + "?gist=" + g.id, nuevo: !id };
    render();
  } catch (e) {
    state.publicando = false; render();
    alert("No se pudo publicar: " + (e && e.message ? e.message : e));
  }
}

// ─── ABRIR UN MES PUBLICADO (?gist=id) ───────────────────────
// La lectura es anónima: quien recibe el link NO necesita token.
function leerGistDeURL() {
  const m = String(location.search || "").match(/[?&]gist=([A-Za-z0-9]+)/);
  return m ? m[1] : null;
}
async function cargarDesdeGist(id) {
  try {
    const res = await fetch("https://api.github.com/gists/" + encodeURIComponent(id), {
      headers: { "Accept": "application/vnd.github+json" },   // sin Authorization
    });
    if (res.status === 404) throw new Error("La planilla publicada ya no existe o el link es incorrecto.");
    if (!res.ok) throw new Error("GitHub respondió " + res.status + ".");
    const g = await res.json();
    const archivos = Object.values(g.files || {});
    const f = archivos.find(x => /^guardiasync_.*\.json$/i.test(x.filename || "")) || archivos[0];
    if (!f) throw new Error("El gist no tiene ningún archivo de planilla.");
    // Los archivos grandes vienen truncados y hay que bajarlos del raw_url.
    const texto = (f.truncated && f.raw_url) ? await (await fetch(f.raw_url)).text() : f.content;
    const pkg = JSON.parse(texto);
    if (!pkg || !pkg.d || typeof pkg.a !== "number" || typeof pkg.m !== "number") throw new Error("El contenido publicado no tiene el formato esperado.");
    aplicarPaqueteCompartido(pkg);
    render();
  } catch (e) {
    document.getElementById("app").innerHTML = `<div style="font-family:'Inter',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#eef0f3">
      <div style="max-width:420px;text-align:center;background:#fff;border-radius:14px;padding:28px;box-shadow:0 4px 24px rgba(0,0,0,.12)">
        <div style="font-family:Georgia,serif;font-size:1.1rem;color:#111827;margin-bottom:8px">No se pudo abrir la planilla</div>
        <div style="font-size:0.83rem;color:#6b7280;line-height:1.6">${escHTML(e && e.message ? e.message : String(e))}</div>
      </div>
    </div>`;
  }
}

// Se guarda aparte de guardias_config: es un base64 grande y no conviene mezclarlo
// con el JSON de configuración (que se lee y reescribe en cada edición de turno).
const LOGO_KEY = "guardias_logo";
function cargarLogo() { if (state.compartido) return ""; try { return localStorage.getItem(LOGO_KEY) || ""; } catch (e) { return ""; } }
function borrarLogo() {

  render();

// Guarda el data URL, controlando el peso (localStorage ronda los 5 MB en total).
function finLogo(dataUrl, input) {
  if (input) input.value = "";
  if (dataUrl.length > 1200000) {
    alert("La imagen quedó muy pesada aun después de reducirla. Probá con un logo más simple o en PNG.");
    return;
  }
  try { localStorage.setItem(LOGO_KEY, dataUrl); }
  catch (e) { alert("No se pudo guardar el logo: no hay espacio de almacenamiento disponible."); return; }
  render();
}
function subirLogo(ev) {
  const file = ev.target.files && ev.target.files[0];
  if (!file) return;
  if (!/^image\//.test(file.type)) { alert("Elegí un archivo de imagen (PNG, JPG o SVG)."); ev.target.value = ""; return; }
  const input = ev.target;
  const reader = new FileReader();
  reader.onerror = () => { alert("No se pudo leer el archivo."); input.value = ""; };
  reader.onload = () => {
    // SVG: se guarda tal cual (es texto y pesa poco). Rasterizarlo perdería la calidad vectorial.
    if (/svg/i.test(file.type)) { finLogo(String(reader.result), input); return; }
    // PNG/JPG: se reduce a 400px de alto antes de guardar, para no llenar el localStorage
    // con la foto original (una imagen de cámara en base64 lo desborda sola).
    const img = new Image();
    img.onerror = () => { alert("No se pudo leer la imagen."); input.value = ""; };
    img.onload = () => {
      const maxAlto = 400;
      const esc = Math.min(1, maxAlto / (img.height || maxAlto));
      const c = document.createElement("canvas");
      c.width = Math.max(1, Math.round(img.width * esc));
      c.height = Math.max(1, Math.round(img.height * esc));
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      finLogo(c.toDataURL("image/png"), input);   // PNG conserva la transparencia
    };
    img.src = String(reader.result);
  };
  reader.readAsDataURL(file);
}

// Genera un mes "en blanco" pre-llenado con los turnos de la config, todos como ⚠️ Pendiente.
// Cada turno usa su rol real (D12/N12/A6…) con el médico fantasma: así el turno se ve en rojo
// y además se sabe QUÉ turno falta cubrir (y si es de tipo Guardia, para el badge).
function generarMesDesdeConfig(anio, mes) {
  const cal = generarMesVacio(anio, mes);
  const total = new Date(anio, mes + 1, 0).getDate();
  for (let d = 1; d <= total; d++) {
    const f = `${anio}-${String(mes + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
    const dow = (new Date(anio, mes, d).getDay() + 6) % 7;   // base-lunes
    const asigs = [];
    turnosDeDow(dow).forEach((t, ti) => {
      const n = Math.max(1, Number(t.requeridos) || 1);
      for (let k = 0; k < n; k++) {
        asigs.push({ medicoId: 0, rol: t.rol, horario: t.horario, id: Date.now() + d * 1000 + ti * 10 + k });
      }
    });
    cal[f].asignaciones = asigs;
  }
  return cal;
}

// ─── CAMBIO 4: PATRÓN POR DÍA DE SEMANA DESDE UN MES REAL ────
const DOW_NOMBRE = ["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado","Domingo"];   // base-lunes 0=Lun … 6=Dom

// Calendario de un mes: primero el que está en memoria, si no el guardado en localStorage.

}

// Extrae de un calendario el "molde" de cada día de semana: para cada día de semana se toma
// el PRIMER día del mes que cae en ese día de semana y tiene guardias cargadas.
// Ojo: NO es el día 1, 2, 3… del mes — es el primer lunes real, el primer martes real, etc.
// Devuelve { [dow]: { fecha, dia, asignaciones } } para que la vista previa pueda mostrar
// exactamente el mismo molde que se va a aplicar.
function moldesDeCalendario(cal) {
  const moldes = {};
  Object.keys(cal || {}).sort().forEach(f => {          // orden cronológico (las claves son AAAA-MM-DD)
    const [y, m, d] = f.split("-").map(Number);
    if (!y || !m || !d) return;
    const dow = (new Date(y, m - 1, d).getDay() + 6) % 7;   // base-lunes
    if (moldes[dow]) return;                                 // ya se tomó el primero de ese día de semana
    const asigs = (cal[f] && cal[f].asignaciones) || [];
    if (!asigs.length) return;                               // día vacío: seguir buscando el siguiente igual
    moldes[dow] = { fecha: f, dia: d, asignaciones: asigs };
  });
  return moldes;
}
function patronDeCalendario(cal) {
  const patron = {};
  const moldes = moldesDeCalendario(cal);
  Object.keys(moldes).forEach(dow => { patron[dow] = moldes[dow].asignaciones; });
  return patron;
}
// Genera el mes nuevo replicando, para cada fecha, el molde de SU día de semana.
// No hay corrimiento posible: no importa en qué día arranca el mes ni cuántos días tiene.
function aplicarPatronDesdeCal(anio, mes, calOrigen) {
  const patron = patronDeCalendario(calOrigen);
  if (!Object.keys(patron).length) return aplicarPatronMes(anio, mes);   // sin datos previos: patrón por defecto
  const cal = generarMesVacio(anio, mes);
  const total = new Date(anio, mes + 1, 0).getDate();
  for (let d = 1; d <= total; d++) {
    const f = `${anio}-${String(mes + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
    const dow = (new Date(anio, mes, d).getDay() + 6) % 7;   // base-lunes
    const molde = patron[dow] || [];
    cal[f].asignaciones = molde.map((a, i) => {
      const c = { ...a };          // conserva medicoId, rol y el horario propio de cada médico
      delete c.uid;                // uid nuevo por copia
      c.id = Date.now() + d * 100 + i;
      return c;
    });
  }
  return cal;
}

// ¿La asignación es un turno de GUARDIA? (D12/N12 o cualquier rol del grupo "Guardia").
function esGuardia(a) { return !!a && getRol(a.rol).grupo === "Guardia"; }

// PUNTO 3 — Un día cuenta como "sin cubrir" si le falta cobertura de GUARDIA:
//   · está literalmente vacío, o
//   · tiene un turno de guardia marcado como ⚠️ Pendiente, o
//   · tiene un rol PEN suelto (turno sin definir): si se marcó un pendiente, algo falta.
// Los apoyos/especiales pendientes con turno definido NO lo hacen contar.
function diaSinCubrir(fecha) {
  const asigs = diaData(fecha).asignaciones || [];
  if (!asigs.length) return true;
  return asigs.some(a => esPendiente(a) && (a.rol === "PEN" || esGuardia(a)));
}
function sinCubrir() {
  return Object.keys(state.calendario || {}).filter(f => diaSinCubrir(f)).length;
}
// PUNTO 2 — Total de turnos pendientes del mes (rol PEN o médico fantasma), de cualquier tipo.
function turnosPendientesMes() {
  return Object.keys(state.calendario || {}).reduce(
    (n, f) => n + (diaData(f).asignaciones || []).filter(esPendiente).length, 0);
}

function getStats() {
  const s = {};
  medicos.forEach(m => { s[m.id] = {total:0, D12:0, N12:0, apoyo:0}; });
  Object.values(state.calendario).forEach(dia => {
    dia.asignaciones.forEach(a => {
      if(!s[a.medicoId]) return;
      s[a.medicoId].total++;
      if(a.rol==="D12") s[a.medicoId].D12++;
      else if(a.rol==="N12") s[a.medicoId].N12++;
      else s[a.medicoId].apoyo++;
    });
  });
  return s;
}

// ─── ORDEN DE ASIGNACIONES (CAMBIO 1) ────────────────────────
// Hora de entrada: solo si el horario es un rango tipo "8-20", "08–20 hs", "07-19hs".
// Los turnos sin rango (Apoyo 6hs, Policlínica, Interno) devuelven null y van después.
function horaInicioDe(a) {
  const m = String(horarioDe(a)).match(/(\d{1,2})\s*[-–—]\s*\d{1,2}/);
  return m ? parseInt(m[1], 10) : null;
}
// Clave de orden (3 niveles): grupo → hora de entrada → rol.
//   grupo 0 = guardia diurna (D12 o rol de guardia que entra entre las 06 y las 19)
//   grupo 1 = guardia nocturna (entra 19hs o más tarde, o de madrugada)
//   grupo 2 = apoyos y roles especiales (van siempre al final, tengan o no rango horario)
// Sin hora reconocible => eff 99, o sea al final de su propio grupo.
function claveOrden(a) {
  const esApoyo = (a.rol !== "D12" && a.rol !== "N12");
  const h = horaInicioDe(a);
  const nocturno = (h != null) && (h >= 19 || h < 6);
  const grupo = esApoyo ? 2 : (nocturno ? 1 : 0);
  const eff = (h == null) ? 99 : (h < 6 ? h + 24 : h);   // 0hs→24, 2hs→26… para que la madrugada quede después de las 20
  return [grupo, eff, (ROL_ORDEN[a.rol] !== undefined ? ROL_ORDEN[a.rol] : 99)];
}
// MEJORA 3: ordenar automáticamente por horario (hora de entrada): diurnos, luego nocturnos, luego apoyos.
function ordenarAsignaciones(asigs) {
  return [...(asigs || [])].sort((a, b) => {
    const ka = claveOrden(a), kb = claveOrden(b);
    return (ka[0] - kb[0]) || (ka[1] - kb[1]) || (ka[2] - kb[2]);
  });
}
// uid estable para drag & drop (se persiste como campo interno de la asignación).
function asigUid(a) {
  if (!a.uid) a.uid = "u" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  return a.uid;
}

// ─── RENDER ASIGNACIÓN EN CELDA (CAMBIOS 2 y 3) ──────────────
function renderAsigCelda(a, fecha) {
  const m = getMedico(a.medicoId);
  const rol = getRol(a.rol);
  if(!m) return "";
  const esApoyo = a.rol !== "D12" && a.rol !== "N12";
  // MEJORA 2: cada médico es arrastrable entre días (solo en modo jefe)
  const dragAttrs = state.jefe ? `draggable="true" ondragstart="dragStartMed(event,'${fecha}','${asigUid(a)}')" ondragend="dragEndMed(event)"` : "";
  const grab = state.jefe ? "cursor:grab" : "default";

  // Turno pendiente de cubrir: fila roja destacada, sin nombre de médico.
  // Si el turno tiene horario propio (ej. "08-20hs") se muestra para saber QUÉ turno falta cubrir.
  if (esPendiente(a)) {
    const pen = getRol("PEN");
    const horaTxt = (a.horario && String(a.horario).trim()) ? String(a.horario) : (a.rol !== "PEN" ? getRol(a.rol).label : "");
    return `<div class="asig-row apoyo" ${dragAttrs} style="--rol-color:${pen.color};--rol-bg:${pen.bg};border-left-color:${pen.color};background:${pen.bg};${grab}">
      <div class="asig-rol-label" style="color:${pen.color};font-weight:700">⚠️ Pendiente</div>
      ${horaTxt ? `<div class="asig-nombre apoyo-nombre" style="color:${pen.color}">${escHTML(horaTxt)}</div>` : ""}
    </div>`;
  }

  if(esApoyo) {
    // Apoyo: mantiene color del rol
    return `<div class="asig-row apoyo" ${dragAttrs} style="--rol-color:${rol.color};--rol-bg:${rol.bg};border-left-color:${rol.color};background:${rol.bg};${grab}">
      <div class="asig-rol-label" style="color:${rol.color}">${escHTML(horarioDe(a))}</div>
      <div class="asig-nombre apoyo-nombre" style="color:${rol.color}">${escHTML(m.nombre)}</div>
    </div>`;
  } else {
    // CAMBIO 2+3: guardia en gris neutro, con horario al lado del nombre
    return `<div class="asig-row guardia" ${dragAttrs} style="${grab}">
      <div class="asig-nombre">${escHTML(m.nombre)}<span class="horario">· ${escHTML(horarioDe(a))}</span></div>
    </div>`;
  }
}

// Fecha de hoy en formato AAAA-MM-DD según la zona horaria del navegador.
// OJO: no usar toISOString(), que convierte a UTC — al oeste de Greenwich devuelve
// el día siguiente durante las últimas horas de cada jornada (en Uruguay, desde las 21:00).
function hoyISO() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
// ─── RENDER CELDA DÍA ────────────────────────────────────────
function renderCeldaDia(fecha) {
  const data = diaData(fecha);
  const dia = Number(fecha.split("-")[2]);
  const hoy = hoyISO();
  const esHoy = fecha === hoy;
  const [_y,_m,_d] = fecha.split("-").map(Number);
  const esFinde = [0,6].includes(new Date(_y, _m-1, _d).getDay());
  // Sin cobertura real: los turnos pendientes no cuentan (pero el cartel "Sin cubrir"
  // solo se muestra si el día está literalmente vacío, para no duplicar el aviso).
  const sinCubrirDia = diaSinCubrir(fecha);   // misma regla que el badge del header (PUNTO 3)
  const diaVacio = data.asignaciones.length === 0;

  const asigsFiltradas = state.filtroMedico
    ? data.asignaciones.filter(a => String(a.medicoId) === state.filtroMedico)
    : data.asignaciones;
  const opacidad = state.filtroMedico && asigsFiltradas.length === 0 ? 0.4 : 1;

  // CAMBIO 1: ordenar D12 primero, N12 segundo
  const asigsOrdenadas = ordenarAsignaciones(asigsFiltradas);

  let clases = "cal-cell";
  if(esHoy) clases += " hoy";
  else if(esFinde) clases += " finde";
  else if(sinCubrirDia) clases += " sin-cubrir";

  let numClases = "cal-num";
  if(esHoy) numClases += " hoy";
  else if(esFinde) numClases += " finde";

  const asigHTML = asigsOrdenadas.map(a => renderAsigCelda(a, fecha)).join("");
  const sinCubrirHTML = diaVacio && !state.filtroMedico
    ? `<div class="asig-sin-cubrir"><span style="font-size:0.6rem;color:#b91c1c;font-weight:600">Sin cubrir</span></div>`
    : "";

  // MEJORA 1/4: resaltar día origen cuando se está copiando o intercambiando
  // En modo swap: origen en verde sólido, destinos posibles en borde punteado naranja con cursor especial
  // El resaltado es el mismo para el swap de día completo y para el de médicos puntuales.
  const swapOrigenActivo = state.swapDiaOrigen || (state.swapMedicoOrigen && state.swapMedicoOrigen.fecha);
  const esSwapOrigen = swapOrigenActivo === fecha;
  const esSwapDestino = swapOrigenActivo && swapOrigenActivo !== fecha;
  const esCopyOrigen = state.copiarDiaOrigen === fecha;
  const copiaStyle = esCopyOrigen ? ";outline:3px solid #2563eb;outline-offset:-3px;background:#eff6ff"
    : esSwapOrigen ? ";outline:3px solid #16a34a;outline-offset:-3px;background:#f0fdf4"
    : esSwapDestino ? ";outline:2px dashed #ea580c;outline-offset:-2px;cursor:crosshair"
    : "";
  // Ausencias: alerta destacada si hay ausencia sin médico de reemplazo
  const ausAlerta = diaAusSinCubrir(fecha) ? ";box-shadow:inset 0 0 0 2px #dc2626" : "";

  return `<div id="cell-${fecha}" class="${clases}" style="opacity:${opacidad}${copiaStyle}${ausAlerta}" onclick="clickDia('${fecha}')" ondragover="permitirDrop(event)" ondragleave="salirDrop(event)" ondrop="soltarMedico(event,'${fecha}')">
    <div class="cal-num-wrap">
      <span class="${numClases}">${dia}</span>
      <div class="cal-flags">
        ${data.notas ? `<span style="font-size:0.55rem;color:#b45309;font-weight:700">📌</span>` : ""}
        ${(function(){ const aus = ausDeDiaConGuardia(fecha); if (!aus.length) return ""; const tipos = [...new Set(aus.map(a => a.tipo))]; return `<span onclick="abrirAusDetalle('${fecha}',event)" title="${aus.length} ausencia(s) con guardia asignada — ver detalle" style="font-size:0.58rem;cursor:pointer">${tipos.map(t => tipoAus(t).emoji).join("")}</span>`; })()}
        ${sinCubrirDia && !state.filtroMedico ? `<span style="font-size:0.58rem;color:#b91c1c;font-weight:700">!</span>` : ""}
      </div>
    </div>
    <div class="cal-asigs">${asigHTML}${sinCubrirHTML}</div>
  </div>`;
}

// ─── RENDER CALENDARIO ───────────────────────────────────────
function renderCalendario() {
  const totalDias = new Date(state.anio, state.mes+1, 0).getDate();
  // Convertir a base-lunes: JS getDay() devuelve 0=Dom,1=Lun,...,6=Sáb
  // El header empieza en Lunes, entonces: Dom→6, Lun→0, Mar→1 ... Sáb→5

  // Leyenda colapsable: una sola línea con los 3 grupos; el detalle se abre en acordeón.

  const COLOR_GRUPO = { Guardia:"#334155", Apoyo:"#b45309", Especial:"#0e7490" };
  const cabecerasHTML = grupos.map(g => {
    const abierto = state.leyendaGrupo === g;
    return `<button class="leyenda-toggle${abierto ? " abierto" : ""}" onclick="toggleLeyenda('${g}')" title="Ver los turnos de tipo ${g}">

          <span style="font-size:0.68rem;font-weight:600;color:${r.color}">${r.id} — ${escHTML(r.desc)}</span>

    : "";
  const leyendaHTML = `<div class="leyenda-linea">${cabecerasHTML}</div>${detalleHTML}`;

  // Opciones filtro médico
  const opsMedico = medicos.map(m => `<option value="${m.id}">${escHTML(m.sigla)} — ${escHTML(m.nombre)}</option>`).join("");

  // Vacíos iniciales

  const rellenoHTML = Array.from({length:relleno}, (_,i) => `<div style="min-height:110px;border-right:1px solid #d1d5db;border-bottom:1px solid #d1d5db;background:#f8f9fa"></div>`).join("");

  // Dias semana — empezando en Lunes
  const diasOrden = ["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"];

  // MEJORA 8: título y contenido según modo (mensual/semanal)
  let tituloCal, gridInner, gridStyle = "";
  if (state.modoCal === "semana") {
    const diasSem = semanaDeFecha(anclaSemana());
    tituloCal = `Semana ${dnum(diasSem[0])}–${dnum(diasSem[6])} · ${MESES[state.mes]} ${state.anio}`;
    gridInner = diasSem.map(f => renderCeldaDia(f)).join("");
    gridStyle = "grid-auto-rows:minmax(300px,auto)";
  } else {
    tituloCal = `${MESES[state.mes]} ${state.anio}`;
    gridInner = vaciosHTML + diasHTML + rellenoHTML;
  }


  return `
    <div class="toolbar">
      <div class="toolbar-left">
        <button class="btn btn-secondary btn-sm" onclick="navPrev()">‹</button>

      </div>
      <div class="toolbar-right">
        <select class="filtro-select" onchange="state.filtroMedico=this.value;render()">
          <option value="">Todos los médicos</option>
          ${opsMedico}
        </select>

        <div style="position:relative">
          <button id="menu-toolbar-btn" class="btn btn-secondary btn-sm" title="Más acciones"

function cfgSetCampo(campo, valor) { state.config[campo] = valor; guardarConfig(); }
function cfgAddTurno(dow) {
  const arr = turnosDeDow(dow);
  arr.push({ id: "t" + dow + "_" + Date.now().toString(36), rol: "D12", nombre: getRol("D12").desc, horario: getRol("D12").label, requeridos: 1 });
  state.config.turnos[dow] = arr;
  guardarConfig(); render();
}
function cfgSetTurno(dow, id, campo, valor) {
  const t = turnosDeDow(dow).find(x => x.id === id);
  if (!t) return;
  if (campo === "requeridos") t.requeridos = Math.max(1, Number(valor) || 1);
  else if (campo === "rol") { t.rol = valor; if (!t.nombre) t.nombre = getRol(valor).desc; }
  else t[campo] = valor;
  guardarConfig();
  if (campo === "rol" || campo === "requeridos") render();
}
// Validación: avisar si el turno ya tiene asignaciones cargadas en el mes en pantalla.
function cfgDelTurno(dow, id) {
  const t = turnosDeDow(dow).find(x => x.id === id);
  if (!t) return;
  let usados = 0;
  Object.keys(state.calendario || {}).forEach(f => {
    const [y, mm, dd] = f.split("-").map(Number);
    if ((new Date(y, mm - 1, dd).getDay() + 6) % 7 !== dow) return;
    (state.calendario[f].asignaciones || []).forEach(a => {
      if (a.rol === t.rol && String(horarioDe(a)) === String(t.horario) && !esPendiente(a)) usados++;
    });
  });
  const aviso = usados
    ? `\n\n⚠️ Hay ${usados} asignación(es) activas de este turno en ${MESES[state.mes]}. Eliminarlo de la plantilla NO borra esas guardias, pero los meses nuevos ya no lo van a incluir.`
    : "";
  if (!confirm(`¿Eliminar el turno "${t.nombre || getRol(t.rol).desc}" de los ${DOW_NOMBRE[dow]}?${aviso}`)) return;
  state.config.turnos[dow] = turnosDeDow(dow).filter(x => x.id !== id);
  guardarConfig(); render();
}

function renderModalDia() {
  if(!state.modalDia) return "";
  const fecha = state.modalDia;
  const data = diaData(fecha);
  const dia = Number(fecha.split("-")[2]);
  const [__y,__m,__d] = fecha.split("-").map(Number);
  const nombreDia = DIAS_FULL[new Date(__y, __m-1, __d).getDay()];

  // El médico fantasma PENDIENTE se ofrece solo acá (no en el filtro ni en Equipo).
  const opsMedico = medicos.map(m => `<option value="${m.id}">${escHTML(m.sigla)} — ${escHTML(m.nombre)}</option>`).join("")
    + `<option value="0">⚠️ — PENDIENTE (turno sin cubrir)</option>`;
  const nHist = histGet(fecha).length;   // el botón de historial solo aparece si hay cambios registrados
  // Cuántos médicos de ESTE día están tildados: decide si "Intercambiar" es individual o de día completo.
  const uidsDia = (data.asignaciones || []).map(a => asigUid(a));
  const nSel = uidsDia.filter(u => state.medicoSelModal.has(u)).length;

  const asigsHTML = data.asignaciones.length === 0
    ? `<div style="padding:14px;text-align:center;color:#6b7280;font-size:0.82rem;background:#fef2f2;border-radius:7px;border:1px dashed #b91c1c">Sin médicos asignados este día</div>`
    : ordenarAsignaciones(data.asignaciones).map((a) => {
        const m = getMedico(a.medicoId);
        const rol = getRol(a.rol);
        if(!m) return "";
        // CAMBIO 5: cada fila se direcciona por uid, no por índice del array ordenado.
        // Así editar el horario de un médico nunca escribe sobre el de otro, aunque el orden cambie.
        const uid = asigUid(a);
        const editando = state.editHorario === `${fecha}|${uid}`;
        const horarioHTML = editando
          ? `<input id="horario-edit-input" type="text" value="${escAttr(horarioDe(a))}"
               onblur="guardarHorario('${fecha}','${uid}',this.value)"
               onkeydown="if(event.key==='Enter'){this.blur();}else if(event.key==='Escape'){cancelEditHorario(event);}"
               style="font-size:0.7rem;font-weight:600;width:88px;padding:1px 5px;border:1px solid ${rol.color};border-radius:4px;color:${rol.color}">`
          : `<span onclick="editarHorario('${fecha}','${uid}')" title="Click para editar el horario"
               style="cursor:pointer;text-decoration:underline dotted;text-underline-offset:2px">${escHTML(horarioDe(a))}</span>`;
        // Selección para intercambio individual: fondo celeste + borde azul cuando está tildado.
        const sel = state.medicoSelModal.has(uid);
        const selEstilo = sel
          ? `background:#eff6ff;border:2px solid #2563eb`
          : `background:${rol.bg};border:1px solid ${rol.color}33`;
        // Turno pendiente: en vez de nombre + horario, ofrece los selectores para cubrirlo.
        if (esPendiente(a)) {

function setView(v) { state.view = v; state.menuToolbar = false; render(); }

// Acordeón de la leyenda: clic en el grupo abierto lo cierra.
function toggleLeyenda(g) {
  state.leyendaGrupo = (state.leyendaGrupo === g) ? null : g;

}

// ─── MENÚ "≡" DE LA TOOLBAR ──────────────────────────────────
function toggleMenuToolbar(ev) {
  if (ev) ev.stopPropagation();   // que no lo cierre el listener de "clic afuera"
  state.menuToolbar = !state.menuToolbar;
  render();
}
function cerrarMenuToolbar() { state.menuToolbar = false; render(); }
// Cierra el menú y después ejecuta la acción elegida.
function accionMenu(fn) {
  state.menuToolbar = false;
  render();
  if (typeof fn === "function") fn();
}
// "Importar mes" es especial: NO se puede re-renderizar antes de abrir el diálogo de archivos,
// porque eso desconecta el <input type=file> del DOM y su onchange nunca dispararía.
function menuImportarMes(ev) {
  if (ev) ev.stopPropagation();
  state.menuToolbar = false;
  const menu = document.getElementById("menu-toolbar");
  if (menu) menu.style.display = "none";   // se oculta sin re-render
  const inp = document.getElementById("import-json-input");
  if (inp) inp.click();
}
// Clic fuera del menú => cerrarlo. Se registra una sola vez (el render reemplaza el HTML,
// así que un listener por elemento se perdería en cada render).
document.addEventListener("click", function (ev) {
  if (!state.menuToolbar) return;
  const t = ev.target;
  if (t && t.closest && (t.closest("#menu-toolbar") || t.closest("#menu-toolbar-btn"))) return;
  state.menuToolbar = false;
  render();
});

// ─── MEJORA 11: PLANTILLA MENSUAL ────────────────────────────
function guardarPlantilla() {
  const tpl = {};
  Object.keys(state.calendario || {}).forEach(f => {
    const d = state.calendario[f];
    if (d.asignaciones && d.asignaciones.length) {
      tpl[dnum(f)] = d.asignaciones.map(a => {
        const o = { medicoId: a.medicoId, rol: a.rol };   // roles y horarios, no fechas
        if (a.horario) o.horario = a.horario;
        return o;
      });
    }
  });
  if (!Object.keys(tpl).length) { alert("El mes actual no tiene guardias para guardar como plantilla."); return; }
  try { localStorage.setItem("guardias_plantilla", JSON.stringify(tpl)); } catch(e) {}
  alert("Plantilla guardada (" + Object.keys(tpl).length + " días con guardias).");
}
function aplicarPlantilla() {
  let tpl; try { tpl = JSON.parse(localStorage.getItem("guardias_plantilla")); } catch(e) {}
  if (!tpl || !Object.keys(tpl).length) { alert("No hay ninguna plantilla guardada todavía."); return; }
  const tieneDatos = Object.values(state.calendario || {}).some(d => d.asignaciones && d.asignaciones.length);
  if (tieneDatos && !confirm("Este mes ya tiene guardias cargadas. ¿Aplicar la plantilla igual? (sobrescribe los días incluidos en la plantilla)")) return;
  const total = new Date(state.anio, state.mes + 1, 0).getDate();
  let aplicados = 0;
  Object.keys(tpl).forEach(dn => {
    const d = parseInt(dn, 10);
    if (d < 1 || d > total) return;
    const f = `${state.anio}-${String(state.mes + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
    if (!state.calendario[f]) state.calendario[f] = { asignaciones: [], notas: "" };
    state.calendario[f].asignaciones = tpl[dn].map((a, i) => ({ ...a, id: Date.now() + i }));
    aplicados++;
  });
  guardarEstado();
  render();
  alert("Plantilla aplicada a " + aplicados + " día(s).");
}

};
function tipoAus(t) { return TIPOS_AUS[t] || TIPOS_AUS.otro; }
function ausKey(anio, mes) { return `guardias_ausencias_${anio}_${mes + 1}`; }
function ausGetMes(anio, mes) {
  if (state.compartido) return [];   // el link no comparte ausencias
  try { const a = JSON.parse(localStorage.getItem(ausKey(anio, mes))); return Array.isArray(a) ? a : []; }
  catch (e) { return []; }
}
function ausSaveMes(anio, mes, arr) { try { localStorage.setItem(ausKey(anio, mes), JSON.stringify(arr)); } catch (e) {} }

// ─── AUSENCIAS QUE CRUZAN MESES ──────────────────────────────
// Las ausencias se guardan por mes (una clave de localStorage por mes), así que un rango
// que cruza meses se parte en SEGMENTOS: uno por cada mes que toca. Todos los segmentos
// comparten `grupoId` y guardan el rango completo (fDesde/fHasta) para poder mostrarlo entero.
const MESES_CORTO = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
function isoADMY(iso) { const p = String(iso || "").split("-").map(Number); return { anio: p[0], mes: p[1] - 1, dia: p[2] }; }
function fmtFechaCorta(iso) { const f = isoADMY(iso); return (f.dia && MESES_CORTO[f.mes]) ? `${f.dia} ${MESES_CORTO[f.mes]}` : ""; }
function fmtRangoAus(a) {
  if (a.fDesde && a.fHasta) {
    return a.fDesde === a.fHasta ? fmtFechaCorta(a.fDesde) : `${fmtFechaCorta(a.fDesde)} — ${fmtFechaCorta(a.fHasta)}`;
  }
  return a.desde === a.hasta ? `día ${a.desde}` : `días ${a.desde}–${a.hasta}`;   // formato viejo
}
// Parte un rango de fechas completas en {anio, mes, desde, hasta} por cada mes involucrado.
function segmentosPorMes(fDesde, fHasta) {
  const a = isoADMY(fDesde), b = isoADMY(fHasta);
  const segs = [];
  let y = a.anio, m = a.mes;
  while (y < b.anio || (y === b.anio && m <= b.mes)) {
    const totalDias = new Date(y, m + 1, 0).getDate();
    segs.push({
      anio: y, mes: m,
      desde: (y === a.anio && m === a.mes) ? a.dia : 1,
      hasta: (y === b.anio && m === b.mes) ? b.dia : totalDias,
    });
    m++; if (m > 11) { m = 0; y++; }
    if (segs.length > 36) break;   // tope de seguridad
  }
  return segs;
}
function fechaDeDia(d) { return `${state.anio}-${String(state.mes + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`; }
function ausDeDia(fecha) { const d = dnum(fecha); return ausGet().filter(a => d >= a.desde && d <= a.hasta); }
// Ausencias RELEVANTES para la celda del calendario: solo las de médicos que además tienen
// una asignación ese día. Una licencia de 15 días no debe marcar los 15 días del calendario:
// solo aquellos en los que esa persona realmente tenía guardia.
function ausDeDiaConGuardia(fecha) {
  const asigs = diaData(fecha).asignaciones || [];
  return ausDeDia(fecha).filter(a => asigs.some(x => Number(x.medicoId) === Number(a.medicoId)));
}
// Días de ausencia (licencia/enfermedad/solicitud) sin ningún médico asignado => pendientes de cubrir.
function pendientesMes() {
  const dias = new Set();
  ausGet().forEach(a => {
    for (let d = a.desde; d <= a.hasta; d++) {
      const f = fechaDeDia(d);
      if (!asigsReales(f).length) dias.add(d);
    }
  });
  return dias.size;
}
function diaAusSinCubrir(fecha) {
  const aus = ausDeDia(fecha);
  if (!aus.length) return false;
  const cubierto = asigsReales(fecha).length > 0;
  return !cubierto;   // hay ausencia y no hay médico asignado (reemplazo)
}
function abrirAusencias() { state.ausPanel = true; render(); }
function cerrarAusencias() { state.ausPanel = false; render(); }
function abrirAusDetalle(fecha, ev) { if (ev) ev.stopPropagation(); state.ausDetalleFecha = fecha; render(); }
function cerrarAusDetalle() { state.ausDetalleFecha = null; render(); }
function guardarAusencia() {
  const f = state.ausForm;
  const medicoId = Number(f.medicoId);
  if (!medicoId) { alert("Elegí un médico."); return; }
  if (!f.fDesde || !f.fHasta) { alert("Elegí la fecha de inicio y la de fin."); return; }
  if (f.fDesde > f.fHasta) { alert("La fecha de fin no puede ser anterior a la de inicio."); return; }

  const segs = segmentosPorMes(f.fDesde, f.fHasta);
  const grupoId = Date.now();
  const motivo = (f.motivo || "").trim();
  segs.forEach((s, i) => {
    const arr = ausGetMes(s.anio, s.mes);
    arr.push({
      id: grupoId + i, grupoId, medicoId, tipo: f.tipo,
      desde: s.desde, hasta: s.hasta,        // días dentro de ESE mes (lo que usa ausDeDia)
      fDesde: f.fDesde, fHasta: f.fHasta,    // rango completo, para mostrarlo entero
      motivo, ts: grupoId,
    });
    ausSaveMes(s.anio, s.mes, arr);
  });

  state.ausForm = { medicoId: "", tipo: "licencia", fDesde: "", fHasta: "", motivo: "" };
  render();
  if (segs.length > 1) {
    alert(`Ausencia registrada: ${fmtRangoAus({fDesde:f.fDesde, fHasta:f.fHasta})} (${segs.length} meses afectados).`);
  }
}
// Borra la ausencia completa: todos sus segmentos, en todos los meses que toca.
function borrarAusencia(id) {
  const aus = ausGet().find(a => a.id === id);
  if (!aus) return;
  if (aus.grupoId && aus.fDesde && aus.fHasta) {
    segmentosPorMes(aus.fDesde, aus.fHasta).forEach(s => {
      ausSaveMes(s.anio, s.mes, ausGetMes(s.anio, s.mes).filter(x => x.grupoId !== aus.grupoId));
    });
  } else {
    ausSave(ausGet().filter(a => a.id !== id));   // ausencia vieja, de un solo mes
  }
  render();
}

function irHoy() {

  state.anio = hoy.getFullYear();

}

function prevMes() {

}

function nextMes() {

  const nm = state.mes === 11 ? 0 : state.mes+1;

}

function irAMes(anioNuevo, mesNuevo) {
  // Guardar mes actual (memoria + localStorage)
  state.historialMeses[`${state.anio}-${state.mes}`] = state.calendario;
  guardarEstado();

  const clave = `${anioNuevo}-${mesNuevo}`;
  const calGuardado = cargarCalMes(anioNuevo, mesNuevo);
  if(calGuardado) {
    state.calendario = calGuardado;
    state.historialMeses[clave] = calGuardado;
    state.anio = anioNuevo;
    state.mes = mesNuevo;
    render();
  } else if(state.historialMeses[clave]) {
    state.calendario = state.historialMeses[clave];
    state.anio = anioNuevo;
    state.mes = mesNuevo;
    render();
  } else {
    state.modalCopiar = { anioNuevo, mesNuevo, anioOrigen:state.anio, mesOrigen:state.mes };
    render();
  }
}

// Cerrar el modal de cambio de mes sin elegir nada: se queda en el mes que ya estaba en pantalla.
// Ojo: irAMes() NO cambia state.anio/state.mes cuando abre este modal, así que el calendario
// de fondo sigue siendo el de origen y no hay navegación que revertir.
// El caso delicado es venir de "Rehacer mes", que ya borró el mes de localStorage antes de
// preguntar: ahí se vuelve a guardar lo que sigue en memoria para no perder las guardias.
function cancelarCopiaMes() {
  state.modalCopiar = null;
  if (state.calendario) {
    state.historialMeses[`${state.anio}-${state.mes}`] = state.calendario;
    guardarEstado();
  }
  render();
}

function aplicarCopia(copiar) {
  const {anioNuevo, mesNuevo, anioOrigen, mesOrigen} = state.modalCopiar;

  // CAMBIO 4: se copia POR DÍA DE SEMANA usando el calendario REAL del mes anterior
  // (no posición a posición, y no el patrón hardcodeado): todos los lunes del mes nuevo
  // quedan como el primer lunes del mes origen, todos los martes como el primer martes, etc.
  const calOrigen = calDelMes(anioOrigen, mesOrigen);   // misma fuente que la vista previa del modal
  const calNuevo = copiar
    ? aplicarPatronDesdeCal(anioNuevo, mesNuevo, calOrigen)
    : generarMesDesdeConfig(anioNuevo, mesNuevo);   // pre-llenado con los turnos de la config, como ⚠️ Pendiente

  state.calendario = calNuevo;
  state.historialMeses[`${anioNuevo}-${mesNuevo}`] = calNuevo;
  state.anio = anioNuevo;
  state.mes = mesNuevo;
  state.modalCopiar = null;
  guardarEstado();
  render();
}

// ─── REHACER MES (descarta lo guardado y vuelve a preguntar) ──
// Sirve cuando el mes quedó con datos viejos de una versión anterior de la app:
// como irAMes() carga lo que haya en localStorage, un mes ya guardado nunca vuelve
// a mostrar el modal de "usar el mes anterior como base".
function rehacerMesDesdePatron() {
  const etiqueta = `${MESES[state.mes]} ${state.anio}`;
  if (!confirm(`¿Borrar las guardias guardadas de ${etiqueta} y regenerarlo a partir del mes anterior?\n\nEsto descarta los cambios hechos a mano en ${etiqueta}. Las ausencias y el historial no se tocan.`)) return;

  // Mes anterior (origen del patrón)
  const anioOrigen = state.mes === 0 ? state.anio - 1 : state.anio;
  const mesOrigen  = state.mes === 0 ? 11 : state.mes - 1;

  try { localStorage.removeItem(calKey(state.anio, state.mes)); } catch (e) {}
  delete state.historialMeses[`${state.anio}-${state.mes}`];

  // Reusa exactamente el mismo camino que el modal de cambio de mes.
  state.modalCopiar = { anioNuevo: state.anio, mesNuevo: state.mes, anioOrigen, mesOrigen };
  render();
}

// Busca una asignación concreta del día por su uid (identidad estable, independiente del orden).
function asigPorUid(fecha, uid) {
  return (diaData(fecha).asignaciones || []).find(a => a.uid === uid) || null;
}

function quitarAsignacion(fecha, uid) {
  const arr = (state.calendario[fecha] && state.calendario[fecha].asignaciones) || [];
  const raw = arr.findIndex(a => a.uid === uid);
  if (raw < 0) return;
  const a = arr[raw];
  const nom = getMedico(a.medicoId) ? getMedico(a.medicoId).nombre : "médico";
  arr.splice(raw, 1);
  histLog(fecha, `➖ ${nom} removido`, "");   // MEJORA 5

  render();

function iniciarCopiarDia(fecha) {

  render();
}
function cancelarCopiarDia() {

}
function clickDia(fecha) {
  if (!state.jefe) { abrirDiaVista(fecha); return; }   // solo lectura: detalle sin edición
  if (state.copiarDiaOrigen) {
    if (fecha === state.copiarDiaOrigen) { cancelarCopiarDia(); return; }  // clic en el origen = cancelar
    copiarDiaDestino(fecha);
    return;
  }
  if (state.swapDiaOrigen) {
    if (fecha === state.swapDiaOrigen) { cancelarSwapDia(); return; }
    swapDiaDestino(fecha);
    return;
  }
  if (state.swapMedicoOrigen) {

    abrirSwapMedicoPicker(fecha);

}
function copiarDiaDestino(destino) {
  const origen = state.copiarDiaOrigen;
  const dOrig = diaData(origen);
  const clon = (dOrig.asignaciones || []).map((a, i) => {
    const c = { ...a };
    delete c.uid;                       // uid nuevo para cada copia
    c.id = Date.now() + i;
    return c;
  });
  if (!state.calendario[destino]) state.calendario[destino] = { asignaciones: [], notas: "" };
  const dDest = state.calendario[destino];
  if (dDest.asignaciones && dDest.asignaciones.length > 0) {
    if (!confirm(`El día ${dnum(destino)} ya tiene ${dDest.asignaciones.length} médico(s). ¿Sobrescribir con las asignaciones del día ${dnum(origen)}?`)) return;
  }
  const motivo = pedirMotivo();   // MEJORA 6
  dDest.asignaciones = clon;
  state.copiarDiaOrigen = null;
  histLog(destino, `📋 Copiado desde el día ${dnum(origen)} (${clon.length} médico/s)`, motivo);   // MEJORA 5
  guardarEstado();
  render();
}

// ─── PEGAR A TODOS LOS DÍA-DE-SEMANA DEL MES ─────────────────
// dow: 0=Lun, 1=Mar, 2=Mié, 3=Jue, 4=Vie, 5=Sáb, 6=Dom (base-lunes)
function pegarEnDiaDeSemana(dow) {
  const origen = state.copiarDiaOrigen;
  if (!origen) return;
  const dOrig = diaData(origen);
  if (!dOrig.asignaciones || !dOrig.asignaciones.length) {
    alert("El día copiado no tiene asignaciones.");
    return;
  }
  const diasSemana = ["Lunes","Martes","Miércoles","Jueves","Viernes","Sábados","Domingos"];
  const totalDias = new Date(state.anio, state.mes + 1, 0).getDate();

  // Todos los días del MES EN PANTALLA que caen en ese día de semana, menos el día origen.
  const destinos = [];
  for (let d = 1; d <= totalDias; d++) {
    const fecha = `${state.anio}-${String(state.mes + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
    if ((new Date(state.anio, state.mes, d).getDay() + 6) % 7 !== dow) continue;   // base-lunes
    if (fecha === origen) continue;   // no pisar el día origen
    destinos.push(fecha);
  }
  if (!destinos.length) { alert(`No hay otros ${diasSemana[dow]} en ${MESES[state.mes]} para pegar.`); return; }

  const conDatos = destinos.filter(f => (diaData(f).asignaciones || []).length).length;
  const aviso = conDatos ? `\n\n${conDatos} de esos días ya tienen guardias y se van a sobrescribir.` : "";
  if (!confirm(`Pegar las ${dOrig.asignaciones.length} asignación/es del día ${dnum(origen)} en los ${destinos.length} ${diasSemana[dow]} de ${MESES[state.mes]} (${destinos.map(dnum).join(", ")})?${aviso}`)) return;

  let cuenta = 0;
  destinos.forEach(fecha => {
    // Clon profundo por día: cada copia es un objeto propio (medicoId, rol y horario incluidos),
    // así editar el horario en un día no arrastra a los demás.
    const clon = dOrig.asignaciones.map((a, i) => {
      const c = { ...a };
      delete c.uid;                                    // uid nuevo por copia
      c.id = Date.now() + dnum(fecha) * 100 + i;
      return c;
    });
    if (!state.calendario[fecha]) state.calendario[fecha] = { asignaciones: [], notas: "" };
    state.calendario[fecha].asignaciones = clon;
    histLog(fecha, `📋 Copiado desde día ${dnum(origen)} (pegar a todos los ${diasSemana[dow]})`, "");
    cuenta++;
  });
  guardarEstado();
  render();
  // No se cancela copiarDiaOrigen: el portapapeles queda activo para pegar en otro día de semana.
  alert(`Listo: ${cuenta} ${diasSemana[dow]} actualizados (días ${destinos.map(dnum).join(", ")}).`);
}

// ─── MEJORA 2: DRAG & DROP DE MÉDICO ENTRE DÍAS ──────────────
function dragStartMed(ev, fecha, uid) {

function dragEndMed(ev) {

function permitirDrop(ev) {

  const cell = ev.currentTarget;
  if (cell && cell.style) { cell.style.outline = "2px dashed #2563eb"; cell.style.outlineOffset = "-2px"; }

function salirDrop(ev) {
  const cell = ev.currentTarget;
  if (cell && cell.style && !(state.copiarDiaOrigen === cell.id.replace("cell-", ""))) cell.style.outline = "";
}
function soltarMedico(ev, destino) {
  ev.preventDefault();
  const cell = ev.currentTarget; if (cell && cell.style) cell.style.outline = "";
  let payload; try { payload = JSON.parse(ev.dataTransfer.getData("text/plain")); } catch (e) { return; }
  const { fecha: origen, uid } = payload || {};
  if (!origen || origen === destino) return;
  const dOrig = diaData(origen);
  const idx = (dOrig.asignaciones || []).findIndex(a => a.uid === uid);
  if (idx < 0) return;
  const motivo = pedirMotivo();   // MEJORA 6
  const [asig] = dOrig.asignaciones.splice(idx, 1);   // mantiene rol, horario y demás campos
  if (!state.calendario[destino]) state.calendario[destino] = { asignaciones: [], notas: "" };
  state.calendario[destino].asignaciones.push(asig);
  const nom = getMedico(asig.medicoId) ? getMedico(asig.medicoId).nombre : "médico";
  histLog(origen, `➡️ ${nom} movido al día ${dnum(destino)}`, motivo);   // MEJORA 5
  histLog(destino, `⬅️ ${nom} movido desde el día ${dnum(origen)}`, motivo);
  guardarEstado();
  render();
}

function pedirMotivo() {

// ─── MEJORA 5: HISTORIAL DE CAMBIOS POR DÍA (localStorage) ───
function histKey(fecha) { return `guardias_hist_${fecha}`; }
function histGet(fecha) {
  try { const a = JSON.parse(localStorage.getItem(histKey(fecha))); return Array.isArray(a) ? a : []; }
  catch (e) { return []; }
}
function histLog(fecha, texto, motivo) {
  if (state.compartido) return;
  try {
    const arr = histGet(fecha);
    arr.push({ ts: Date.now(), texto: texto, motivo: motivo || "" });
    while (arr.length > 60) arr.shift();
    localStorage.setItem(histKey(fecha), JSON.stringify(arr));
  } catch (e) {}
}

// ─── PANEL DE AUSENCIAS Y SOLICITUDES ────────────────────────
// ─── HISTORIAL DE INTERCAMBIOS DEL MES ───────────────────────
// Recorre el historial (localStorage) de todos los días del mes y arma la lista de
// intercambios y movimientos. Cada operación deja DOS entradas (una en cada día
// involucrado), así que se toma solo el lado que contiene el día contrario.
// Quita el emoji inicial del texto de historial para las tablas del PDF.
function limpiarEmoji(t) { return String(t || "").replace(/^[^A-Za-zÁÉÍÓÚÑáéíóúñ0-9]+/, "").trim(); }
function eventosIntercambioMes() {
  const total = new Date(state.anio, state.mes + 1, 0).getDate();
  const eventos = [];
  const vistos = new Set();
  for (let d = 1; d <= total; d++) {
    const fecha = fechaDeDia(d);
    histGet(fecha).forEach(h => {
      const t = String(h.texto || "");

      // Formato nuevo del swap de día completo: "🔄 Día 5 ⇄ 6 — nombres ⇄ nombres".
      const mCompleto = t.match(/Día (\d{1,2}) ⇄ (\d{1,2}) — (.+)$/);
      if (mCompleto) {
        const par = [Number(mCompleto[1]), Number(mCompleto[2])].sort((a, b) => a - b);
        const medicos = mCompleto[3].trim();
        const clave = `I|${par.join("-")}|${medicos}|${Math.round((h.ts || 0) / 1000)}`;
        if (vistos.has(clave)) return;
        vistos.add(clave);
        eventos.push({ dias: par, tipo: "Intercambio", medicos, motivo: h.motivo || "", ts: h.ts || 0, orden: Math.max(...par), detalle: limpiarEmoji(t) });
        return;
      }

      if (/Intercambio/.test(t)) {
        const mDia = t.match(/con (?:el )?día (\d{1,2})/);
        const otro = mDia ? Number(mDia[1]) : null;
        const idx = t.indexOf(":");
        const medicos = idx >= 0 ? t.slice(idx + 1).trim() : "Día completo (todas las asignaciones)";
        // Clave estable para no listar dos veces la misma operación.
        const par = otro ? [d, otro].sort((a, b) => a - b) : [d];
        const clave = `I|${par.join("-")}|${medicos}|${Math.round((h.ts || 0) / 1000)}`;
        if (vistos.has(clave)) return;
        vistos.add(clave);
        eventos.push({ dias: par, tipo: "Intercambio", medicos, motivo: h.motivo || "", ts: h.ts || 0, orden: Math.max(...par), detalle: limpiarEmoji(t) });

      } else if (/movido/.test(t)) {
        // Solo el lado del origen ("movido al día N"); el del destino es su espejo.
        const mDest = t.match(/movido al día (\d{1,2})/);
        if (!mDest) return;
        const nombre = (t.match(/^[^A-Za-zÁÉÍÓÚÑáéíóúñ]*(.+?)\s+movido/) || [, "—"])[1].trim();
        eventos.push({ dias: [d, Number(mDest[1])], tipo: "Movimiento", medicos: nombre, motivo: h.motivo || "", ts: h.ts || 0, orden: d, direccional: true, detalle: limpiarEmoji(t) });
      }
    });
  }
  return eventos.sort((a, b) => (b.orden - a.orden) || (b.ts - a.ts));   // fecha descendente
}
