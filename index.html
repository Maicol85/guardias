      </div>
      <div style="font-size:0.72rem;color:#6b7280;margin-bottom:12px;line-height:1.5">
        Elegí con qué médico del día ${dnum(destino)} se intercambia cada uno.
        Los turnos no se mueven: cada médico pasa a ocupar el rol y horario del otro.
      </div>
      <div style="max-height:46vh;overflow:auto;margin-bottom:14px">${filas}</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <button class="btn btn-primary" onclick="ejecutarSwapMedicos()">✅ Confirmar intercambio</button>
        <button class="btn btn-secondary" onclick="cerrarSwapMedicoPicker()">Cancelar</button>
      </div>
    </div>
  </div>`;
}
function cerrarSwapMedicoPicker() {
  state.swapMedicoDestino = null;
  render();   // vuelve al banner: se puede elegir otro día destino
}
function ejecutarSwapMedicos() {
  const { fecha: origen, uids } = state.swapMedicoOrigen;
  const destino = state.swapMedicoDestino;

  // Leer el emparejamiento elegido en los selects.
  const pares = [];
  uids.forEach((u, i) => {
    const sel = document.getElementById(`swapmed-${i}`);
    if (sel && sel.value) pares.push({ uidOrigen: u, uidDestino: sel.value });
  });
  if (!pares.length) { alert("No elegiste ningún intercambio."); return; }

  // Un mismo médico del destino no puede recibir dos intercambios.
  const destinosElegidos = pares.map(p => p.uidDestino);
  if (new Set(destinosElegidos).size !== destinosElegidos.length) {
    alert("Elegiste el mismo médico de destino más de una vez. Revisá el emparejamiento.");
    return;
  }

  const motivo = pedirMotivo();
  const detalle = [];
  pares.forEach(p => {
    const a = asigPorUid(origen, p.uidOrigen);
    const b = asigPorUid(destino, p.uidDestino);
    if (!a || !b) return;
    const nomA = getMedico(a.medicoId) ? getMedico(a.medicoId).nombre : "médico";
    const nomB = getMedico(b.medicoId) ? getMedico(b.medicoId).nombre : "médico";
    // Se permutan SOLO los médicos: rol, horario y uid quedan con el turno de cada día,
    // así el destino conserva sus roles y horarios (y el origen los suyos).
    const tmp = a.medicoId;
    a.medicoId = b.medicoId;
    b.medicoId = tmp;
    detalle.push(`${nomA} ⇄ ${nomB}`);
  });
  if (!detalle.length) { alert("No se pudo resolver el intercambio."); return; }

  histLog(origen,  `🔄 Intercambio con día ${dnum(destino)}: ${detalle.join(" · ")}`, motivo);
  histLog(destino, `🔄 Intercambio con día ${dnum(origen)}: ${detalle.join(" · ")}`, motivo);

  state.swapMedicoOrigen = null;
  state.swapMedicoDestino = null;
  guardarEstado();
  render();
}

// ─── HORARIOS: UN SOLO LECTOR ────────────────────────────────
/* Los horarios se escriben de muchas formas en la app y en la plantilla de cobertura:
   "08–20 hs", "08-20hs", "8-20", "08:00-20:00", "16-22 hs", "08 a 14", "Apoyo 6hs".
   Todo eso lo lee ESTA función y nadie más. Tener dos lectores —uno para la pantalla y
   otro para el informe— es cómo un cálculo se podre sin que se note: el PDF no recalcula,
   toma el valor. Devuelve minutos para no perder los :30. */
const DIA_INI_MIN = 8 * 60;    // 08:00 — desde acá es día
const DIA_FIN_MIN = 20 * 60;   // 20:00 — desde acá es noche

function parseHorario(txt) {
  const s = String(txt == null ? "" : txt).replace(/ /g, " ").trim();
  if (!s) return { tipo: "nada", dur: 0 };
  /* Rango con dos extremos. El separador puede ser guion corto, largo, raya o la palabra
     "a"; el "hs"/"h" puede estar en cualquiera de los dos extremos, o en ninguno. */
  const r = s.match(/(\d{1,2})(?:[:.](\d{2}))?\s*(?:hs|h)?\s*(?:[-–—]|a(?=\s*\d))\s*(\d{1,2})(?:[:.](\d{2}))?\s*(?:hs|h)?/i);
  if (r && Number(r[1]) <= 24 && Number(r[3]) <= 24) {
    const ini = Number(r[1]) * 60 + Number(r[2] || 0);
    const fin = Number(r[3]) * 60 + Number(r[4] || 0);
    let dur = (fin - ini + 1440) % 1440;
    if (dur === 0) dur = 1440;              // "08-08" es una vuelta completa, no cero
    return { tipo: "rango", ini: ini, fin: fin, dur: dur };
  }
  // Sólo duración, sin reloj: "Apoyo 6hs", "6 h", "12hs".
  const d = s.match(/(\d{1,2})(?:[:.](\d{2}))?\s*h/i);
  if (d) return { tipo: "dur", dur: Number(d[1]) * 60 + Number(d[2] || 0) };
  return { tipo: "nada", dur: 0 };
}

/* Reparto día/noche de un turno. Día = 08:00–20:00, noche = 20:00–08:00, contado por
   reloj y no por el rol: una guardia cargada como D12 pero con horario "14-20hs" son
   6 h de día, y un apoyo 16-22 son 4 h de día + 2 h de noche. Un horario sin reloj
   (ej. "Apoyo 6hs") se cuenta entero como día, como pidió la coordinación. */
function horasDe(a) {
  const h = parseHorario(horarioDe(a));
  if (h.tipo !== "rango") return { dia: h.dur / 60, noche: 0, total: h.dur / 60, conReloj: false };
  let dia = 0, noche = 0, t = h.ini, restan = h.dur;
  while (restan > 0) {
    const tm = ((t % 1440) + 1440) % 1440;
    const enDia = tm >= DIA_INI_MIN && tm < DIA_FIN_MIN;
    const limite = enDia ? DIA_FIN_MIN : (tm < DIA_INI_MIN ? DIA_INI_MIN : 1440);
    const paso = Math.min(restan, limite - tm);
    if (enDia) dia += paso; else noche += paso;
    t += paso; restan -= paso;
  }
  return { dia: dia / 60, noche: noche / 60, total: h.dur / 60, conReloj: true };
}

// Clase del turno para las columnas Día / Noche / Apoyo: por horario, no por rol.
function claseTurno(a, h) {
  if (!esGuardia(a)) return "apoyo";
  h = h || horasDe(a);
  return (h.noche > h.dia) ? "noche" : "dia";
}

// Horas para mostrar: sin decimal cuando es entero (108 h, no 108.0 h).
function fmtH(n) {
  const x = Math.round((Number(n) || 0) * 100) / 100;
  return (Math.abs(x - Math.round(x)) < 0.005) ? String(Math.round(x)) : x.toFixed(1);
}

// ─── SELECTOR DE PERÍODO (PDF · Estadísticas · RRHH) ─────────
/* Un único selector con dos modos, usado por los tres lugares que informan números:
     mes    → un mes completo
     rango  → desde/hasta, SÓLO esos días exactos
   Regla de conteo, la misma en los tres: una guardia cuenta COMPLETA en el día en que
   EMPIEZA. La nocturna 20-08 que arranca el último día del período entra con sus 12 h;
   la que arrancó el día anterior al período no entra. Eso sale solo de recorrer los días
   del período, porque cada turno está guardado en su día de inicio. */
function perDefecto() { return { modo: "mes", anio: state.anio, mes: state.mes, desde: "", hasta: "" }; }

function perNorm(p) {
  const q = Object.assign(perDefecto(), p || {});
  if (q.modo !== "rango") q.modo = "mes";
  if (q.modo === "rango" && q.desde && q.hasta && q.desde > q.hasta) { const t = q.desde; q.desde = q.hasta; q.hasta = t; }
  return q;
}
function perValido(p) {
  const q = perNorm(p);
  return q.modo === "mes" ? true : !!(q.desde && q.hasta);
}
function perFmtFecha(iso) {
  const f = isoADMY(iso);
  return (f.dia && MESES_CORTO[f.mes]) ? f.dia + " " + MESES_CORTO[f.mes] + " " + f.anio : "";
}
function perEtiqueta(p) {
  const q = perNorm(p);
  if (q.modo === "mes") return MESES[q.mes] + " " + q.anio;
  if (!perValido(q)) return "período incompleto";
  return perFmtFecha(q.desde) + " — " + perFmtFecha(q.hasta);
}
// Calendario de un mes: el de pantalla gana (puede tener ediciones sin guardar).
function perCal(anio, mes) {
  if (anio === state.anio && mes === state.mes) return state.calendario || {};
  return calDelMes(anio, mes) || {};
}
// Tramos del período, uno por mes: { anio, mes, dIni, dFin }.
function perMeses(p) {
  const q = perNorm(p);
  if (q.modo === "mes") return [{ anio: q.anio, mes: q.mes, dIni: 1, dFin: new Date(q.anio, q.mes + 1, 0).getDate() }];
  if (!perValido(q)) return [];
  return segmentosPorMes(q.desde, q.hasta).map(s => ({ anio: s.anio, mes: s.mes, dIni: s.desde, dFin: s.hasta }));
}
// Notas de cualquier mes (cargarNotasMes sólo lee el de pantalla).
function perNotas(anio, mes) {
  if (state.compartido) return (anio === state.anio && mes === state.mes) ? (state.notasCompartidas || "") : "";
  try { return localStorage.getItem(notasMesKey(anio, mes)) || ""; } catch (e) { return ""; }
}

function perFilaVacia(m) {
  return { medico: m, guardias: 0, dia: 0, noche: 0, apoyo: 0, horas: 0, horasDia: 0, horasNoche: 0 };
}
// Agregado de UN tramo de mes. Sólo los días dIni..dFin, y el turno entero en su día de inicio.
function perAgregarTramo(anio, mes, dIni, dFin) {
  const cal = perCal(anio, mes);
  const acc = {};
  for (let d = dIni; d <= dFin; d++) {
    const f = anio + "-" + String(mes + 1).padStart(2, "0") + "-" + String(d).padStart(2, "0");
    ((cal[f] && cal[f].asignaciones) || []).forEach(a => {
      if (esPendiente(a)) return;                       // un turno sin cubrir no suma a nadie
      const m = getMedico(a.medicoId); if (!m) return;
      const h = horasDe(a);
      const x = acc[m.id] || (acc[m.id] = perFilaVacia(m));
      x.guardias++;
      x[claseTurno(a, h)]++;
      x.horas += h.total; x.horasDia += h.dia; x.horasNoche += h.noche;
    });
  }
  return acc;
}
/* Agregado completo del período. Devuelve el desglose por mes (para las tablas y las
   gráficas del PDF) y el total del período ya ordenado. `sinDatos` son los meses del
   período que no tienen calendario guardado: se avisan y no se imprime una hoja vacía. */
function perAgregar(p) {
  const q = perNorm(p);
  const meses = [], sinDatos = [];
  perMeses(q).forEach(s => {
    const hayCal = Object.keys(perCal(s.anio, s.mes)).length > 0;
    if (!hayCal) sinDatos.push({ anio: s.anio, mes: s.mes, etiqueta: MESES[s.mes] + " " + s.anio });
    meses.push(Object.assign({}, s, {
      etiqueta: MESES[s.mes] + " " + s.anio,
      etiquetaCorta: MESES_CORTO[s.mes] + " " + String(s.anio).slice(2),
      hayCal: hayCal,
      porMedico: perAgregarTramo(s.anio, s.mes, s.dIni, s.dFin),
    }));
  });
  const total = {};
  const CAMPOS = ["guardias", "dia", "noche", "apoyo", "horas", "horasDia", "horasNoche"];
  meses.forEach(mm => Object.keys(mm.porMedico).forEach(id => {
    const x = mm.porMedico[id];
    const t = total[id] || (total[id] = perFilaVacia(x.medico));
    CAMPOS.forEach(k => { t[k] += x[k]; });
  }));
  const filas = Object.keys(total).map(id => {
    const x = total[id];
    return Object.assign({}, x, { promedio: x.guardias ? (x.horas / x.guardias) : 0 });
  }).sort((a, b) => b.horas - a.horas || a.medico.nombre.localeCompare(b.medico.nombre));
  return { periodo: q, meses: meses, sinDatos: sinDatos, filas: filas, total: total };
}
// Ausencias del período, recortadas a los días del período, agrupadas por mes.
function perAusencias(p) {
  return perMeses(p).map(s => {
    const arr = ausGetMes(s.anio, s.mes)
      .filter(a => Number(a.hasta) >= s.dIni && Number(a.desde) <= s.dFin)
      .map(a => Object.assign({}, a, {
        desdeRec: Math.max(Number(a.desde), s.dIni),
        hastaRec: Math.min(Number(a.hasta), s.dFin),
      }))
      .sort((a, b) => a.desdeRec - b.desdeRec);
    return { anio: s.anio, mes: s.mes, dIni: s.dIni, dFin: s.dFin, etiqueta: MESES[s.mes] + " " + s.anio, lista: arr };
  }).filter(x => x.lista.length);
}

// ─── SELECTOR DE PERÍODO: ESTADO Y RENDER ────────────────────
/* Tres contextos comparten el mismo componente. Cada uno guarda su propio período para
   que elegir un rango en el PDF no le cambie el mes a la pestaña de Estadísticas. */
function perRef(ctx) {
  if (ctx === "pdf") {
    if (!state.modalPDF) return perDefecto();
    if (!state.modalPDF.periodo) state.modalPDF.periodo = perDefecto();
    return state.modalPDF.periodo;
  }
  if (ctx === "rrhh") {
    if (!state.reporteRRHH) return perDefecto();
    if (!state.reporteRRHH.periodo) state.reporteRRHH.periodo = perDefecto();
    return state.reporteRRHH.periodo;
  }
  if (!state.statsPeriodo) state.statsPeriodo = perDefecto();
  return state.statsPeriodo;
}
function perSet(ctx, campo, valor) {
  const p = perRef(ctx);
  if (campo === "modo") {
    p.modo = (valor === "rango") ? "rango" : "mes";
    // Al pasar a rango se siembra con el mes elegido: así "desde/hasta" nunca arranca vacío.
    if (p.modo === "rango" && (!p.desde || !p.hasta)) {
      const total = new Date(p.anio, p.mes + 1, 0).getDate();
      const mm = String(p.mes + 1).padStart(2, "0");
      p.desde = p.anio + "-" + mm + "-01";
      p.hasta = p.anio + "-" + mm + "-" + String(total).padStart(2, "0");
    }
  } else if (campo === "mes") p.mes = Math.max(0, Math.min(11, Number(valor) || 0));
  else if (campo === "anio") p.anio = Math.max(2000, Math.min(2100, Number(valor) || state.anio));
  else if (campo === "desde" || campo === "hasta") p[campo] = String(valor || "");
  if (ctx === "rrhh" && state.reporteRRHH) rrhhRecalcular();
  render();
}
// Años ofrecidos: el del período, el de pantalla y dos para cada lado.
function perAnios(p) {
  const base = [p.anio, state.anio, new Date().getFullYear()];
  const out = {};
  base.forEach(a => { for (let k = -2; k <= 1; k++) out[a + k] = true; });
  return Object.keys(out).map(Number).sort((a, b) => a - b);
}
function renderSelectorPeriodo(ctx, opts) {
  const o = opts || {};
  const p = perNorm(perRef(ctx));
  const esMes = p.modo === "mes";
  const btn = (modo, txt) => '<button type="button" onclick="perSet(\'' + ctx + '\',\'modo\',\'' + modo + '\')"' +
    ' style="flex:0 0 auto;padding:5px 11px;border:1px solid ' + (p.modo === modo ? "#2563eb" : "#d1d5db") + ';' +
    'background:' + (p.modo === modo ? "#eff6ff" : "#fff") + ';color:' + (p.modo === modo ? "#1d4ed8" : "#374151") + ';' +
    'font-weight:' + (p.modo === modo ? "700" : "600") + ';font-size:0.74rem;border-radius:6px;cursor:pointer">' + txt + '</button>';
  const campos = esMes
    ? '<select class="filtro-select" onchange="perSet(\'' + ctx + '\',\'mes\',this.value)" aria-label="Mes">' +
      MESES.map((n, i) => '<option value="' + i + '"' + (i === p.mes ? " selected" : "") + '>' + n + '</option>').join("") +
      '</select>' +
      '<select class="filtro-select" onchange="perSet(\'' + ctx + '\',\'anio\',this.value)" aria-label="Año">' +
      perAnios(p).map(a => '<option value="' + a + '"' + (a === p.anio ? " selected" : "") + '>' + a + '</option>').join("") +
      '</select>'
    : '<label style="font-size:0.72rem;color:#6b7280;font-weight:600">Desde' +
      '<input type="date" class="filtro-select" value="' + escAttr(p.desde) + '" onchange="perSet(\'' + ctx + '\',\'desde\',this.value)" style="margin-left:4px"></label>' +
      '<label style="font-size:0.72rem;color:#6b7280;font-weight:600">Hasta' +
      '<input type="date" class="filtro-select" value="' + escAttr(p.hasta) + '" onchange="perSet(\'' + ctx + '\',\'hasta\',this.value)" style="margin-left:4px"></label>';
  const ag = perValido(p) ? perAgregar(p) : null;
  const aviso = (ag && ag.sinDatos.length)
    ? '<div style="margin-top:7px;font-size:0.72rem;color:#92400e;background:#fffbeb;border:1px solid #fcd34d;border-radius:6px;padding:6px 9px;line-height:1.45">' +
      '⚠️ Sin guardias cargadas en ' + (ag.sinDatos.length === 1 ? "el mes de" : "los meses de") + ' <b>' +
      ag.sinDatos.map(x => escHTML(x.etiqueta)).join(", ") + '</b>. ' +
      (ag.sinDatos.length === 1 ? "Ese mes no se incluye" : "Esos meses no se incluyen") + ' en el informe.</div>'
    : "";
  const invalido = !perValido(p)
    ? '<div style="margin-top:7px;font-size:0.72rem;color:#b91c1c;font-weight:600">Completá las dos fechas del rango.</div>'
    : "";
  return '<div style="border:1px solid #e5e7eb;background:#f8fafc;border-radius:8px;padding:9px 11px;' + (o.margen || "margin-bottom:12px") + '">' +
    '<div style="display:flex;gap:7px;align-items:center;flex-wrap:wrap">' +
    '<span style="font-size:0.68rem;font-weight:700;color:#6b7280;text-transform:uppercase;letter-spacing:.6px;margin-right:2px">Período</span>' +
    btn("mes", "Mes completo") + btn("rango", "Rango de días") +
    '<span style="width:1px;height:18px;background:#d1d5db;margin:0 3px"></span>' +
    campos + '</div>' + invalido + aviso + '</div>';
}

// ─── MEJORA 9: HORAS POR MÉDICO ──────────────────────────────
/* Horas totales de un turno. Queda sólo como atajo: el cálculo vive en horasDe(), que
   es también quien reparte día y noche. Dos fórmulas para lo mismo es cómo el informe
   empieza a decir algo distinto que la pantalla. */
function durationHoras(a) { return horasDe(a).total; }
/* Resumen de horas del mes en pantalla. Delega en el agregador del período para que la
   pantalla, el PDF y el reporte de RRHH cuenten con las mismas reglas. */
function resumenHoras() {
  return perAgregar({ modo: "mes", anio: state.anio, mes: state.mes }).filas;
}

// ─── MEJORA 8: VISTA SEMANAL ─────────────────────────────────
function semanaDeFecha(fecha) {
  const [_sf_y,_sf_m,_sf_d] = fecha.split("-").map(Number);
  const d = new Date(_sf_y, _sf_m-1, _sf_d);
  const dow = (d.getDay() + 6) % 7;   // 0 = lunes
  const lunes = new Date(d); lunes.setDate(d.getDate() - dow);
  const dias = [];
  for (let i = 0; i < 7; i++) {
    const x = new Date(lunes); x.setDate(lunes.getDate() + i);
    dias.push(`${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, "0")}-${String(x.getDate()).padStart(2, "0")}`);
  }
  return dias;
}
function anclaSemana() {
  if (state.semanaAncla) return state.semanaAncla;
  const hoy = hoyISO();
  const primero = `${state.anio}-${String(state.mes + 1).padStart(2, "0")}-01`;
  const enMes = hoy.startsWith(`${state.anio}-${String(state.mes + 1).padStart(2, "0")}`);
  state.semanaAncla = enMes ? hoy : primero;
  return state.semanaAncla;
}
function toggleVista() {
  state.modoCal = state.modoCal === "semana" ? "mes" : "semana";
  if (state.modoCal === "semana") anclaSemana();
  render();
}
function moverSemana(dir) {
  const _anc = anclaSemana(); const [_ms_y,_ms_m,_ms_d] = _anc.split("-").map(Number);
  const d = new Date(_ms_y, _ms_m-1, _ms_d);
  d.setDate(d.getDate() + dir * 7);
  const nueva = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  /* Cruzar de mes va por irAMes, el único camino que guarda el mes que deja y carga el que
     abre. Antes esto llamaba a cargarEstado(), que cuando el mes destino no tenía nada guardado
     dejaba el calendario del mes anterior en memoria SIN decir nada: al volver a vista mensual
     se veía el mes nuevo vacío y el siguiente guardado lo escribía encima. */
  if (d.getFullYear() !== state.anio || d.getMonth() !== state.mes) {
    irAMes(d.getFullYear(), d.getMonth());
    if (state.anio === d.getFullYear() && state.mes === d.getMonth()) {
      state.semanaAncla = nueva;
      render();
    }
    return;
  }
  state.semanaAncla = nueva;
  render();
}
function navPrev() { state.modoCal === "semana" ? moverSemana(-1) : prevMes(); }
function navNext() { state.modoCal === "semana" ? moverSemana(1) : nextMes(); }

function setNota(fecha, nota) {
  if(!state.calendario[fecha]) state.calendario[fecha] = {asignaciones:[], notas:""};
  state.calendario[fecha].notas = nota;

}

function abrirModalMedico() { state.modalMedico = true; render(); }

function confirmarNuevoMedico() {

/* El logo termina dentro de un src=, y ahí escapar NO alcanza: un "https://..." guardado
   en el almacenamiento es HTML perfectamente válido y le avisa a un servidor de afuera
   cada vez que alguien abre el informe. Sube siempre como imagen embebida, así que lo que
   no empiece con data:image/ no se dibuja. Un <img> no ejecuta el script de un SVG, por eso
   svg+xml sigue permitido: es el formato en que la app guarda los logos vectoriales. */
function logoSeguro() {
  const l = String(cargarLogo() || "");
  return /^data:image\/(png|jpeg|jpg|gif|webp|svg\+xml)[;,]/i.test(l) ? l : "";
}

// ─── PDF: HELPERS DE COLOR Y GRÁFICAS INLINE ─────────────────
/* Las gráficas se dibujan en SVG escrito a mano: la app no carga ninguna librería y no va
   a empezar a hacerlo por un informe. Cada médico conserva el color que ya tiene en la
   app; el tono claro son las horas de día y el oscuro las de noche, en la misma barra.
   El tramo de noche lleva además una trama diagonal, porque impreso en blanco y negro
   dos tonos del mismo color terminan siendo el mismo gris. */
function pdfHexAClaro(hex, f) {
  const h = String(hex || "#334155").replace("#", "");
  const n = h.length === 3 ? h.split("").map(c => c + c).join("") : h;
  const r = parseInt(n.slice(0, 2), 16), g = parseInt(n.slice(2, 4), 16), b = parseInt(n.slice(4, 6), 16);
  if (isNaN(r) || isNaN(g) || isNaN(b)) return "#cbd5e1";
  const m = x => Math.round(x + (255 - x) * f);
  return "#" + [m(r), m(g), m(b)].map(x => x.toString(16).padStart(2, "0")).join("");
}
/* Tope "redondo" del eje: el menor valor de la forma 1/1,2/1,5/2/2,5/3/4/5/6/8 × 10^k
   que llegue al máximo. Con potencias de 10 solas, un máximo de 108 h daba un eje hasta
   200 y las barras se leían como la mitad de lo que son. */
function pdfTopeEje(max) {
  const m = Math.max(Number(max) || 0, 1e-9);
  const esc = Math.pow(10, Math.floor(Math.log10(m)));
  const pasos = [1, 1.2, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10];
  for (let i = 0; i < pasos.length; i++) {
    if (pasos[i] * esc >= m - 1e-9) return pasos[i] * esc;
  }
  return 10 * esc;
}

// Escapa texto para meterlo en un nodo <text> de SVG (mismas reglas que en HTML).
function pdfSvgTxt(s) { return escHTML(s); }

/* Gráfica de horas: un grupo de barras por médico, una barra por mes dentro del grupo.
   Devuelve "" si no hay nada que dibujar, para no imprimir un marco vacío. */
function pdfGraficaHoras(ag) {
  const filas = ag.filas.filter(x => x.horas > 0);
  const meses = ag.meses.filter(m => m.hayCal);
  if (!filas.length || !meses.length) return "";
  const nM = meses.length;
  const W = 1000, H = 300, padL = 44, padR = 10, padB = nM > 1 ? 44 : 30, padT = 14;
  const anchoUtil = W - padL - padR, altoUtil = H - padT - padB;
  const grupo = anchoUtil / filas.length;
  const anchoBarra = Math.max(4, Math.min(26, (grupo * 0.78) / nM));
  const maxH = Math.max.apply(null, filas.map(x => {
    return Math.max.apply(null, meses.map(m => {
      const c = m.porMedico[x.medico.id];
      return c ? c.horas : 0;
    }));
  })) || 1;
  const tope = pdfTopeEje(maxH);
  const y = v => padT + altoUtil - (v / tope) * altoUtil;

  let ejes = "";
  for (let k = 0; k <= 4; k++) {
    const v = tope * k / 4, yy = y(v);
    ejes += '<line x1="' + padL + '" y1="' + yy.toFixed(1) + '" x2="' + (W - padR) + '" y2="' + yy.toFixed(1) +
            '" stroke="#d1d5db" stroke-width="0.7"/>' +
            '<text x="' + (padL - 6) + '" y="' + (yy + 3.5).toFixed(1) + '" text-anchor="end" font-size="9" fill="#6b7280">' + fmtH(v) + '</text>';
  }

  let barras = "";
  filas.forEach((x, gi) => {
    const x0 = padL + gi * grupo + (grupo - anchoBarra * nM) / 2;
    meses.forEach((m, mi) => {
      const c = m.porMedico[x.medico.id] || { horas: 0, horasDia: 0, horasNoche: 0 };
      if (!c.horas) return;
      const bx = x0 + mi * anchoBarra;
      const yDia = y(c.horasDia), yTot = y(c.horas);
      const claro = pdfHexAClaro(x.medico.color, 0.55);
      // Día: tono claro, abajo. Noche: color pleno + trama, arriba.
      if (c.horasDia > 0) {
        barras += '<rect x="' + bx.toFixed(1) + '" y="' + yDia.toFixed(1) + '" width="' + (anchoBarra - 1.5).toFixed(1) +
                  '" height="' + (padT + altoUtil - yDia).toFixed(1) + '" fill="' + claro + '" stroke="#475569" stroke-width="0.5"/>';
      }
      if (c.horasNoche > 0) {
        barras += '<rect x="' + bx.toFixed(1) + '" y="' + yTot.toFixed(1) + '" width="' + (anchoBarra - 1.5).toFixed(1) +
                  '" height="' + (yDia - yTot).toFixed(1) + '" fill="' + escAttr(x.medico.color) + '" stroke="#1e293b" stroke-width="0.6"/>' +
                  '<rect x="' + bx.toFixed(1) + '" y="' + yTot.toFixed(1) + '" width="' + (anchoBarra - 1.5).toFixed(1) +
                  '" height="' + (yDia - yTot).toFixed(1) + '" fill="url(#tramaNoche)" stroke="none"/>';
      }
      if (nM > 1) {
        barras += '<text x="' + (bx + (anchoBarra - 1.5) / 2).toFixed(1) + '" y="' + (padT + altoUtil + 10) +
                  '" text-anchor="middle" font-size="7" fill="#6b7280">' + pdfSvgTxt(MESES_CORTO[m.mes]) + '</text>';
      }
    });
    barras += '<text x="' + (padL + gi * grupo + grupo / 2).toFixed(1) + '" y="' + (padT + altoUtil + (nM > 1 ? 24 : 13)) +
              '" text-anchor="middle" font-size="9" font-weight="700" fill="#374151">' + pdfSvgTxt(x.medico.sigla || x.medico.nombre) + '</text>';
    barras += '<text x="' + (padL + gi * grupo + grupo / 2).toFixed(1) + '" y="' + (padT + altoUtil + (nM > 1 ? 34 : 23)) +
              '" text-anchor="middle" font-size="7" fill="#9ca3af">' + fmtH(x.horas) + ' h</text>';
  });

  return '<div class="graf">' +
    '<div class="graf-tit">Horas por médico y por mes — tono claro: horas de día (08–20) · tono oscuro con trama: horas de noche (20–08)</div>' +
    '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" height="' + H + '" xmlns="http://www.w3.org/2000/svg" role="img">' +
      '<defs><pattern id="tramaNoche" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">' +
        '<line x1="0" y1="0" x2="0" y2="5" stroke="#ffffff" stroke-width="1.4" stroke-opacity="0.85"/></pattern></defs>' +
      '<line x1="' + padL + '" y1="' + (padT + altoUtil) + '" x2="' + (W - padR) + '" y2="' + (padT + altoUtil) + '" stroke="#6b7280" stroke-width="1"/>' +
      ejes + barras +
      '<text x="' + (padL - 6) + '" y="' + (padT - 4) + '" text-anchor="end" font-size="8" fill="#9ca3af">h</text>' +
    '</svg></div>';
}

/* Línea de tiempo de licencias: médicos en filas, días del período en el eje, una barra
   por licencia con el color del médico. El eje es continuo a lo largo de todo el período,
   con una línea divisoria y el nombre de cada mes, así un rango que cruza meses se lee
   de corrido y no en pedazos. */
function pdfTimelineAusencias(grupos, per) {
  const tramos = perMeses(per);
  if (!grupos.length || !tramos.length) return "";
  // Índice global de día: 0 .. N-1 a lo largo del período.
  let acum = 0;
  const base = {};
  tramos.forEach(s => {
    base[s.anio + "-" + s.mes] = { inicio: acum, dias: s.dFin - s.dIni + 1, dIni: s.dIni, mes: s.mes, anio: s.anio };
    acum += s.dFin - s.dIni + 1;
  });
  const totalDias = acum;
  if (!totalDias) return "";

  // Una fila por médico con alguna ausencia en el período.
  const porMedico = {};
  grupos.forEach(g => g.lista.forEach(a => {
    const m = getMedico(a.medicoId); if (!m) return;
    const b = base[g.anio + "-" + g.mes]; if (!b) return;
    if (!porMedico[m.id]) porMedico[m.id] = { medico: m, barras: [] };
    porMedico[m.id].barras.push({
      ini: b.inicio + (Number(a.desdeRec) - b.dIni),
      largo: Number(a.hastaRec) - Number(a.desdeRec) + 1,
      tipo: a.tipo,
    });
  }));
  const filas = Object.keys(porMedico).map(k => porMedico[k])
    .sort((a, b) => a.medico.nombre.localeCompare(b.medico.nombre));
  if (!filas.length) return "";

  const W = 1000, padL = 92, padR = 12, padT = 24, altoFila = 15;
  const H = padT + filas.length * altoFila + 16;
  const anchoUtil = W - padL - padR;
  const px = d => padL + (d / totalDias) * anchoUtil;

  let meses = "", rejilla = "";
  Object.keys(base).forEach(k => {
    const b = base[k];
    const x0 = px(b.inicio), x1 = px(b.inicio + b.dias);
    meses += '<line x1="' + x0.toFixed(1) + '" y1="' + (padT - 12) + '" x2="' + x0.toFixed(1) + '" y2="' + (H - 12) + '" stroke="#cbd5e1" stroke-width="0.8"/>' +
      '<text x="' + ((x0 + x1) / 2).toFixed(1) + '" y="' + (padT - 15) + '" text-anchor="middle" font-size="9" font-weight="700" fill="#374151">' +
      pdfSvgTxt(MESES[b.mes] + " " + b.anio) + '</text>';
    // Marcas cada 5 días, con el número de día del mes.
    for (let d = b.dIni; d <= b.dIni + b.dias - 1; d++) {
      if (d % 5 !== 0) continue;
      const xx = px(b.inicio + (d - b.dIni) + 0.5);
      rejilla += '<line x1="' + xx.toFixed(1) + '" y1="' + (padT - 6) + '" x2="' + xx.toFixed(1) + '" y2="' + (H - 12) + '" stroke="#eef0f3" stroke-width="0.7"/>' +
        '<text x="' + xx.toFixed(1) + '" y="' + (H - 3) + '" text-anchor="middle" font-size="6.5" fill="#9ca3af">' + d + '</text>';
    }
  });

  let cuerpo = "";
  filas.forEach((f, i) => {
    const y0 = padT + i * altoFila;
    cuerpo += '<text x="' + (padL - 7) + '" y="' + (y0 + altoFila * 0.66).toFixed(1) + '" text-anchor="end" font-size="8.5" fill="#111827">' +
      pdfSvgTxt(f.medico.nombre) + '</text>';
    if (i % 2 === 0) cuerpo += '<rect x="' + padL + '" y="' + y0 + '" width="' + anchoUtil + '" height="' + altoFila + '" fill="#f8fafc"/>';
    f.barras.forEach(b => {
      const x0 = px(b.ini), x1 = px(b.ini + b.largo);
      const ti = tipoAus(b.tipo);
      /* La enfermedad y la licencia se distinguen por el borde y la trama, no sólo por
         el color: el color ya lo usa el médico, y en blanco y negro no queda nada. */
      cuerpo += '<rect x="' + x0.toFixed(1) + '" y="' + (y0 + 2.5) + '" width="' + Math.max(1.6, x1 - x0 - 0.8).toFixed(1) +
        '" height="' + (altoFila - 5) + '" fill="' + escAttr(f.medico.color) + '" stroke="' + escAttr(ti.color) +
        '" stroke-width="' + (b.tipo === "licencia" ? 1.2 : 0.6) + '" rx="1.5"/>';
      if (b.tipo !== "licencia") {
        cuerpo += '<rect x="' + x0.toFixed(1) + '" y="' + (y0 + 2.5) + '" width="' + Math.max(1.6, x1 - x0 - 0.8).toFixed(1) +
          '" height="' + (altoFila - 5) + '" fill="url(#tramaAus)" rx="1.5"/>';
      }
    });
  });

  return '<div class="graf">' +
    '<div class="graf-tit">Línea de tiempo de licencias y ausencias — una barra por ausencia, con el color del médico (borde grueso: licencia · con trama: otros tipos)</div>' +
    '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" height="' + Math.min(H, 420) + '" xmlns="http://www.w3.org/2000/svg" role="img">' +
      '<defs><pattern id="tramaAus" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">' +
        '<line x1="0" y1="0" x2="0" y2="5" stroke="#ffffff" stroke-width="1.4" stroke-opacity="0.85"/></pattern></defs>' +
      rejilla + meses + cuerpo +
    '</svg></div>';
}

/* Barras de días de licencia por mes, apiladas por médico. */
function pdfBarrasAusencias(grupos) {
  if (!grupos.length) return "";
  const porMes = grupos.map(g => {
    const acc = {};
    g.lista.forEach(a => {
      const m = getMedico(a.medicoId); if (!m) return;
      const dias = Number(a.hastaRec) - Number(a.desdeRec) + 1;
      if (!acc[m.id]) acc[m.id] = { medico: m, dias: 0 };
      acc[m.id].dias += dias;
    });
    const items = Object.keys(acc).map(k => acc[k]).sort((x, y) => y.dias - x.dias);
    return { etiqueta: g.etiqueta, items: items, total: items.reduce((n, x) => n + x.dias, 0) };
  }).filter(x => x.total > 0);
  if (!porMes.length) return "";

  const W = 1000, H = 260, padL = 40, padR = 10, padT = 14, padB = 34;
  const anchoUtil = W - padL - padR, altoUtil = H - padT - padB;
  const paso = anchoUtil / porMes.length;
  const ancho = Math.min(90, paso * 0.5);
  const tope = pdfTopeEje(Math.max.apply(null, porMes.map(x => x.total)) || 1);
  const y = v => padT + altoUtil - (v / tope) * altoUtil;

  let ejes = "";
  for (let k = 0; k <= 4; k++) {
    const v = Math.round(tope * k / 4), yy = y(v);
    ejes += '<line x1="' + padL + '" y1="' + yy.toFixed(1) + '" x2="' + (W - padR) + '" y2="' + yy.toFixed(1) + '" stroke="#d1d5db" stroke-width="0.7"/>' +
      '<text x="' + (padL - 6) + '" y="' + (yy + 3.5).toFixed(1) + '" text-anchor="end" font-size="9" fill="#6b7280">' + v + '</text>';
  }
  let barras = "";
  porMes.forEach((g, gi) => {
    const x0 = padL + gi * paso + (paso - ancho) / 2;
    let abajo = 0;
    g.items.forEach(it => {
      const yTop = y(abajo + it.dias), yBot = y(abajo);
      barras += '<rect x="' + x0.toFixed(1) + '" y="' + yTop.toFixed(1) + '" width="' + ancho.toFixed(1) +
        '" height="' + Math.max(0.8, yBot - yTop).toFixed(1) + '" fill="' + escAttr(it.medico.color) + '" stroke="#fff" stroke-width="0.7"/>';
      if (yBot - yTop > 9) {
        barras += '<text x="' + (x0 + ancho / 2).toFixed(1) + '" y="' + ((yTop + yBot) / 2 + 3).toFixed(1) +
          '" text-anchor="middle" font-size="7.5" fill="#fff" font-weight="700">' + pdfSvgTxt(it.medico.sigla) + " " + it.dias + '</text>';
      }
      abajo += it.dias;
    });
    barras += '<text x="' + (x0 + ancho / 2).toFixed(1) + '" y="' + (padT + altoUtil + 13) + '" text-anchor="middle" font-size="9" font-weight="700" fill="#374151">' +
      pdfSvgTxt(g.etiqueta) + '</text>' +
      '<text x="' + (x0 + ancho / 2).toFixed(1) + '" y="' + (y(g.total) - 4).toFixed(1) + '" text-anchor="middle" font-size="8.5" font-weight="700" fill="#374151">' +
      g.total + ' d</text>';
  });
  return '<div class="graf">' +
    '<div class="graf-tit">Días de licencia y ausencia por mes (apilado por médico)</div>' +
    '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" height="' + H + '" xmlns="http://www.w3.org/2000/svg" role="img">' +
      '<line x1="' + padL + '" y1="' + (padT + altoUtil) + '" x2="' + (W - padR) + '" y2="' + (padT + altoUtil) + '" stroke="#6b7280" stroke-width="1"/>' +
      ejes + barras + '</svg></div>';
}

// ─── EXPORTAR PDF ────────────────────────────────────────────
// ─── PUNTO 6: OPCIONES DE EXPORTACIÓN ────────────────────────
function abrirModalPDF() {
  state.modalPDF = {
    planilla: true, horas: false, notas: false, ausencias: false, historial: false,
    horasModo: "mes",      // "mes" = una tabla por mes · "columnas" = meses en columnas
    horasGrafica: false,   // barras por médico y por mes, día claro / noche oscuro
    licTimeline: false,    // línea de tiempo de licencias
    licBarras: false,      // días de licencia por mes
  };
  render();
}
function setPDFHorasModo(v) {
  if (!state.modalPDF) return;
  state.modalPDF.horasModo = (v === "columnas") ? "columnas" : "mes";
  render();
}
function cerrarModalPDF() { state.modalPDF = null; render(); }
function togglePDFOpt(k) {
  if (!state.modalPDF) return;
  state.modalPDF[k] = !state.modalPDF[k];
  render();
}
function confirmarExportarPDF() {
  const o = state.modalPDF;
  if (!o || !algoElegidoPDF(o)) return;   // el botón ya está deshabilitado
  const per = perNorm(perRef("pdf"));
  if (!perValido(per)) return;
  const opciones = Object.assign({}, o, { periodo: per });
  state.modalPDF = null;
  render();
  exportarPDF(opciones);
}
function algoElegidoPDF(o) { return !!(o.planilla || o.horas || o.notas || o.ausencias || o.historial); }
function renderModalPDF() {
  if (!state.modalPDF) return "";
  const o = state.modalPDF;
  const per = perRef("pdf");
  const ok = perValido(per);
  const ag = ok ? perAgregar(per) : { filas: [], meses: [], sinDatos: [] };
  const hayNotas = ag.meses.some(m => perNotas(m.anio, m.mes).trim() !== "");
  const hayHoras = ag.filas.length > 0;
  const hayAus = ok && perAusencias(per).length > 0;
  const hayHist = eventosIntercambioMes().length > 0;
  const nada = !algoElegidoPDF(o);
  const fila = (k, label, extra, disponible) => '<label style="display:flex;align-items:center;gap:9px;padding:9px 10px;border:1px solid ' +
    (o[k] ? "#2563eb" : "#d1d5db") + ';background:' + (o[k] ? "#eff6ff" : "#fff") + ';border-radius:7px;margin-bottom:8px;cursor:' +
    (disponible ? "pointer" : "not-allowed") + ';opacity:' + (disponible ? 1 : .55) + '">' +
    '<input type="checkbox"' + (o[k] ? " checked" : "") + (disponible ? "" : " disabled") + ' onchange="togglePDFOpt(\'' + k + '\')"' +
    ' style="width:17px;height:17px;accent-color:#2563eb;cursor:' + (disponible ? "pointer" : "not-allowed") + '">' +
    '<span style="flex:1"><span style="font-size:0.85rem;font-weight:600;color:#111827">' + label + '</span>' +
    (extra ? '<span style="display:block;font-size:0.7rem;color:#6b7280;margin-top:1px">' + extra + '</span>' : "") +
    '</span></label>';
  const subOpciones = items => '<div style="margin:-4px 0 10px 26px;padding-left:10px;border-left:2px solid #dbeafe">' + items.join("") + '</div>';
  const radioSub = (campo, valor, label, puesto) => '<label style="display:flex;align-items:center;gap:7px;padding:3px 0;cursor:pointer">' +
    '<input type="radio" name="pdf-' + campo + '"' + (puesto ? " checked" : "") + ' onchange="setPDFHorasModo(\'' + valor + '\')" style="accent-color:#2563eb">' +
    '<span style="font-size:0.76rem;color:#374151">' + label + '</span></label>';
  const checkSub = (campo, label, puesto) => '<label style="display:flex;align-items:center;gap:7px;padding:3px 0;cursor:pointer">' +
    '<input type="checkbox"' + (puesto ? " checked" : "") + ' onchange="togglePDFOpt(\'' + campo + '\')" style="accent-color:#2563eb">' +
    '<span style="font-size:0.76rem;color:#374151">' + label + '</span></label>';

  return '<div class="modal-bg" onclick="if(event.target===this)cerrarModalPDF()">' +
    '<div class="modal-box modal-scroll" style="max-width:470px">' +
      '<div class="modal-scroll-head">' +
        '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">' +
          '<div style="font-family:Georgia,serif;font-size:1rem;color:#111827">📄 Exportar PDF — ' + escHTML(perEtiqueta(per)) + '</div>' +
          '<button onclick="cerrarModalPDF()" style="background:transparent;border:none;font-size:1.2rem;cursor:pointer;color:#6b7280">✕</button>' +
        '</div>' +
        '<div style="font-size:0.73rem;color:#6b7280;margin-bottom:10px">Elegí el período y qué secciones incluir en el informe.</div>' +
      '</div>' +
      '<div class="modal-scroll-body">' +
        renderSelectorPeriodo("pdf") +
        fila("planilla", "Planilla de guardias", "Calendario, una hoja por mes", true) +
        fila("horas", "Horas por médico", hayHoras ? "Guardias, horas totales y promedio" : "Sin guardias cargadas en el período", hayHoras) +
        ((o.horas && hayHoras) ? subOpciones([
          radioSub("horasModo", "mes", "Una tabla por mes", o.horasModo === "mes"),
          radioSub("horasModo", "columnas", "Una tabla con los meses en columnas", o.horasModo === "columnas"),
          checkSub("horasGrafica", "Agregar gráfica de barras (día claro / noche oscuro)", o.horasGrafica),
        ]) : "") +
        fila("notas", "Notas del mes", hayNotas ? "Texto del panel 📝 Notas del mes" : "No hay notas escritas en el período", hayNotas) +
        fila("ausencias", "Licencias y ausencias", hayAus ? "Médico, tipo, período y motivo" : "Sin ausencias registradas en el período", hayAus) +
        ((o.ausencias && hayAus) ? subOpciones([
          checkSub("licTimeline", "Agregar línea de tiempo (médicos en filas, días en el eje)", o.licTimeline),
          checkSub("licBarras", "Agregar barras de días de licencia por mes", o.licBarras),
        ]) : "") +
        fila("historial", "Historial de intercambios y movimientos", hayHist ? "Permutas y traslados de guardia" : "Sin intercambios registrados", hayHist) +
        (nada ? '<div style="font-size:0.72rem;color:#b91c1c;font-weight:600;margin-bottom:10px">Elegí al menos una sección para poder exportar.</div>' : "") +
      '</div>' +
      '<div class="modal-scroll-foot" style="display:grid;grid-template-columns:1fr 1fr;gap:10px">' +
        '<button class="btn btn-primary"' + ((nada || !ok) ? " disabled" : "") + ' onclick="confirmarExportarPDF()" style="' + ((nada || !ok) ? "opacity:.45;cursor:not-allowed" : "") + '">📄 Generar PDF</button>' +
        '<button class="btn btn-secondary" onclick="cerrarModalPDF()">Cancelar</button>' +
      '</div>' +
    '</div></div>';
}

/* ─── EXPORTAR PDF ───────────────────────────────────────────
   Orden fijo del informe: Calendario → Horas → Licencias → Historial. Sólo se imprime
   lo que esté tildado, y una sección sin datos en el período no genera hoja: una hoja
   vacía con encabezado institucional parece un informe completo al que le falta todo.
   Toda la hoja es A4 apaisado (ya lo era antes de esta tanda), así que la hoja de Horas
   sale horizontal sin tener que mezclar orientaciones dentro de un mismo PDF —que es lo
   que ni Safari ni Chrome hacen desde window.print()—. */
function exportarPDF(opciones) {
  const opt = Object.assign({
    planilla: true, horas: false, notas: false, ausencias: false, historial: false,
    horasModo: "mes", horasGrafica: false, licTimeline: false, licBarras: false,
  }, opciones || {});
  const per = perNorm(opt.periodo || perDefecto());
  if (!perValido(per)) { alert("Elegí las dos fechas del rango antes de exportar."); return; }

  const ag = perAgregar(per);
  const conDatos = ag.meses.filter(m => m.hayCal);
  const cfg = state.config || {};
  const logo = logoSeguro();
  const etPer = perEtiqueta(per);

  // Encabezado institucional, repetido en cada hoja del informe.
  const enc = (titulo, sub) => '<div class="pdf-head">' +
    (logo ? '<img class="pdf-logo" src="' + escAttr(logo) + '" alt="">' : "") +
    (cfg.institucion ? '<div class="pdf-inst">' + escHTML(cfg.institucion) + '</div>' : "") +
    (cfg.servicio ? '<div class="pdf-servicio">' + escHTML(cfg.servicio) + '</div>' : "") +
    (cfg.coordinador ? '<div class="pdf-coord">' + escHTML(cfg.coordinador) + '</div>' : "") +
    '<div class="pdf-linea"></div>' +
    '<h1 class="titulo">' + escHTML(titulo) + '</h1>' +
    (sub ? '<div class="pdf-sub">' + escHTML(sub) + '</div>' : "") +
    '</div>';

  // ─── Celda de un día del calendario ───
  const celdaHTML = (fecha, dentro) => {
    const dia = Number(fecha.split("-")[2]);
    if (!dentro) return '<td class="fuera"></td>';   // día fuera del rango elegido
    const cal = perCal(Number(fecha.split("-")[0]), Number(fecha.split("-")[1]) - 1);
    const data = cal[fecha] || { asignaciones: [], notas: "" };
    const asigsOrd = ordenarAsignaciones(data.asignaciones);
    const pendientes = asigsOrd.filter(a => esPendiente(a));
    const cubiertas = asigsOrd.filter(a => !esPendiente(a));
    const principal = cubiertas.filter(a => esGuardia(a));
    const apoyo = cubiertas.filter(a => !esGuardia(a));

    const principalHTML = principal.map(a => {
      const m = getMedico(a.medicoId);
      return m ? '<div class="p-med">' + escHTML(m.nombre) + '<span class="p-hora"> · ' + escHTML(horarioDe(a)) + '</span></div>' : "";
    }).join("");
    const apoyoHTML = apoyo.map(a => {
      const m = getMedico(a.medicoId);
      return m ? '<div class="a-med">' + escHTML(m.nombre) + '<span class="a-hora"> · ' + escHTML(horarioDe(a)) + '</span></div>' : "";
    }).join("");
    const franja = a => {
      const hora = (a.horario && String(a.horario).trim()) ? String(a.horario)
        : (a.rol !== "PEN" ? getRol(a.rol).label : "horario a definir");
      return '<div class="pen-band">⚠ Pendiente · ' + escHTML(hora) + '</div>';
    };
    const esNocturno = a => {
      const h = horaInicioDe(a);
      return a.rol === "N12" || ((h != null) && (h >= 19 || h < 6));
    };
    const penArriba = pendientes.filter(a => !esNocturno(a)).map(franja).join("");
    const penAbajo = pendientes.filter(esNocturno).map(franja).join("");
    const medicosHTML = principalHTML + apoyoHTML;
    const sep = '<div class="pen-sep"></div>';
    const cuerpo = [
      penArriba,
      (penArriba && medicosHTML) ? sep : "",
      medicosHTML,
      (penAbajo && (medicosHTML || penArriba)) ? sep : "",
      penAbajo,
    ].join("");
    const soloPend = pendientes.length > 0 && cubiertas.length === 0;
    return '<td class="' + (soloPend ? "solo-pendiente" : "") + '"><div class="num">' + dia + '</div>' + cuerpo + '</td>';
  };

  // ─── Tabla calendario de un mes (en modo rango, sólo los días del rango) ───
  const tablaMes = (m, conNotas) => {
    const totalD = new Date(m.anio, m.mes + 1, 0).getDate();
    const primerD = (new Date(m.anio, m.mes, 1).getDay() + 6) % 7;   // base-lunes
    const vacias = [];
    for (let k = 0; k < primerD; k++) vacias.push('<td class="vacio"></td>');
    const celdas = [];
    for (let d = 1; d <= totalD; d++) {
      const f = m.anio + "-" + String(m.mes + 1).padStart(2, "0") + "-" + String(d).padStart(2, "0");
      celdas.push(celdaHTML(f, d >= m.dIni && d <= m.dFin));
    }
    const relleno = [];
    for (let k = 0; k < (7 - ((primerD + totalD) % 7)) % 7; k++) relleno.push('<td class="vacio"></td>');
    const todas = vacias.concat(celdas, relleno);
    const filas = [];
    for (let i = 0; i < todas.length; i += 7) filas.push("<tr>" + todas.slice(i, i + 7).join("") + "</tr>");
    /* Alto útil de un A4 apaisado a 96 ppp: 210 mm menos 24 mm de márgenes son ~703 px.
       Descontando el encabezado institucional (~122 px), la fila de días (~27 px) y, si
       va, el bloque de notas (~62 px), queda esto para la grilla. Medido en el navegador
       a ancho de hoja, no estimado. */
    const disponible = (conNotas ? 435 : 505);
    const altoFila = disponible / filas.length;
    // Día más cargado del mes: es el que decide si el texto entra o la fila se estira.
    let maxEnt = 1;
    for (let d = m.dIni; d <= m.dFin; d++) {
      const f = m.anio + "-" + String(m.mes + 1).padStart(2, "0") + "-" + String(d).padStart(2, "0");
      const cal = perCal(m.anio, m.mes);
      const n = ((cal[f] && cal[f].asignaciones) || []).length;
      if (n > maxEnt) maxEnt = n;
    }
    /* Cada entrada ocupa alto de línea + separación; la celda gasta además el número de
       día y el relleno, que se cobran igual tenga una asignación o seis. Con cinco o más
       por día se pasa a modo denso: relleno y número de día chicos, que es lo que hace
       entrar el mes sin bajar el texto por debajo del piso legible. */
    const denso = maxEnt >= 5;
    const fijo = denso ? 13 : 24;                          // número de día + relleno
    const porEntrada = Math.max(8, (altoFila - fijo) / maxEnt);
    const fs = Math.max(5.6, Math.min(8, (porEntrada - 2) / 1.73));
    const altoCelda = Math.max(30, Math.floor(altoFila) - 2);
    /* Con el cuerpo de letra ya en el piso, el día más cargado puede seguir sin entrar.
       Se devuelve ese dato para que el llamador decida qué mover. */
    const altoNecesario = filas.length * (fijo + maxEnt * (fs * 1.73 + 2));
    const html = '<table class="cal" style="--hcel:' + altoCelda + 'px;--fscel:' + fs.toFixed(2) + 'pt' +
      ';--pcel:' + (denso ? "2px 4px" : "5px 6px") + ';--numfs:' + (denso ? "6pt" : "7.5pt") +
      ';--nummb:' + (denso ? "0px" : "2px") + '"><thead><tr>' +
      ["L", "M", "M", "J", "V", "S", "D"].map(d => "<th>" + d + "</th>").join("") +
      '</tr></thead><tbody>' + filas.join("\n") + '</tbody></table>';
    return { html: html, cabe: altoNecesario <= disponible };
  };

  const bloqueNotas = (texto) => '<div class="notas-wrap">' +
    '<div class="notas-titulo">Notas del mes</div>' +
    '<div class="notas-cuerpo">' + escHTML(texto) + '</div></div>';

  const hojas = [];

  // ─── 1. Calendario: una hoja por mes, con las notas de ese mes en la misma hoja ───
  if (opt.planilla) {
    conDatos.forEach(m => {
      const rec = (m.dIni > 1 || m.dFin < new Date(m.anio, m.mes + 1, 0).getDate());
      const sub = rec ? ("Días " + m.dIni + " a " + m.dFin + " · período " + etPer) : (cfg.servicio || "");
      const notas = (opt.notas ? perNotas(m.anio, m.mes) : "").trim();
      const conNotas = tablaMes(m, !!notas);
      if (notas && !conNotas.cabe) {
        // El mes no entra junto con las notas: el mes se queda entero y las notas pasan a su hoja.
        hojas.push(enc(MESES[m.mes].toUpperCase() + " " + m.anio, sub) + tablaMes(m, false).html);
        hojas.push(enc("NOTAS DE " + MESES[m.mes].toUpperCase() + " " + m.anio, sub) + bloqueNotas(notas));
      } else {
        hojas.push(enc(MESES[m.mes].toUpperCase() + " " + m.anio, sub) + conNotas.html +
          (notas ? bloqueNotas(notas) : ""));
      }
    });
  }

  // ─── 2. Notas tildadas SIN calendario: todas juntas, separadas por mes ───
  if (opt.notas && !opt.planilla) {
    const partes = ag.meses.map(m => {
      const t = perNotas(m.anio, m.mes);
      return t.trim() ? '<div class="nota-mes"><div class="nota-mes-tit">' + escHTML(m.etiqueta) + '</div>' +
        '<div class="notas-cuerpo">' + escHTML(t) + '</div></div>' : "";
    }).filter(Boolean);
    if (partes.length) hojas.push(enc("NOTAS DEL PERÍODO", etPer) + partes.join(""));
  }

  // ─── 3. Horas por médico ───
  if (opt.horas && ag.filas.length) {
    let tablas = "";
    if (opt.horasModo === "columnas") {
      /* Un solo cuadro con los meses en columnas. Cada celda dice las tres cosas que
         importan: cuántas guardias, cuántas horas y el promedio por guardia. */
      const cab = conDatos.map(m => '<th>' + escHTML(m.etiqueta) + '</th>').join("");
      const cuerpo = ag.filas.map(x => {
        const celdas = conDatos.map(m => {
          const c = m.porMedico[x.medico.id];
          if (!c || !c.guardias) return '<td class="cero">—</td>';
          return '<td class="celda-mes">' + c.guardias + ' · <b>' + fmtH(c.horas) + ' h</b> · ' + fmtH(c.horas / c.guardias) + ' h</td>';
        }).join("");
        return '<tr><td class="nom">' + escHTML(x.medico.nombre) + '</td>' + celdas +
          '<td class="celda-mes total">' + x.guardias + ' · <b>' + fmtH(x.horas) + ' h</b> · ' + fmtH(x.promedio) + ' h</td></tr>';
      }).join("");
      const tot = ag.filas.reduce((t, x) => ({ g: t.g + x.guardias, h: t.h + x.horas }), { g: 0, h: 0 });
      tablas = '<table class="sec horas-col"><thead><tr><th style="text-align:left">Médico</th>' + cab +
        '<th>Total del período</th></tr></thead><tbody>' + cuerpo + '</tbody>' +
        '<tfoot><tr><td class="nom">TOTALES</td>' +
        conDatos.map(m => {
          const g = Object.keys(m.porMedico).reduce((n, k) => n + m.porMedico[k].guardias, 0);
          const h = Object.keys(m.porMedico).reduce((n, k) => n + m.porMedico[k].horas, 0);
          return '<td class="celda-mes">' + g + ' · <b>' + fmtH(h) + ' h</b></td>';
        }).join("") +
        '<td class="celda-mes total">' + tot.g + ' · <b>' + fmtH(tot.h) + ' h</b></td></tr></tfoot></table>' +
        '<div class="leyenda-cel">Cada celda: guardias · horas totales · promedio por guardia.</div>';
    } else {
      // Una tabla por mes, más el total del período al final.
      const unaTabla = (titulo, filas) => {
        if (!filas.length) return "";
        const cuerpo = filas.map(x => '<tr><td class="nom">' + escHTML(x.medico.nombre) + '</td>' +
          '<td class="num">' + x.guardias + '</td>' +
          '<td class="num">' + x.dia + '</td>' +
          '<td class="num">' + x.noche + '</td>' +
          '<td class="num">' + x.apoyo + '</td>' +
          '<td class="num fuerte">' + fmtH(x.horas) + ' h</td>' +
          '<td class="num">' + fmtH(x.horasDia) + ' h</td>' +
          '<td class="num">' + fmtH(x.horasNoche) + ' h</td>' +
          '<td class="num">' + fmtH(x.guardias ? x.horas / x.guardias : 0) + ' h</td></tr>').join("");
        const t = filas.reduce((a, x) => ({ g: a.g + x.guardias, h: a.h + x.horas, hd: a.hd + x.horasDia, hn: a.hn + x.horasNoche }), { g: 0, h: 0, hd: 0, hn: 0 });
        return '<div class="tabla-mes"><div class="sec-tit">' + escHTML(titulo) + '</div>' +
          '<table class="sec"><thead><tr><th style="text-align:left">Médico</th>' +
          ["Guardias", "Día", "Noche", "Apoyos", "Horas", "h día", "h noche", "Promedio"].map(h => "<th>" + h + "</th>").join("") +
          '</tr></thead><tbody>' + cuerpo + '</tbody>' +
          '<tfoot><tr><td class="nom">TOTALES</td><td class="num">' + t.g + '</td><td class="num"></td><td class="num"></td><td class="num"></td>' +
          '<td class="num fuerte">' + fmtH(t.h) + ' h</td><td class="num">' + fmtH(t.hd) + ' h</td><td class="num">' + fmtH(t.hn) + ' h</td><td class="num"></td>' +
          '</tr></tfoot></table></div>';
      };
      tablas = conDatos.map(m => {
        const filas = Object.keys(m.porMedico).map(k => m.porMedico[k]).sort((a, b) => b.horas - a.horas || a.medico.nombre.localeCompare(b.medico.nombre));
        return unaTabla(m.etiqueta, filas);
      }).join("");
      if (conDatos.length > 1) tablas += unaTabla("Total del período — " + etPer, ag.filas);
    }
    hojas.push(enc("HORAS POR MÉDICO", etPer) + tablas + (opt.horasGrafica ? pdfGraficaHoras(ag) : ""));
  }

  // ─── 4. Licencias y ausencias ───
  if (opt.ausencias) {
    const grupos = perAusencias(per);
    if (grupos.length) {
      const bloques = grupos.map(g => {
        const filas = g.lista.map(a => {
          const m = getMedico(a.medicoId);
          const ti = tipoAus(a.tipo);
          const parcial = (a.fDesde && a.fHasta) ? fmtRangoAus(a) : "";
          const recorte = a.desdeRec + " al " + a.hastaRec + " de " + MESES[g.mes];
          const dias = Number(a.hastaRec) - Number(a.desdeRec) + 1;
          return '<tr><td>' + escHTML(m ? m.nombre : "—") + '</td>' +
            '<td>' + escHTML(ti.label) + '</td>' +
            '<td>' + escHTML(recorte) + '</td>' +
            '<td class="num">' + dias + '</td>' +
            '<td>' + escHTML(parcial || "—") + '</td>' +
            '<td>' + escHTML(a.motivo || "—") + '</td></tr>';
        }).join("");
        const totalDias = g.lista.reduce((n, a) => n + (Number(a.hastaRec) - Number(a.desdeRec) + 1), 0);
        return '<div class="tabla-mes"><div class="sec-tit">' + escHTML(g.etiqueta) + '</div>' +
          '<table class="sec"><thead><tr>' +
          ["Médico", "Tipo", "Período en el mes", "Días", "Período completo", "Motivo"].map(h => "<th>" + h + "</th>").join("") +
          '</tr></thead><tbody>' + filas + '</tbody>' +
          '<tfoot><tr><td colspan="3">TOTAL ' + escHTML(g.etiqueta) + '</td><td class="num">' + totalDias + '</td><td></td><td></td></tr></tfoot>' +
          '</table></div>';
      }).join("");
      const notaParte = grupos.length > 1
        ? '<div class="leyenda-cel">Una licencia que cruza de mes aparece en cada mes con la parte que le corresponde; la columna «Período completo» muestra el rango entero.</div>'
        : "";
      hojas.push(enc("LICENCIAS Y AUSENCIAS", etPer) + bloques + notaParte +
        (opt.licTimeline ? pdfTimelineAusencias(grupos, per) : "") +
        (opt.licBarras ? pdfBarrasAusencias(grupos) : ""));
    }
  }

  // ─── 5. Historial de intercambios y movimientos ───
  if (opt.historial) {
    const bloques = conDatos.map(m => {
      const evs = eventosIntercambioDias(m.anio, m.mes, m.dIni, m.dFin);
      if (!evs.length) return "";
      const filas = evs.map(e => {
        const dias = e.direccional ? (e.dias[0] + " → " + e.dias[1]) : e.dias.join(" ⇄ ");
        return '<tr><td>' + escHTML(dias) + " " + escHTML(MESES_CORTO[m.mes]) + '</td>' +
          '<td>' + escHTML(e.medicos) + '</td><td>' + escHTML(e.tipo) + '</td>' +
          '<td>' + escHTML(e.detalle || "—") + '</td><td>' + escHTML(e.motivo || "—") + '</td></tr>';
      }).join("");
      return '<div class="tabla-mes"><div class="sec-tit">' + escHTML(m.etiqueta) + '</div>' +
        '<table class="sec"><thead><tr>' + ["Fecha", "Médico(s)", "Tipo", "Detalle", "Motivo"].map(h => "<th>" + h + "</th>").join("") +
        '</tr></thead><tbody>' + filas + '</tbody></table></div>';
    }).filter(Boolean).join("");
    if (bloques) hojas.push(enc("INTERCAMBIOS Y MOVIMIENTOS", etPer) + bloques);
  }

  if (!hojas.length) {
    alert("No hay nada para imprimir con lo elegido en " + etPer + ".\n\nRevisá el período y las secciones tildadas.");
    return;
  }

  /* Los meses del período sin calendario guardado se declaran en el informe, no sólo en
     pantalla: si no, una hoja que falta se lee como un mes sin guardias. */
  const avisoFaltan = ag.sinDatos.length
    ? '<div class="aviso-faltan">Sin guardias cargadas en ' + ag.sinDatos.map(x => escHTML(x.etiqueta)).join(", ") +
      ': ' + (ag.sinDatos.length === 1 ? "ese mes no se incluyó" : "esos meses no se incluyeron") + ' en este informe.</div>'
    : "";

  const hoy = new Date();
  const emision = hoy.toLocaleDateString("es") + " " + hoy.toLocaleTimeString("es", { hour: "2-digit", minute: "2-digit" });
  const pie = '<div class="pdf-pie">Emitido el ' + escHTML(emision) + ' · ' + escHTML(SHARE_BASE) + '</div>';

  const html = '<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8">' +
'<title>Guardias ' + escHTML(etPer) + '</title>' +
'<style>' +
'  @page { size: 297mm 210mm; margin: 12mm 10mm; }   /* A4 apaisado, en mm para máxima compatibilidad */' +
'  * { box-sizing:border-box; margin:0; padding:0; }' +
'  body { font-family: Arial, Helvetica, sans-serif; color:#111; background:#fff;' +
'         -webkit-print-color-adjust: exact; print-color-adjust: exact; }' +
'  .hoja { page-break-before: always; break-before: page; }' +
'  .hoja:first-child { page-break-before: auto; break-before: auto; }' +
'  .pdf-head { position:relative; text-align:center; margin-bottom:12px; min-height:1px; }' +
'  .pdf-logo { position:absolute; top:0; right:0; max-height:60px; max-width:170px; display:block; }' +
'  .pdf-inst { font-size:10pt; font-weight:600; color:#6b7280; letter-spacing:.5px; }' +
'  .pdf-servicio { font-size:14pt; font-weight:700; text-transform:uppercase; color:#111; letter-spacing:.6px; }' +
'  .pdf-coord { font-size:10pt; color:#6b7280; margin-top:2px; }' +
'  .pdf-linea { border-top:1px solid #d1d5db; margin:7px 0 9px; }' +
'  .pdf-sub { font-size:9.5pt; color:#6b7280; margin-top:4px; }' +
'  h1.titulo { text-align:center; font-family:Georgia,"Times New Roman",serif; font-size:21pt; font-weight:700; letter-spacing:1px; color:#111; margin:0; }' +
'  table.cal { width:100%; border-collapse:collapse; table-layout:fixed; }' +
'  table.cal thead th { background:#e5e7eb; color:#374151; font-size:9pt; font-weight:700; padding:6px 0; text-align:center; border:1px solid #9ca3af; }' +
'  table.cal td { border:1px solid #9ca3af; vertical-align:top; padding:var(--pcel,5px 6px); height:var(--hcel,86px); background:#fff; }' +
'  table.cal td.vacio { background:#fff; }' +
'  /* Día que queda fuera del rango elegido: la grilla conserva su forma pero la celda no' +
'     trae contenido, para que no se lea como un día sin guardias. */' +
'  table.cal td.fuera { background:#f3f4f6; }' +
'  .num { font-size:var(--numfs,7.5pt); font-weight:700; color:#6b7280; margin-bottom:var(--nummb,2px); line-height:1.15; }' +
'  .p-med { font-size:var(--fscel,8pt); font-weight:700; color:#000; line-height:1.3; margin-bottom:2px; }' +
'  .p-hora { font-weight:400; color:#374151; font-size:0.88em; }' +
'  .a-med { font-size:var(--fscel,8pt); font-weight:600; color:#b45309; line-height:1.3; margin-bottom:2px; }' +
'  .a-hora { font-weight:400; color:#b45309; font-size:0.85em; }' +
'  .pen-band { background:#fef2f2; border-left:3px solid #dc2626; padding:1px 4px; margin-bottom:2px;' +
'              font-size:var(--fscel,8pt); font-weight:600; color:#dc2626; line-height:1.2; }' +
'  .pen-sep { border-top:1px solid #e5e7eb; margin:3px 0; }' +
'  table.cal td.solo-pendiente { background:#fef2f2; }' +
'  .tabla-mes { margin-bottom:14px; }' +
'  .sec-tit { font-size:11pt; font-weight:700; color:#111; margin:0 0 4px; }' +
'  table.sec { width:100%; border-collapse:collapse; font-size:8.5pt; table-layout:auto; }' +
'  table.sec th { background:#e5e7eb; border:1px solid #9ca3af; padding:4px 8px; text-align:center; font-size:8pt; }' +
'  table.sec td { border:1px solid #cbd5e1; padding:4px 8px; height:auto; vertical-align:top; }' +
'  table.sec td.nom { font-weight:600; white-space:nowrap; }' +
'  table.sec td.num { text-align:center; }' +
'  table.sec td.fuerte { font-weight:700; }' +
'  table.sec tfoot td { background:#e5e7eb; font-weight:700; border:1px solid #9ca3af; }' +
'  table.horas-col td.celda-mes { text-align:center; white-space:nowrap; font-size:8.5pt; }' +
'  table.horas-col td.cero { text-align:center; color:#9ca3af; }' +
'  table.horas-col td.total { background:#f1f5f9; }' +
'  .leyenda-cel { font-size:7.5pt; color:#6b7280; margin-top:3px; }' +
'  .notas-wrap { margin-top:10px; }' +
'  .notas-titulo { font-size:11pt; font-weight:700; color:#111; margin-bottom:5px; border-bottom:1px solid #9ca3af; padding-bottom:3px; }' +
'  .notas-cuerpo { font-size:9pt; color:#374151; line-height:1.5; white-space:pre-wrap; }' +
'  .nota-mes { margin-bottom:14px; }' +
'  .nota-mes-tit { font-size:10.5pt; font-weight:700; color:#111; border-bottom:1px solid #cbd5e1; padding-bottom:3px; margin-bottom:5px; }' +
'  .graf { margin-top:14px; page-break-inside: avoid; break-inside: avoid; }' +
'  .graf-tit { font-size:9pt; font-weight:700; color:#374151; margin-bottom:5px; }' +
'  .aviso-faltan { margin-top:12px; font-size:8.5pt; color:#92400e; background:#fffbeb; border:1px solid #fcd34d;' +
'                  border-radius:4px; padding:5px 8px; }' +
'  .pdf-pie { margin-top:14px; font-size:7.5pt; color:#9ca3af; text-align:right; }' +
'</style></head><body>' +
hojas.map((h, i) => '<section class="hoja">' + h + (i === hojas.length - 1 ? avisoFaltan + pie : "") + '</section>').join("") +
'</body></html>';

  const win = window.open("", "_blank");
  if (!win) {
    alert("El navegador bloqueó la ventana emergente. Permití las ventanas emergentes para generar el PDF.");
    return;
  }
  win.document.open();
  win.document.write(html);
  win.document.close();
  win.focus();
  const lanzarPrint = () => { try { win.focus(); win.print(); } catch (e) {} };
  if (win.document.readyState === "complete") {
    setTimeout(lanzarPrint, 350);
  } else {
    win.onload = () => setTimeout(lanzarPrint, 350);
    setTimeout(lanzarPrint, 700);
  }
}

// ─── IR AL PRIMER DÍA SIN CUBRIR (CAMBIO 5) ──────────────────
// Lleva el foco a una celda del calendario y la resalta un momento.
function resaltarDia(fecha) {
  const el = document.getElementById("cell-" + fecha);
  if (!el) return;
  el.scrollIntoView({ behavior: "smooth", block: "center" });
  const prev = el.style.boxShadow;
  el.style.boxShadow = "inset 0 0 0 3px #b91c1c";
  setTimeout(() => { el.style.boxShadow = prev; }, 2200);
}
// Cierra el modal de resumen y salta al día. Si la vista semanal no muestra ese día,
// se pasa a vista mensual para poder mostrarlo.
function irADia(fecha) {
  state.modalResumen = null;
  state.view = "calendario";
  render();
  if (!document.getElementById("cell-" + fecha)) { state.modoCal = "mes"; render(); }
  resaltarDia(fecha);
}
function irPrimerSinCubrir() {
  if(state.view !== "calendario") { state.view = "calendario"; render(); }
  const primera = Object.keys(state.calendario).sort().find(f => diaSinCubrir(f));
  if(primera) resaltarDia(primera);
}

// ─── RESUMEN DE PENDIENTES (desde los badges del header) ─────
function abrirResumen(tipo) { state.modalResumen = tipo; render(); }
function cerrarResumen() { state.modalResumen = null; render(); }
// Etiqueta corta del turno: "Diurno 08–20 hs", "Nocturno 20–08 hs", "Apoyo 4 horas …"
function etiquetaTurno(a) {
  const rol = getRol(a.rol);
  const override = (a.horario && String(a.horario).trim()) ? String(a.horario) : "";
  if (a.rol === "PEN") return override || "turno sin definir";
  const base = a.rol === "D12" ? "Diurno" : a.rol === "N12" ? "Nocturno" : rol.desc;
  const hora = override || rol.label;
  // El "label" de los apoyos no es un rango horario ("Apoyo 4hs"): repetirlo al lado
  // del nombre del turno no aporta, así que solo se agrega si es un rango real.
  return /\d\s*[-–—]\s*\d/.test(hora) ? `${base} ${hora}` : base;
}
function nombreDiaLargo(fecha) {
  const [y, m, d] = fecha.split("-").map(Number);
  return `${DIAS_FULL[new Date(y, m - 1, d).getDay()]} ${d}`;
}
function renderModalResumen() {
  if (!state.modalResumen) return "";
  const esDias = state.modalResumen === "dias";
  const fechas = Object.keys(state.calendario || {}).sort();

  let filas = [];
  if (esDias) {
    fechas.filter(f => diaSinCubrir(f)).forEach(f => {
      const asigs = diaData(f).asignaciones || [];
      // Qué falta: los turnos de guardia pendientes; si el día está vacío, no hay nada cargado.
      const faltan = asigs.filter(a => esPendiente(a) && (a.rol === "PEN" || esGuardia(a)));
      const detalle = faltan.length
        ? faltan.map(a => escHTML(etiquetaTurno(a))).join(" · ")
        : `<span style="color:#9ca3af">Sin ninguna asignación cargada</span>`;
      filas.push({ fecha: f, detalle });
    });
  } else {
    fechas.forEach(f => {
      (diaData(f).asignaciones || []).filter(esPendiente).forEach(a => {
        /* Se arrastra el texto del prototipo: sin él la lista de pendientes son N filas
           idénticas ("Pendiente · Diurno 08–20 hs") y el único dato accionable —qué
           nombre no se pudo identificar— queda escondido en el modal de cada día. */
        filas.push({ fecha: f, detalle: `⚠ Pendiente · ${escHTML(etiquetaTurno(a))}` + (a.txt ? ` · «${escHTML(a.txt)}»` : "") });
      });
    });
  }

  const listaHTML = filas.length
    ? filas.map(x => `<div onclick="irADia('${x.fecha}')" class="resumen-fila">
        <span style="font-size:0.82rem;font-weight:700;color:#111827;min-width:104px">${escHTML(nombreDiaLargo(x.fecha))}</span>
        <span style="font-size:0.76rem;color:#b91c1c;flex:1">${x.detalle}</span>
        <span style="font-size:0.72rem;color:#9ca3af">ver ›</span>
      </div>`).join("")
    : `<div style="padding:16px;text-align:center;color:#15803d;font-size:0.83rem;font-weight:600">✅ No hay nada pendiente en ${MESES[state.mes]}.</div>`;

  const titulo = esDias
    ? `⚠️ Días sin cubrir — ${MESES[state.mes]} ${state.anio}`
    : `⚠️ Turnos pendientes — ${MESES[state.mes]} ${state.anio}`;
  const bajada = esDias
    ? "Días en los que falta cubrir al menos una guardia."
    : "Todas las asignaciones marcadas como pendientes de cubrir.";

  return `<div class="modal-bg" onclick="if(event.target===this)cerrarResumen()">
    <div class="modal-box" style="max-width:480px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
        <div style="font-family:Georgia,serif;font-size:1rem;color:#111827">${titulo}</div>
        <button onclick="cerrarResumen()" style="background:transparent;border:none;font-size:1.2rem;cursor:pointer;color:#6b7280">✕</button>
      </div>
      <div style="font-size:0.72rem;color:#6b7280;margin-bottom:12px">${bajada}${filas.length ? " Tocá una fila para ir a ese día." : ""}</div>
      <div style="max-height:56vh;overflow:auto">${listaHTML}</div>
    </div>
  </div>`;
}

// ─── EXPORTAR / IMPORTAR MES JSON (CAMBIO 6) ─────────────────
// ─── REPORTE PARA RRHH (PDF vertical) ────────────────────────
// Una fila por médico del equipo, incluidos los que no tienen guardias en el mes:
// RRHH necesita ver el cero explícito, no una ausencia de fila.
function datosReporteRRHH(p) {
  const per = perNorm(p || perRef("rrhh"));
  const ag = perAgregar(per);
  const acc = {};
  medicos.forEach(m => {
    acc[m.id] = { medico: m, guardias: 0, diurnas: 0, nocturnas: 0, apoyos: 0, horas: 0, horasDia: 0, horasNoche: 0,
                  licencia: 0, solicitud: 0, enfermedad: 0, otro: 0 };
  });
  ag.filas.forEach(x => {
    const fila = acc[x.medico.id];
    if (!fila) return;
    fila.guardias = x.guardias;
    fila.diurnas = x.dia; fila.nocturnas = x.noche; fila.apoyos = x.apoyo;
    fila.horas = x.horas; fila.horasDia = x.horasDia; fila.horasNoche = x.horasNoche;
  });
  /* Días de ausencia recortados al período: una licencia que cruza el borde aporta sólo
     los días que caen adentro. Antes se sumaba el segmento entero del mes en pantalla. */
  perAusencias(per).forEach(g => g.lista.forEach(a => {
    const fila = acc[Number(a.medicoId)];
    if (!fila) return;
    const dias = Math.max(0, Number(a.hastaRec) - Number(a.desdeRec) + 1);
    if (a.tipo === "licencia") fila.licencia += dias;
    else if (a.tipo === "solicitud") fila.solicitud += dias;
    else if (a.tipo === "enfermedad") fila.enfermedad += dias;
    else fila.otro += dias;
  }));
  return Object.keys(acc).map(k => Object.assign({}, acc[k], { observaciones: observacionAuto(acc[k]) }))
    .sort((x, y) => y.horas - x.horas || x.medico.nombre.localeCompare(y.medico.nombre));
}
// Observación sugerida (el jefe puede sobrescribirla en la previsualización).
function observacionAuto(x) {
  const o = [];
  if (x.enfermedad) o.push(`Enfermedad: ${x.enfermedad} día${x.enfermedad !== 1 ? "s" : ""}`);
  if (x.otro) o.push(`Otros: ${x.otro} día${x.otro !== 1 ? "s" : ""}`);
  if (!x.diurnas && !x.nocturnas && !x.apoyos) o.push("Sin guardias en el mes");
  return o.length ? o.join(" · ") : "—";
}

// ─── PREVISUALIZACIÓN EDITABLE DEL REPORTE RRHH ──────────────
// Las ediciones viven solo en state.reporteRRHH (memoria): no pasan por guardarEstado()
// ni por localStorage, así que se pierden al cerrar. Son para esa impresión y nada más.
function abrirReporteRRHH() {
  const per = perDefecto();
  state.reporteRRHH = { periodo: per, filas: datosReporteRRHH(per) };
  render();
}
/* Al cambiar el período se recalculan las filas. Las correcciones a mano de horas y
   observaciones se pierden a propósito: eran de otro período. */
function rrhhRecalcular() {
  if (!state.reporteRRHH) return;
  const per = perNorm(state.reporteRRHH.periodo);
  state.reporteRRHH.periodo = per;
  state.reporteRRHH.filas = perValido(per) ? datosReporteRRHH(per) : [];
}
function cerrarReporteRRHH() { state.reporteRRHH = null; render(); }
function rrhhSetHoras(i, v) {
  const f = state.reporteRRHH && state.reporteRRHH.filas[i];
  if (!f) return;
  f.horas = Math.max(0, Number(v) || 0);
  const el = document.getElementById("rrhh-total-horas");
  if (el) el.textContent = fmtH(state.reporteRRHH.filas.reduce((t, x) => t + (Number(x.horas) || 0), 0));
}
function rrhhSetObs(i, v) {
  const f = state.reporteRRHH && state.reporteRRHH.filas[i];
  if (f) f.observaciones = v;
}
function renderReporteRRHH() {
  if (!state.reporteRRHH) return "";
  const per = perRef("rrhh");
  const ok = perValido(per);
  const filas = state.reporteRRHH.filas || [];
  const editable = !!state.jefe;
  const tot = filas.reduce((t, x) => ({
    diurnas: t.diurnas + x.diurnas, nocturnas: t.nocturnas + x.nocturnas, apoyos: t.apoyos + x.apoyos,
    horas: t.horas + (Number(x.horas) || 0), licencia: t.licencia + x.licencia, solicitud: t.solicitud + x.solicitud,

    <td class="rr-edit">${editable
      ? `<input type="number" min="0" step="0.5" value="${fmtH(x.horas)}" oninput="rrhhSetHoras(${i},this.value)">`
      : `<span>${fmtH(x.horas)}</span>`}</td>
    <td class="rr-num">${x.licencia}</td>
    <td class="rr-num">${x.solicitud}</td>
    <td class="rr-edit">${editable

      : `<span>${escHTML(x.observaciones || "—")}</span>`}</td>
  </tr>`).join("");

  return `<div class="modal-bg" onclick="if(event.target===this)cerrarReporteRRHH()">
    <div class="modal-box modal-scroll" style="max-width:940px">
      <div class="modal-scroll-head">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
          <div style="font-family:Georgia,serif;font-size:1rem;color:#111827">📋 Reporte RRHH — ${escHTML(perEtiqueta(per))}</div>
          <button onclick="cerrarReporteRRHH()" style="background:transparent;border:none;font-size:1.2rem;cursor:pointer;color:#6b7280">✕</button>
        </div>
        <div style="font-size:0.73rem;color:#6b7280;margin-bottom:12px">
          ${editable
            ? "Revisá los datos antes de imprimir. <strong>Horas totales</strong> y <strong>Observaciones</strong> se pueden corregir a mano; el resto se calcula solo. Las correcciones valen únicamente para este PDF, no se guardan, y se recalculan si cambiás el período."
            : "Vista de solo lectura."}
        </div>
      </div>
      <div class="modal-scroll-body">
        ${renderSelectorPeriodo("rrhh")}
        <div style="overflow-x:auto">
          <table class="rr-tabla">
            <thead><tr>
              <th style="text-align:left">Médico</th>
              <th>G. Día</th><th>G. Noche</th><th>Apoyos</th>
              <th class="rr-th-edit">Horas totales ✎</th>
              <th>Licencias (días)</th><th>Días pedidos</th>
              <th class="rr-th-edit" style="text-align:left">Observaciones ✎</th>
            </tr></thead>
            <tbody>${cuerpo}</tbody>
            <tfoot><tr>
              <td>TOTALES</td>
              <td class="rr-num">${tot.diurnas}</td>

              <td class="rr-num" id="rrhh-total-horas">${fmtH(tot.horas)}</td>
              <td class="rr-num">${tot.licencia}</td>

        <button class="btn btn-primary" ${ok ? "" : "disabled"} onclick="generarPDFReporteRRHH()" ${ok ? "" : 'style="opacity:.45;cursor:not-allowed"'}>📄 Generar PDF</button>
        <button class="btn btn-secondary" onclick="cerrarReporteRRHH()">Cancelar</button>
      </div>

}
function generarPDFReporteRRHH() {
  if (!state.reporteRRHH) return;
  const per = perNorm(state.reporteRRHH.periodo);
  if (!perValido(per)) return;
  const filas = state.reporteRRHH.filas;
  state.reporteRRHH = null;
  render();
  exportarReporteRRHH(filas, per);   // se imprime con los valores editados
}

function exportarMesJSON() {
  const data = {
    app: "GuardiaSync",
    anio: state.anio,
    mes: state.mes,
    mesNombre: MESES[state.mes],
    calendario: state.calendario,
    medicos: medicos,
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `GuardiaSync_${MESES[state.mes]}_${state.anio}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function importarMesJSON(ev) {
  const file = ev.target.files && ev.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      /* Antes esto no preguntaba NADA: importar un export viejo reemplazaba el mes sin decir una
         palabra. Y si el archivo no traía anio/mes, su calendario se guardaba bajo el mes que
         estuviera en pantalla — el mismo accidente que vació noviembre, por otro camino. */
      if (typeof data.anio !== "number" || typeof data.mes !== "number" ||
          data.mes < 0 || data.mes > 11 || data.anio < 2000 || data.anio > 2100) {
        alert("❌ Archivo rechazado: no dice de qué mes es.\n\n" +
          "Un export de GuardiaSync trae los campos «anio» y «mes». Sin eso no se sabe dónde va, " +
          "y escribirlo en el mes que esté en pantalla es justamente lo que borra meses.");
        ev.target.value = ""; return;
      }
      if (!data.calendario || typeof data.calendario !== "object" || Array.isArray(data.calendario) ||
          !Object.keys(data.calendario).length) {
        alert("❌ Archivo rechazado: no trae un calendario.");
        ev.target.value = ""; return;
      }
      const et = etiquetaMes(data.anio, data.mes);
      const aj = clavesAjenas(data.calendario, data.anio, data.mes);
      if (aj.length) {
        alert("❌ Archivo rechazado: dice ser de " + et + " pero trae " + detalleAjenas(agruparAjenas(aj)) + ".");
        ev.target.value = ""; return;
      }
      if (mesCerrado(data.anio, data.mes)) {
        alert("🔒 " + et + " está cerrado: no se importa nada encima.\n\nAbrí el candado de ese mes y volvé a intentarlo.");
        ev.target.value = ""; return;
      }
      const actual = leerCalMes(data.anio, data.mes);
      const nAct = diasConGuardias(actual.cal || {});
      const nNue = diasConGuardias(data.calendario);
      const bor = borradorLeer(data.anio, data.mes);
      if (!confirm("📥 IMPORTAR " + et.toUpperCase() + "\n\n" +
        "Se REEMPLAZA " + et + ": ahora tiene " + nAct + " día(s) con guardias y el archivo trae " + nNue + ".\n" +
        (bor ? "También se descarta el borrador sin confirmar de ese mes.\n" : "") +
        "\nAntes de reemplazarlo se guarda una copia, recuperable desde ≡ → 🕑 Restaurar versión anterior.\n\n¿Importar?")) {
        ev.target.value = ""; return;
      }
      if (nAct && !snapGuardar(data.anio, data.mes, actual.cal, "antes de importar un mes")) {
        if (!confirm("⚠️ No se pudo guardar la copia de seguridad (almacenamiento lleno).\n\n¿Importar igual? No se va a poder deshacer.")) {
          ev.target.value = ""; return;
        }
      }
      if (bor) snapGuardar(data.anio, data.mes, bor, "borrador descartado al importar");

      if(Array.isArray(data.medicos) && data.medicos.length) medicos = data.medicos;
      state.anio = data.anio;
      state.mes = data.mes;
      state.calendario = data.calendario;
      state.historialMeses[`${state.anio}-${state.mes}`] = state.calendario;
      protoLimpiarRevision();
      // Importar un mes ES confirmarlo: va a lo confirmado y no al borrador.
      if (escribirCal(state.anio, state.mes, state.calendario, { clave: calKey(state.anio, state.mes), permitirVaciar: true })) {
        borradorBorrar(state.anio, state.mes);
        state.borradorPendiente = null;
        state.borradorEnUso = false;
        try { localStorage.setItem("guardias_medicos", JSON.stringify(medicos)); } catch(e2) {}
        alert("✅ Mes importado: " + et + " (" + nNue + " día(s) con guardias).");
      }
      render();
    } catch(err) {
      alert("Archivo JSON inválido.");
    }
    ev.target.value = "";
  };
  reader.readAsText(file);
}

  const cfg = cargarConfig();

      ? `<img src="${escAttr(logo)}" alt="Logo institucional" style="max-height:120px;max-width:220px;margin:0 auto 18px;display:block">`

function intentarLogin() {
  const val = document.getElementById("login-pass").value;
  if(val === "emergencia") {
    try { sessionStorage.setItem("guardias_auth", "ok"); } catch(e) {}
    document.getElementById("login").style.display = "none";
    iniciarApp();
  } else {
    document.getElementById("login-error").style.display = "block";
  }
}

(function bootstrap() {
  // Mes publicado en un gist: se baja el JSON y se abre en solo lectura, sin login.
  const gistId = leerGistDeURL();
  if (gistId) {
    const lg0 = document.getElementById("login");
    if (lg0) lg0.style.display = "none";
    state.compartido = true;   // desde ya: bloquea cualquier escritura mientras carga
    state.jefe = false;
    pantallaCargandoGist();
    cargarDesdeGist(gistId);
    return;
  }

  // Link compartido: entra directo en solo lectura, sin login y sin tocar localStorage.
  const pkgShare = leerShareDeURL();
  if (pkgShare) {
    aplicarPaqueteCompartido(pkgShare);
    const lg = document.getElementById("login");
    if (lg) lg.style.display = "none";
    render();
    return;
  }

  let auth = false;
  try { auth = sessionStorage.getItem("guardias_auth") === "ok"; } catch(e) {}
  if(auth) {
    document.getElementById("login").style.display = "none";
    iniciarApp();
  } else {
    pintarLogin();
    const inp = document.getElementById("login-pass");
    if(inp) inp.focus();
  }
})();
