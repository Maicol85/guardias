        (state.statsGrafica ? "▴ Ocultar gráfica" : "▾ Ver gráfica") + '</button>' : "") +
    '</div>' +
    '<div class="card-wrap">' +
      '<div class="stats-header stats7">' +
        ["Médico", "Total", "☀️ Día", "🌙 Noche", "+ Apoyo", "Horas", "Promedio"].map(h => '<div class="stats-th">' + h + '</div>').join("") +
      '</div>' + cuerpo + pie +
    '</div>' + grafica;
}

  if(!state.modalDia) return "";

  const dia = Number(fecha.split("-")[2]);
  const [__y,__m,__d] = fecha.split("-").map(Number);
  const nombreDia = DIAS_FULL[new Date(__y, __m-1, __d).getDay()];

  // El médico fantasma PENDIENTE se ofrece solo acá (no en el filtro ni en Equipo).
  const opsMedico = medicos.map(m => `<option value="${m.id}">${escHTML(m.sigla)} — ${escHTML(m.nombre)}</option>`).join("")

// ─── CANDADO DEL MES Y BORRADOR ──────────────────────────────
/* Candado abierto = estás editando, y lo que escribís va al BORRADOR del mes. Candado
   cerrado = el mes está confirmado y protegido: no se puede editar hasta abrirlo.
   Lo confirmado (guardias_cal_*) sólo se mueve al cerrar el candado, así que un mes
   terminado no puede quedar roto por lo que pase después. Y el borrador nunca se descarta
   en silencio: al volver al mes se ofrece recuperarlo. */
function bloqKey(anio, mes) { return `guardias_lock_${mesSufijo(anio, mes)}`; }
function borradorKey(anio, mes) { return `guardias_draft_${mesSufijo(anio, mes)}`; }
function borradorTsKey(anio, mes) { return `guardias_draftts_${mesSufijo(anio, mes)}`; }

function mesCerrado(anio, mes) {
  if (state.compartido) return false;
  try { return localStorage.getItem(bloqKey(anio, mes)) === "1"; } catch (e) { return false; }
}
// Un mes es editable si hay sesión de jefe, no es un link compartido y el candado está abierto.
function mesEditable() { return !!state.jefe && !state.compartido && !mesCerrado(state.anio, state.mes); }

function borradorLeer(anio, mes) {
  const r = leerCalClave(borradorKey(anio, mes));
  return r.estado === "ok" ? r.cal : null;
}
function borradorTs(anio, mes) {
  try { return Number(localStorage.getItem(borradorTsKey(anio, mes))) || 0; } catch (e) { return 0; }
}
function borradorGuardar(anio, mes, cal, opts) {
  const o = {};
  Object.keys(opts || {}).forEach(k => { o[k] = opts[k]; });
  o.clave = borradorKey(anio, mes);
  if (!escribirCal(anio, mes, cal, o)) return false;
  try { localStorage.setItem(borradorTsKey(anio, mes), String(Date.now())); } catch (e) {}
  return true;
}
function borradorBorrar(anio, mes) {
  try {
    localStorage.removeItem(borradorKey(anio, mes));
    localStorage.removeItem(borradorTsKey(anio, mes));
  } catch (e) {}
}
function fmtFechaHora(ts) {
  if (!ts) return "sin fecha";
  const d = new Date(Number(ts));
  const p = n => String(n).padStart(2, "0");
  return `${p(d.getDate())}/${p(d.getMonth() + 1)}/${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

/* Al abrir un mes se decide qué hacer con su borrador, si tiene:
   · sin nada confirmado, el borrador ES el mes (no hay a dónde volver);
   · idéntico a lo confirmado, no es un borrador: se borra y listo;
   · distinto, se muestra lo CONFIRMADO y se ofrece recuperarlo. */
function resolverBorradorAlAbrir() {
  state.borradorPendiente = null;
  state.borradorEnUso = false;
  if (state.compartido) return;
  const b = borradorLeer(state.anio, state.mes);
  if (!b) return;
  if (!calEsDelMes(b, state.anio, state.mes)) {   // borrador de otro mes: no se usa ni se ofrece
    snapGuardar(state.anio, state.mes, b, "borrador con fechas de otro mes, apartado");
    borradorBorrar(state.anio, state.mes);
    return;
  }
  const conf = state.calendario;
  if (!conf || !Object.keys(conf).length) {
    state.calendario = b;
    state.historialMeses[`${state.anio}-${state.mes}`] = b;
    state.borradorEnUso = true;
    return;
  }
  if (JSON.stringify(b) === JSON.stringify(conf)) { borradorBorrar(state.anio, state.mes); return; }
  state.borradorPendiente = { ts: borradorTs(state.anio, state.mes), dias: diasConGuardias(b) };
}

function borradorRecuperar() {
  const b = borradorLeer(state.anio, state.mes);
  if (!b || !calEsDelMes(b, state.anio, state.mes)) {
    alert("El borrador ya no está disponible.");
    state.borradorPendiente = null; render(); return;
  }
  state.calendario = b;
  state.historialMeses[`${state.anio}-${state.mes}`] = b;
  state.borradorPendiente = null;
  state.borradorEnUso = true;
  render();
}
function borradorDescartar() {
  const et = etiquetaMes(state.anio, state.mes);
  if (!confirm("¿Descartar el borrador de " + et + " y quedarte con lo último confirmado?\n\n" +
    "Antes de descartarlo se guarda una copia, así que todavía se puede recuperar desde ≡ → 🕑 Restaurar versión anterior.")) return;
  const b = borradorLeer(state.anio, state.mes);
  if (b) snapGuardar(state.anio, state.mes, b, "borrador descartado");
  borradorBorrar(state.anio, state.mes);
  state.borradorPendiente = null;
  state.borradorEnUso = false;
  render();
}

function candadoCerrar() {
  if (!state.jefe || state.compartido) return;
  const et = etiquetaMes(state.anio, state.mes);
  if (!mesEnMemoriaOk("Cerrar " + et)) return;
  const cal = state.calendario || {};
  const n = diasConGuardias(cal);
  if (!confirm("🔒 CERRAR " + et.toUpperCase() + "\n\n" +
    "Se confirma lo que está en pantalla (" + n + " día" + (n !== 1 ? "s" : "") + " con guardias) y el mes queda protegido: " +
    "no se puede editar hasta volver a abrir el candado.\n\n¿Cerrar el mes?")) return;
  if (!snapAntesDe("antes de cerrar el mes")) return;
  // Lo confirmado se mueve ACÁ y sólo acá.
  if (!escribirCal(state.anio, state.mes, cal, { clave: calKey(state.anio, state.mes) })) return;
  borradorBorrar(state.anio, state.mes);
  try { localStorage.setItem(bloqKey(state.anio, state.mes), "1"); }
  catch (e) { alert("⚠️ El mes se confirmó pero el candado no se pudo guardar (almacenamiento lleno)."); }
  protoLimpiarModos();   // los modos copiar/intercambiar no tienen sentido con el mes cerrado
  state.borradorPendiente = null;
  state.borradorEnUso = false;
  render();
}
function candadoAbrir() {
  if (!state.jefe || state.compartido) return;
  const et = etiquetaMes(state.anio, state.mes);
  if (!confirm("🔓 ABRIR " + et.toUpperCase() + " PARA EDITAR\n\n" +
    "Los cambios se guardan como BORRADOR: lo confirmado queda intacto hasta que vuelvas a cerrar el candado.\n\n" +
    "¿Abrir el mes?")) return;
  snapAntesDe("antes de abrir el candado");
  try { localStorage.removeItem(bloqKey(state.anio, state.mes)); }
  catch (e) { alert("⚠️ No se pudo abrir el candado."); return; }
  render();
}
function candadoToggle() { mesCerrado(state.anio, state.mes) ? candadoAbrir() : candadoCerrar(); }

/* Aviso único para los caminos que escriben con el mes cerrado. Devuelve true si se puede
   seguir. */
function exigirMesAbierto(accion) {
  if (!mesCerrado(state.anio, state.mes)) return true;
  alert("🔒 " + etiquetaMes(state.anio, state.mes) + " está cerrado, así que " + accion + " no se puede hacer.\n\n" +
    "Abrí el candado (🔒 en la barra del mes) y volvé a intentarlo.");
  return false;
}

// ─── RESTAURAR UNA VERSIÓN ANTERIOR ──────────────────────────
function abrirCopias() { state.modalCopias = { anio: state.anio, mes: state.mes }; render(); }
function cerrarCopias() { state.modalCopias = null; render(); }

function restaurarCopia(i) {
  const c = state.modalCopias;
  if (!c) return;
  const arr = snapLista(c.anio, c.mes);
  const copia = arr[Number(i)];
  if (!copia || !copia.cal) { alert("Esa copia ya no está disponible."); render(); return; }
  if (c.anio !== state.anio || c.mes !== state.mes) { alert("Volvé al mes de la copia antes de restaurarla."); return; }
  if (!exigirMesAbierto("restaurar una copia")) return;
  if (!calEsDelMes(copia.cal, c.anio, c.mes)) {
    /* Una copia puede ser de ANTES de la limpieza, y entonces trae las fechas de otro mes que
       se le habían metido adentro. Restaurarla tal cual volvería a mezclar los dos meses. */
    const aj = clavesAjenas(copia.cal, c.anio, c.mes);
    if (!confirm("⚠️ Esta copia tiene " + detalleAjenas(agruparAjenas(aj)) + " mezclados con los días de " +
      etiquetaMes(c.anio, c.mes) + " (es una copia anterior a la limpieza).\n\n" +
      "Se van a restaurar SÓLO los días de " + etiquetaMes(c.anio, c.mes) + ". ¿Seguir?")) return;
  }
  if (!confirm("🕑 Restaurar la copia del " + fmtFechaHora(copia.ts) + "?\n\n" +
    "Reemplaza lo que hay en pantalla. Antes de reemplazarlo se guarda una copia del estado actual, " +
    "así que esto también se puede deshacer.")) return;
  if (!snapAntesDe("antes de restaurar la copia del " + fmtFechaHora(copia.ts), true)) return;

  const limpio = {};
  Object.keys(copia.cal).forEach(f => { if (!clavesAjenas({ [f]: 1 }, c.anio, c.mes).length) limpio[f] = copia.cal[f]; });
  state.calendario = JSON.parse(JSON.stringify(limpio));
  state.historialMeses[`${c.anio}-${c.mes}`] = state.calendario;
  state.modalCopias = null;
  protoLimpiarRevision();
  protoLimpiarModos();
  if (guardarEstado()) {
    alert("✅ Restaurado al estado del " + fmtFechaHora(copia.ts) + " (" + diasConGuardias(state.calendario) + " día(s) con guardias).\n\n" +
      "Quedó como borrador: cerrá el candado del mes para confirmarlo.");
  }
  render();
}

// ─── PESTAÑAS ABIERTAS Y SINCRONIZACIÓN ──────────────────────
/* Dos pestañas de GuardiaSync escriben en el mismo almacenamiento, y cada guardado escribe el
   MES ENTERO. Si cargás guardias en una y después la otra guarda cualquier cosa, la segunda
   pisa todo lo de la primera, porque tiene en memoria el mes como estaba cuando lo abrió.
   No hay forma de fusionar dos versiones de un mes, así que lo único honesto es avisar:
   un latido en localStorage para contar las pestañas vivas, y el evento `storage` —que llega
   sólo a las OTRAS pestañas— para saber que alguien tocó el mes que estoy mirando. */
const TABS_KEY = "guardias_tabs";
const TAB_ID = "t" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
/* El latido es lento y la ventana de vida larga a propósito, con margen para algo que NO se
   puede probar acá: Chrome estrangula los temporizadores de una pestaña oculta a uno por
   minuto, y una pestaña olvidada en otra ventana —justo la peligrosa— está oculta. Con 12 s de
   vida se daría por muerta y el aviso no aparecería nunca; con 150 s entra cómoda incluso
   latiendo una vez por minuto. El costo va para el otro lado: una pestaña que se cierra de
   golpe, sin pasar por beforeunload, queda fantasma hasta 150 s. Un aviso de más es barato;
   uno de menos cuesta un mes de guardias.
   Ojo al probar dos pestañas: la sesión vive en sessionStorage, que es POR PESTAÑA, así que la
   segunda arranca en la pantalla de ingreso y no late hasta que alguien entra. Una segunda
   pestaña que "no aparece" en el registro puede ser sólo eso. */
const TAB_LATIDO_MS = 20000;
const TAB_VIDA_MS = 150000;

function tabsLeer() {
  try {
    const o = JSON.parse(localStorage.getItem(TABS_KEY));
    return (o && typeof o === "object" && !Array.isArray(o)) ? o : {};
  } catch (e) { return {}; }
}
function tabsVivas(o) {
  const ahora = Date.now();
  return Object.keys(o || {}).filter(k => ahora - Number(o[k]) <= TAB_VIDA_MS);
}
/* Redibujar desde un temporizador es peligroso: render() reconstruye todo el DOM y el cursor
   se pierde. Si el jefe está tipeando en las notas del mes o en un prototipo, se espera: el
   número ya quedó en el estado y el cartel aparece en el próximo dibujado. */
function tabsRefrescar(n) {
  if (n === state.tabsAbiertas) return;
  state.tabsAbiertas = n;
  const act = document.activeElement;
  if (act && (act.tagName === "TEXTAREA" || act.tagName === "INPUT" || act.isContentEditable)) return;
  render();
}
function tabsLatir() {
  if (state.compartido) return;
  try {
    const o = tabsLeer();
    Object.keys(o).forEach(k => { if (Date.now() - Number(o[k]) > TAB_VIDA_MS) delete o[k]; });
    o[TAB_ID] = Date.now();
    localStorage.setItem(TABS_KEY, JSON.stringify(o));
    tabsRefrescar(Object.keys(o).length);
  } catch (e) {}
}
function tabsSalir() {
  try {
    const o = tabsLeer();
    delete o[TAB_ID];
    localStorage.setItem(TABS_KEY, JSON.stringify(o));
  } catch (e) {}
}

// Vuelve a leer el mes del disco, descartando lo que haya en memoria.
function recargarMesDesdeDisco() {
  state.pisadoPorOtraPestana = null;
  const clave = `${state.anio}-${state.mes}`;
  delete state.historialMeses[clave];
  const r = abrirMes(state.anio, state.mes);
  avisarApertura(state.anio, state.mes, r);
  if (r.estado === "ok") {
    state.calendario = r.cal;
    state.historialMeses[clave] = r.cal;
  } else if (r.estado === "vacio") {
    state.calendario = generarMesVacio(state.anio, state.mes);
  }
  resolverBorradorAlAbrir();
  /* "Recargar el mes" quiere decir "mostrame lo que hay AHORA", y si hay borrador, lo que hay
     ahora ES el borrador: es lo último que escribió la otra pestaña. Dejar lo confirmado con un
     cartel al lado mostraría un mes que no es el de ninguna de las dos pestañas. */
  if (state.borradorPendiente) {
    const b = borradorLeer(state.anio, state.mes);
    if (b && calEsDelMes(b, state.anio, state.mes)) {
      state.calendario = b;
      state.historialMeses[clave] = b;
      state.borradorPendiente = null;
      state.borradorEnUso = true;
    }
  }
  protoLimpiarRevision();
  protoLimpiarModos();
  render();
}
function ignorarOtraPestana() { state.pisadoPorOtraPestana = null; render(); }

function initSincroPestanas() {
  if (state.compartido) return;
  try {
    window.addEventListener("storage", ev => {
      if (!ev || !ev.key) return;
      if (ev.key === TABS_KEY) { tabsRefrescar(tabsVivas(tabsLeer()).length); return; }
      // ¿Tocaron EL MES que tengo en pantalla?
      const mias = [calKey(state.anio, state.mes), borradorKey(state.anio, state.mes), bloqKey(state.anio, state.mes)];
      if (mias.indexOf(ev.key) < 0) return;
      state.pisadoPorOtraPestana = { ts: Date.now(), confirmado: ev.key === calKey(state.anio, state.mes) };
      const act = document.activeElement;
      if (act && (act.tagName === "TEXTAREA" || act.tagName === "INPUT" || act.isContentEditable)) return;
      render();
    });
    window.addEventListener("beforeunload", tabsSalir);
    // Una pestaña congelada no late; al volver a ella sí, y es justo cuando puede pisar el mes.
    window.addEventListener("focus", tabsLatir);
    document.addEventListener("visibilitychange", () => { if (!document.hidden) tabsLatir(); });
  } catch (e) {}
  tabsLatir();
  try { setInterval(tabsLatir, TAB_LATIDO_MS); } catch (e) {}
}

function renderAvisoPestanas() {
  if (state.compartido || !state.jefe) return "";
  let html = "";
  if (Number(state.tabsAbiertas) > 1) {

      <button class="btn btn-secondary btn-sm" onclick="abrirAyuda('pestanas')" title="¿Por qué?">i</button>

  }
  return html;
}

function guardarPlantilla() {
  const tpl = {};
  Object.keys(state.calendario || {}).forEach(f => {
    const d = state.calendario[f];
    if (d.asignaciones && d.asignaciones.length) {
      tpl[dnum(f)] = d.asignaciones.map(a => {
        const o = { medicoId: a.medicoId, rol: a.rol };   // roles y horarios, no fechas
        if (a.horario) o.horario = a.horario;
        return o;
      });
    }
  });
  if (!Object.keys(tpl).length) { alert("El mes actual no tiene guardias para guardar como plantilla."); return; }
  try { localStorage.setItem("guardias_plantilla", JSON.stringify(tpl)); } catch(e) {}
  alert("Plantilla guardada (" + Object.keys(tpl).length + " días con guardias).");
}
function aplicarPlantilla() {
  if (!exigirMesAbierto("aplicar una plantilla")) return;
  // Escribe días construidos con state.anio/state.mes dentro de state.calendario: si el
  // calendario en memoria es de otro mes, mezcla dos meses en el mismo objeto.
  if (!mesEnMemoriaOk("Aplicar plantilla")) return;
  let tpl; try { tpl = JSON.parse(localStorage.getItem("guardias_plantilla")); } catch(e) {}
  if (!tpl || !Object.keys(tpl).length) { alert("No hay ninguna plantilla guardada todavía."); return; }
  const tieneDatos = Object.values(state.calendario || {}).some(d => d.asignaciones && d.asignaciones.length);
  if (tieneDatos && !confirm("Este mes ya tiene guardias cargadas. ¿Aplicar la plantilla igual? (sobrescribe los días incluidos en la plantilla)")) return;
  if (!snapAntesDe("antes de aplicar la plantilla")) return;
  const total = new Date(state.anio, state.mes + 1, 0).getDate();
  let aplicados = 0;
  Object.keys(tpl).forEach(dn => {
    const d = parseInt(dn, 10);
    if (d < 1 || d > total) return;
    const f = `${state.anio}-${String(state.mes + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
    if (!state.calendario[f]) state.calendario[f] = { asignaciones: [], notas: "" };
    state.calendario[f].asignaciones = tpl[dn].map((a, i) => ({ ...a, id: Date.now() + i }));
    aplicados++;
  });
  guardarEstado();
  render();
  alert("Plantilla aplicada a " + aplicados + " día(s).");
}

// ─── PROTOTIPOS DE GUARDIA ───────────────────────────────────
// Tres capas de plantilla con especificidad creciente:
//   A (dow)  — un patrón por día de semana. Base, la menos específica.
//   B (sem)  — ajustes de una semana puntual del mes.
//   C (mes)  — el mes entero armado a mano. Gana sobre todo.
// Cada celda guarda el TEXTO tal como lo escribió el jefe, no el resultado de
// interpretarlo: así al reabrir el modal ve lo que tipeó y no una traducción. La
// interpretación ocurre recién al aplicar, que es también donde se informa qué no se
// pudo resolver.
const PROTO_KEY = "guardias_prototipos";
const PROTO_SEMANAS = 5;   // filas de las pestañas B y C

function protoVacio() { return { v: 1, dow: {}, sem: {}, mes: {} }; }
function protoCargar() {
  try {
    const raw = localStorage.getItem(PROTO_KEY);
    if (!raw) return protoVacio();
    const o = JSON.parse(raw);
    if (!o || typeof o !== "object") return protoVacio();
    return { v: 1, dow: o.dow || {}, sem: o.sem || {}, mes: o.mes || {} };
  } catch (e) { return protoVacio(); }
}
function protoGuardar(p) {
  if (state.compartido) return false;
  try { localStorage.setItem(PROTO_KEY, JSON.stringify(p)); return true; }
  catch (e) { alert("No se pudo guardar el prototipo: el almacenamiento del navegador está lleno."); return false; }
}
// ¿Hay algo escrito en alguna de las tres capas?
function protoTieneAlgo(p) {
  p = p || protoCargar();
  const hay = o => Object.keys(o || {}).some(k => {
    const v = o[k];
    if (typeof v === "string") return v.trim() !== "";
    return Object.keys(v || {}).some(k2 => String(v[k2] || "").trim() !== "");
  });
  return hay(p.dow) || hay(p.sem) || hay(p.mes);
}

// Normaliza para comparar: sin acentos, sin puntos, minúsculas.
function protoNorm(s) {
  return String(s == null ? "" : s).normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/[.\-_]/g, " ").replace(/\s+/g, " ").trim().toLowerCase();
}
// ─── PROTOTIPOS: ALIAS APRENDIDOS ────────────────────────────
/* Cada vez que el jefe confirma a quién se refería un texto que la app no supo resolver,
   la elección se guarda acá y la próxima vez se reconoce sola. Es la diferencia entre una
   ayuda que aprende y una que vuelve a preguntar lo mismo todos los meses. */
const ALIAS_KEY = "guardias_alias";
function aliasCargar() {
  try {
    const o = JSON.parse(localStorage.getItem(ALIAS_KEY));
    return (o && typeof o === "object") ? o : {};
  } catch (e) { return {}; }
}
function aliasSet(txt, medicoId) {
  const k = protoNorm(txt);
  if (!k || !Number(medicoId)) return false;
  if (state.compartido) return false;
  try {
    const o = aliasCargar();
    o[k] = Number(medicoId);
    localStorage.setItem(ALIAS_KEY, JSON.stringify(o));
    return true;
  } catch (e) { return false; }
}
function aliasBorrar(k) {
  try { const o = aliasCargar(); delete o[protoNorm(k)]; localStorage.setItem(ALIAS_KEY, JSON.stringify(o)); } catch (e) {}
}

// Forma del nombre sin iniciales: "S. Dos Santos" y "Dos Santos" se vuelven lo mismo.
// Las letras sueltas son iniciales, no apellidos.
function protoSinIniciales(s) {
  return protoNorm(s).split(" ").filter(w => w.length > 1).join(" ");
}
// Distancia de edición, para tolerar un error de tipeo (no para adivinar apellidos).
function protoDistancia(a, b) {
  a = String(a); b = String(b);
  if (a === b) return 0;
  if (!a.length || !b.length) return Math.max(a.length, b.length);
  let prev = [];
  for (let j = 0; j <= b.length; j++) prev[j] = j;
  for (let i = 1; i <= a.length; i++) {
    const fila = [i];
    for (let j = 1; j <= b.length; j++) {
      fila[j] = Math.min(prev[j] + 1, fila[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    }
    prev = fila;
  }
  return prev[b.length];
}

/* Dos nombres pegados sin salto de línea ("TrivelDos Santos"). Se corta donde una
   minúscula pega con una mayúscula y SÓLO se acepta el corte si las dos mitades resuelven
   con certeza: cortar por la forma de las letras y después adivinar sería poner a dos
   personas en guardias que no son suyas. */
function protoPartirPegado(txt) {
  const s = String(txt || "");
  for (let i = 1; i < s.length; i++) {
    const ant = s[i - 1], act = s[i];
    if (!/[a-záéíóúñ]/.test(ant) || !/[A-ZÁÉÍÓÚÑ]/.test(act)) continue;
    const a = s.slice(0, i).trim(), b = s.slice(i).trim();
    if (!a || !b) continue;
    const ra = protoResolver(a, true), rb = protoResolver(b, true);
    if (ra.medico && rb.medico) return [a, b];
  }
  return null;
}

/* Resuelve un texto a un médico de la lista. Devuelve {medico} | {ambiguo:[...]} | {no:true}.
   El orden importa: sigla exacta primero, después nombre exacto, y recién ahí la búsqueda
   parcial. Sin ese orden, escribir una sigla que además es parte de un apellido daría el
   médico equivocado sin avisar. */
function protoResolver(txt, soloCierto) {
  const t = protoNorm(txt);
  if (!t) return { no: true };
  // 0. Lo que el jefe ya confirmó una vez vale como certeza.
  const al = aliasCargar()[t];
  if (al) { const m = getMedico(al); if (m && Number(al) !== 0) return { medico: m, alias: true }; }
  let c = medicos.filter(m => protoNorm(m.sigla) === t);
  if (c.length === 1) return { medico: c[0] };
  c = medicos.filter(m => protoNorm(m.nombre) === t);
  if (c.length === 1) return { medico: c[0] };
  /* Tanto la coincidencia por palabra suelta como la parcial exigen 3 caracteres. Con menos es adivinar: una "A" suelta
     —un tipeo a medias, una viñeta que quedó— resolvía a A. Cuña y lo metía en una
     guardia que no es suya, y eso no se descubre hasta que alguien no aparece. Las
     coincidencias exactas de arriba sí admiten siglas cortas. */
  if (t.length >= 3) {
    c = medicos.filter(m => protoNorm(m.nombre).split(" ").some(w => w === t));
    if (c.length === 1) return { medico: c[0] };
    c = medicos.filter(m => protoNorm(m.nombre).indexOf(t) >= 0);
    if (c.length === 1) return { medico: c[0] };
    if (c.length > 1) return { ambiguo: c };
  }
  if (soloCierto) return { no: true };

  /* De acá para abajo es reconocimiento APROXIMADO: no asigna, propone. Ignora tildes,
     mayúsculas, puntos e iniciales, y tolera un error de tipeo. Lo que sale de acá entra
     igual como turno pendiente y espera que el jefe lo confirme en el aviso: adivinar
     entre dos apellidos parecidos pone a alguien en una guardia que no es suya, y eso no
     se ve hasta que ese día no aparece nadie. */
  const ti = protoSinIniciales(txt);
  if (ti.length >= 3) {
    let ap = medicos.filter(m => protoSinIniciales(m.nombre) === ti);
    if (ap.length === 1) return { propuesta: ap[0], motivo: "por el apellido, sin iniciales" };
    if (ap.length > 1) return { ambiguo: ap };
    ap = medicos.filter(m => {
      const n = protoSinIniciales(m.nombre);
      return n.indexOf(ti) >= 0 || ti.indexOf(n) >= 0;
    });
    if (ap.length === 1) return { propuesta: ap[0], motivo: "por parte del apellido" };
    if (ap.length > 1) return { ambiguo: ap };
  }
  if (ti.length >= 4) {
    const tope = ti.length <= 6 ? 1 : 2;   // un error de tipeo, dos en nombres largos
    const cerca = medicos.map(m => ({ m: m, d: protoDistancia(ti, protoSinIniciales(m.nombre)) }))
      .filter(x => x.d <= tope).sort((a, b) => a.d - b.d);
    if (cerca.length === 1) return { propuesta: cerca[0].m, motivo: "parecido a lo escrito" };
    if (cerca.length > 1 && cerca[0].d < cerca[1].d) return { propuesta: cerca[0].m, motivo: "parecido a lo escrito" };
    if (cerca.length > 1) return { ambiguo: cerca.map(x => x.m) };
  }
  return { no: true };
}

/* Interpreta una celda. Una entrada por línea o separadas por coma / punto y coma.
   Cada entrada: <médico> [rol] [horario].  Ej: "QUI", "Rodriguez N12", "Cuña D12 08-14hs".
   Sin rol explícito, el turno sale de la plantilla de cobertura configurada para ese día
   —el primer nombre toma el primer turno del día, el segundo el segundo— porque eso es lo
   que el jefe quiere decir cuando escribe tres apellidos en un lunes. Si no hay config o
   sobran nombres, el resto cae en D12.
   Lo que no se puede resolver NO se descarta: entra como turno pendiente conservando el
   texto original, que es un estado que la app ya sabe mostrar. */
function protoParseCelda(txt, dowLun) {
  const partes = String(txt || "").split(/[\n,;]+/).map(x => x.trim()).filter(Boolean);
  // Turnos que la configuración pide para ese día de semana, expandidos por `requeridos`.
  const cfgT = ((state.config || {}).turnos || {})[dowLun] || [];
  const esperados = [];
  cfgT.forEach(t => { for (let i = 0; i < Math.max(1, Number(t.requeridos) || 1); i++) esperados.push(t); });

  const salida = [];
  partes.forEach(entrada => {
    let resto = entrada, rol = null, horario = null;
    /* Se consumen los modificadores del final EN BUCLE, en cualquier orden. Con un paso
       fijo horario→rol, escribir "E. García 08-14hs A6" dejaba resto="E. García 08-14hs"
       y el médico salía como «sin coincidencia» — un motivo que además miente, porque el
       apellido estaba bien escrito y la persona existe. */
    for (let pasada = 0; pasada < 4; pasada++) {
      const mh = resto.match(/(\d{1,2}\s*(?::\d{2})?\s*[-–a]\s*\d{1,2}\s*(?::\d{2})?\s*(?:hs|h)?)\s*$/i);
      if (mh && !horario && resto.slice(0, mh.index).trim()) {
        horario = mh[1].replace(/\s+/g, ""); resto = resto.slice(0, mh.index).trim(); continue;
      }
      const mr = resto.match(/([A-Za-zÁÉÍÓÚÑáéíóúñ0-9]+)\s*$/);
      if (mr && !rol) {
        const cand = mr[1].toUpperCase();
        if (ROLES_BASE.some(r => r.id === cand) && resto.slice(0, mr.index).trim()) {
          rol = cand; resto = resto.slice(0, mr.index).trim(); continue;
        }
      }
      break;
    }
    /* Dos apellidos pegados sin salto de línea ("TrivelDos Santos") son DOS médicos y
       ocupan dos turnos del día, no uno. Sólo se parte si las dos mitades resuelven con
       certeza; si no, la entrada sigue su camino entera. */
    const pegado = protoPartirPegado(resto);
    const nombres = pegado || [resto];
    nombres.forEach((nom, k) => {
      const i = salida.length;
      let rolK = rol, horarioK = horario;
      if (!rolK || k > 0) {
        const e = esperados[i];
        if (!rolK) { rolK = e ? e.rol : "D12"; if (!horarioK && e && e.horario) horarioK = e.horario; }
      }
      /* El horario se guarda SÓLO si difiere del rótulo del rol. La plantilla de cobertura
         suele traer justamente ese rótulo, y grabarlo como override no cambiaba nada en
         pantalla pero dejaba un horario fijo pegado a cada turno: al cambiarle el rol
         después, seguiría mostrando el horario viejo. Además engorda el link compartido. */
      let h = horarioK;
      if (h && String(h).trim() === String(getRol(rolK).label).trim()) h = null;
      const r = protoResolver(nom);
      if (r.medico) {
        const o = { medicoId: r.medico.id, rol: rolK };
        if (h) o.horario = h;
        if (pegado) o.protoPartido = entrada;
        salida.push(o);
        return;
      }
      /* Ambiguo, propuesta y sin coincidencia terminan igual: pendiente conservando el
         texto. La diferencia la hace el aviso posterior, que ofrece el candidato o la
         lista para elegir. */
      const o = { medicoId: 0, rol: rolK || "D12", txt: nom };
      if (r.propuesta) {
        o.protoPropuesta = r.propuesta.id;
        o.protoMotivo = "¿" + r.propuesta.nombre + "? (" + r.motivo + ")";
      } else if (r.ambiguo) {
        o.protoCandidatos = r.ambiguo.map(m => m.id);
        o.protoMotivo = "ambiguo: " + r.ambiguo.map(m => m.sigla).join(" / ");
      } else {
        o.protoMotivo = "sin coincidencia";
      }
      if (h) o.horario = h;
      if (pegado) o.protoPartido = entrada;
      salida.push(o);
    });
  });
  return salida;
}

// Semana (0-based) que le toca a un día en la grilla del mes, que arranca en lunes.
function protoSemanaDe(anio, mes, d) {
  const primerDia = (new Date(anio, mes, 1).getDay() + 6) % 7;
  return Math.floor((primerDia + d - 1) / 7);
}
function protoTexto(p, capa, semIdx, dowLun) {
  if (capa === "dow") return String((p.dow || {})[dowLun] || "");
  const t = (p[capa] || {})[semIdx];
  return String((t || {})[dowLun] || "");
}

/* Aplica las tres capas al mes en pantalla. Devuelve el desglose para el resumen; no
   toca el DOM ni guarda: eso lo decide el llamador. */
function protoAplicar(p) {
  p = p || protoCargar();
  const anio = state.anio, mes = state.mes;
  const total = new Date(anio, mes + 1, 0).getDate();
  /* anio/mes quedan grabados en el resumen: el banner y el resaltado ámbar viven en
     memoria y sobrevivían al cambio de mes, así que "Revisar conflictos" abría una fecha
     de agosto con el calendario de septiembre en state.calendario. Cargar guardias ahí
     las escribía dentro del objeto del mes equivocado: no se dibujaban nunca, pero sí
     contaban en los badges y en el reporte de horas. */
  const res = { anio, mes, aplicados: [], conflictos: [], pisados: [], sinResolver: [], semanaExtra: [], conAusencia: [], partidos: [] };
  for (let d = 1; d <= total; d++) {
    const f = `${anio}-${String(mes + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
    const dowLun = (new Date(anio, mes, d).getDay() + 6) % 7;
    const semIdx = protoSemanaDe(anio, mes, d);
    const capas = [];
    ["dow", "sem", "mes"].forEach(capa => {
      if (capa !== "dow" && semIdx >= PROTO_SEMANAS) return;
      const txt = protoTexto(p, capa, semIdx, dowLun);
      if (txt.trim()) capas.push({ capa, txt });
    });
    /* Un mes puede tener una sexta fila en la grilla (pasa varias veces al año) y las
       pestañas por semana sólo llegan a la quinta: esos días quedan con la capa por día
       de semana. Se listan en el resumen en vez de dejarlo pasar. */
    /* Se pregunta por CONTENIDO y no por la existencia de las claves: protoCosechar
       escribía las 35 celdas vacías con sólo abrir la pestaña B, así que el aviso salía
       aunque no se hubiera perdido nada. */
    if (semIdx >= PROTO_SEMANAS && protoTieneAlgo({ dow: {}, sem: p.sem, mes: p.mes })) res.semanaExtra.push(d);
    if (!capas.length) continue;
    const gana = capas[capas.length - 1];
    if (capas.length > 1) res.conflictos.push({ dia: d, fecha: f, gana: gana.capa, capas: capas.map(c => c.capa) });
    const asigs = protoParseCelda(gana.txt, dowLun);
    if (!asigs.length) continue;
    if (!state.calendario[f]) state.calendario[f] = { asignaciones: [], notas: "" };
    /* Sólo cuenta como pisado si había guardias REALES. generarMesDesdeConfig pre-llena
       todos los días con el esqueleto de turnos ⚠️ Pendiente, así que con la condición de
       cardinalidad el aviso "se reemplazaron guardias ya cargadas en 31 días" salía
       siempre en el flujo de "Empezar y aplicar prototipos", sobre un mes recién creado
       en blanco. Un aviso destructivo que grita en falso se aprende a ignorar. */
    if ((state.calendario[f].asignaciones || []).some(a => !esPendiente(a))) res.pisados.push(d);
    state.calendario[f].asignaciones = asigs.map((a, i) => ({ ...a, id: Date.now() + d * 100 + i }));
    /* De cada caso sin resolver se guarda DÓNDE quedó (fecha + posición dentro del día),
       además del texto: es lo que permite que el aviso posterior lo complete sin que el
       jefe tenga que ir a buscar el día a mano. */
    asigs.forEach((a, i) => {
      if (!a.txt) return;
      res.sinResolver.push({
        dia: d, fecha: f, idx: i, txt: a.txt, motivo: a.protoMotivo || "sin coincidencia",
        propuesta: a.protoPropuesta || null, candidatos: a.protoCandidatos || null,
      });
    });
    // Un aviso por día y por texto: las dos mitades de un pegado son el mismo hallazgo.
    const yaAvisado = {};
    asigs.forEach(a => {
      if (!a.protoPartido || yaAvisado[a.protoPartido]) return;
      yaAvisado[a.protoPartido] = true;
      res.partidos.push({ dia: d, txt: a.protoPartido });
    });
    /* Asignar al médico que está de licencia APAGA la alarma: diaAusSinCubrir sólo mira
       que haya alguien puesto, no quién, así que el borde rojo del día y el badge de
       Novedades desaparecen y queda un turno que nadie va a cubrir. */
    try {
      const aus = (typeof ausDeDia === "function") ? ausDeDia(f) : [];
      asigs.forEach(a => {
        const x = aus.find(z => Number(z.medicoId) === Number(a.medicoId) && Number(a.medicoId) !== 0);
        if (x) { const m = getMedico(a.medicoId); res.conAusencia.push({ dia: d, medico: m ? m.sigla : "?", tipo: x.tipo || "ausencia" }); }
      });
    } catch (e) {}
    /* El día se REESCRIBE entero, que es la operación más destructiva de la app, y era
       la única que no dejaba rastro: el historial del día seguía mostrando "➕ Fulano
       agregado" de una versión que ya no existe. */
    try { if (typeof histLog === "function") histLog(f, "📐 Día reescrito por prototipo (" + gana.capa + "): " + nombresDeAsigs(asigs), ""); } catch (e) {}
    res.aplicados.push(d);
  }
  return res;
}

// ─── PROTOTIPOS: MODAL Y ACCIONES ────────────────────────────
/* El render reescribe el DOM entero, así que lo que el jefe está tipeando vive sólo en
   los <textarea> hasta que alguien lo COSECHA. Toda acción que provoque un render
   —cambiar de pestaña, guardar, aplicar, cerrar— tiene que llamar primero a esto, o el
   trabajo de la pestaña visible se pierde sin dejar rastro. */
function protoCosechar() {
  const p = state.modalProto && state.modalProto.datos ? state.modalProto.datos : protoCargar();
  document.querySelectorAll("#modal-proto textarea[data-proto]").forEach(ta => {
    const [capa, semIdx, dowLun] = ta.getAttribute("data-proto").split("|");
    const v = ta.value;
    // Una celda vacía se BORRA en vez de guardarse como "": si no, abrir una pestaña y
    // cerrarla dejaba el objeto lleno de cadenas vacías que después se leen como "hay
    // prototipo por semana".
    if (capa === "dow") { if (v.trim()) p.dow[dowLun] = v; else delete p.dow[dowLun]; }
    else {
      if (!p[capa]) p[capa] = {};
      if (!p[capa][semIdx]) p[capa][semIdx] = {};
      if (v.trim()) p[capa][semIdx][dowLun] = v; else delete p[capa][semIdx][dowLun];
      if (!Object.keys(p[capa][semIdx]).length) delete p[capa][semIdx];
    }
  });
  if (state.modalProto) state.modalProto.datos = p;
  return p;
}
function abrirModalProto() {
  state.modalProto = { tab: "dow", datos: protoCargar(), aviso: "", vaciar: false };
  render();
}
// La casilla se cosecha junto con los textos: cambiar de pestaña vuelve a dibujar el modal.
function protoToggleVaciar() {
  if (!state.modalProto) return;
  state.modalProto.vaciar = !state.modalProto.vaciar;
  render();
}
function cerrarModalProto() {
  if (state.modalProto) { const p = protoCosechar(); protoGuardar(p); }
  state.modalProto = null;
  render();
}
function protoTab(t) {
  const p = protoCosechar();
  state.modalProto.tab = t; state.modalProto.datos = p;
  render();
}
function protoGuardarYAvisar() {
  const p = protoCosechar();
  if (protoGuardar(p)) { state.modalProto.aviso = "💾 Prototipo guardado."; render(); }
}
function protoLimpiarCapa() {
  const t = state.modalProto.tab;
  const nom = t === "dow" ? "por día de semana" : (t === "sem" ? "por semana" : "de mes completo");
  if (!confirm("¿Borrar todo el prototipo " + nom + "? No se puede deshacer.")) return;
  const p = protoCosechar();
  if (t === "dow") p.dow = {}; else p[t] = {};
  state.modalProto.datos = p;
  protoGuardar(p);
  state.modalProto.aviso = "🗑️ Prototipo " + nom + " vaciado.";
  render();
}

/* Aplica y arma el resumen. Pide confirmación cuando va a pisar días que ya tienen
   guardias: eso es lo único irreversible de toda la operación. */
function protoAplicarAlMes() {
  const p = protoCosechar();
  // Si ni el prototipo entró en el almacenamiento, el mes tampoco va a entrar: se corta
  // acá en vez de reescribir 31 días que sólo van a existir en memoria.
  if (!protoGuardar(p)) return;
  if (!protoTieneAlgo(p)) { alert("No hay nada escrito en ninguna de las tres pestañas."); return; }
  // Reescribe hasta 31 días a partir de state.anio/state.mes: si el calendario en memoria es
  // de otro mes, el prototipo se escribiría dentro del objeto equivocado.
  if (!exigirMesAbierto("aplicar prototipos")) return;
  if (!mesEnMemoriaOk("Aplicar prototipos")) return;
  if (!snapAntesDe("antes de aplicar prototipos")) return;
  // Se simula primero sobre una copia para poder avisar ANTES de tocar el calendario.
  const respaldo = JSON.parse(JSON.stringify(state.calendario || {}));
  /* Vaciar es lo único que destruye datos que el prototipo después NO vuelve a escribir,
     así que la confirmación dice cuántos días se van y hay que aceptarla antes de tocar
     nada. Si el jefe dice que no, no se vacía y tampoco se aplica: cancelar es cancelar. */
  const vaciar = !!(state.modalProto && state.modalProto.vaciar);
  if (vaciar) {
    const conGuardias = Object.keys(state.calendario || {}).filter(f => ((state.calendario[f] || {}).asignaciones || []).some(a => !esPendiente(a))).length;
    const ok = confirm("⚠️ VACIAR " + MESES[state.mes].toUpperCase() + " " + state.anio + "\n\n" +
      "Se van a BORRAR las guardias de " + conGuardias + " día(s) y recién después se aplica el prototipo.\n" +
      "Los días que el prototipo no cubra quedan vacíos. No se puede deshacer.\n\n¿Vaciar y aplicar?");
    if (!ok) return;
    state.calendario = generarMesVacio(state.anio, state.mes);
    state.historialMeses[`${state.anio}-${state.mes}`] = state.calendario;
  }
  const prev = protoAplicar(p);
  if (prev.pisados.length && !vaciar) {
    const ok = confirm("Se van a reemplazar las guardias de " + prev.pisados.length + " día(s) que ya tenían cargado: " +
      prev.pisados.join(", ") + ".\n\n¿Aplicar igual?");
    if (!ok) {
      state.calendario = respaldo;
      // historialMeses apunta al MISMO objeto que se mutó: sin esto quedaba con los
      // prototipos que el jefe acaba de rechazar.
      state.historialMeses[`${state.anio}-${state.mes}`] = respaldo;
      render(); return;
    }
  }
  /* Los modos "copiar día" e "intercambiar" apuntan a días que el prototipo acaba de
     reescribir: el cartel seguiría diciendo "Día 5 copiado" y al pegar saldría el
     contenido nuevo, no el que se copió. */
  protoLimpiarModos();
  state.protoResumen = prev;
  state.protoConflictos = prev.conflictos.map(c => c.fecha);
  state.modalProto = null;
  if (!guardarEstado()) { state.protoResumen = null; state.protoConflictos = []; render(); return; }
  render();
}
function protoLimpiarModos() {
  state.copiarDiaOrigen = null; state.swapDiaOrigen = null;
  state.swapMedicoOrigen = null; state.swapMedicoDestino = null;
  state.medicoSelModal = new Set();
}
/* Tercera salida del modal de cambio de mes: arranca el mes en blanco y le aplica los
   prototipos. Reusa aplicarCopia(false) para no duplicar la construcción del mes vacío
   —que además pre-llena los turnos de la config como ⚠️ Pendiente— y encima corre las
   tres capas. Sólo aparece si hay algo escrito en algún prototipo. */
function aplicarCopiaProto() {
  aplicarCopia(false);
  if (!mesEnMemoriaOk("Aplicar prototipos")) return;
  const p = protoCargar();
  const r = protoAplicar(p);
  state.protoResumen = r;
  state.protoConflictos = r.conflictos.map(c => c.fecha);
  guardarEstado();
  render();
}
function protoIrAConflicto() {
  const f = (state.protoConflictos || [])[0];
  if (!f) return;
  /* Por abrirModalDia y no escribiendo state.modalDia a mano: esa función resetea la
     selección de médicos (que si no se hereda de la apertura anterior) y respeta el modo
     solo lectura. Escrito a mano, alguien sin sesión de jefe llegaba al modal EDITABLE
     desde el banner, que sigue en pantalla después de cerrar sesión. */
  if (state.jefe) abrirModalDia(f); else abrirDiaVista(f);
}
/* Completa a mano uno de los casos que el prototipo no supo resolver y se lo aprende:
   la próxima vez que aparezca ese mismo texto, se reconoce solo. */
function protoAsignarCaso(i, medicoId) {
  const r = state.protoResumen;
  if (!r || !state.jefe) return;
  const c = r.sinResolver[i];
  const m = getMedico(medicoId);
  if (!c || !m || Number(medicoId) === 0) return;
  if (r.anio !== state.anio || r.mes !== state.mes) return;   // el jefe navegó de mes
  const dia = (state.calendario[c.fecha] || {}).asignaciones || [];
  /* La posición puede haberse movido si el día se editó a mano después de aplicar: se
     verifica el texto y, si no coincide, se busca el pendiente que lo tenga. */
  let a = dia[c.idx];
  if (!a || a.txt !== c.txt) a = dia.find(x => x && x.txt === c.txt && esPendiente(x));
  if (!a) { r.sinResolver.splice(i, 1); render(); return; }
  const clave = protoNorm(c.txt);
  aliasSet(c.txt, m.id);
  /* El mismo texto suele repetirse en todos los lunes del mes. Confirmarlo una vez lo
     resuelve en todo el período: si no, el jefe contesta cinco veces la misma pregunta y
     la quinta la contesta sin leerla. */
  let n = 0;
  for (let k = r.sinResolver.length - 1; k >= 0; k--) {
    const c2 = r.sinResolver[k];
    if (k !== i && protoNorm(c2.txt) !== clave) continue;
    const asigs2 = (state.calendario[c2.fecha] || {}).asignaciones || [];
    let a2 = asigs2[c2.idx];
    if (!a2 || a2.txt !== c2.txt) a2 = asigs2.find(x => x && x.txt === c2.txt && esPendiente(x));
    if (a2) {
      a2.medicoId = m.id;
      delete a2.txt; delete a2.protoMotivo; delete a2.protoPropuesta; delete a2.protoCandidatos;
      try { histLog(c2.fecha, "✍️ " + m.nombre + " confirmado desde el prototipo («" + c2.txt + "»)", ""); } catch (e) {}
      n++;
    }
    r.sinResolver.splice(k, 1);
  }
  r.avisoCasos = n > 1
    ? ("✓ " + m.nombre + " quedó puesto en " + n + " días (todos los que decían «" + c.txt + "»).")
    : ("✓ " + m.nombre + " quedó puesto en el día " + c.dia + ".");
  if (!guardarEstado()) return;
  render();
}

// ─── GESTOR DE AUSENCIAS Y SOLICITUDES ───────────────────────
const TIPOS_AUS = {
  licencia:   { label: "Licencia",         emoji: "🔴", color: "#b91c1c", sinCubrir: true },
  solicitud:  { label: "Solicitud de día", emoji: "🟡", color: "#b45309", sinCubrir: false },
  enfermedad: { label: "Enfermedad",       emoji: "🟠", color: "#c2410c", sinCubrir: true },
  otro:       { label: "Otro",             emoji: "⚪", color: "#6b7280", sinCubrir: false },
};
function tipoAus(t) { return TIPOS_AUS[t] || TIPOS_AUS.otro; }
function ausKey(anio, mes) { return `guardias_ausencias_${anio}_${mes + 1}`; }
function ausGetMes(anio, mes) {
  if (state.compartido) return [];   // el link no comparte ausencias
  try { const a = JSON.parse(localStorage.getItem(ausKey(anio, mes))); return Array.isArray(a) ? a : []; }
  catch (e) { return []; }
}
function ausSaveMes(anio, mes, arr) { try { localStorage.setItem(ausKey(anio, mes), JSON.stringify(arr)); } catch (e) {} }
function ausGet() { return ausGetMes(state.anio, state.mes); }
function ausSave(arr) { ausSaveMes(state.anio, state.mes, arr); }
/* Las ausencias de un mes son parte del mes: con el candado cerrado no se tocan. Se comprueba
   ANTES de escribir ningún segmento, porque una licencia que cruza de mes se guarda mes por mes
   y dejar la mitad escrita es peor que no escribir nada. */
function exigirMesesAbiertos(segs, accion) {
  const cerrados = (segs || []).filter(x => mesCerrado(x.anio, x.mes)).map(x => etiquetaMes(x.anio, x.mes));
  if (!cerrados.length) return true;
  alert("🔒 " + cerrados.join(" y ") + (cerrados.length > 1 ? " están cerrados" : " está cerrado") +
    ", así que " + accion + " no se puede hacer.\n\nAbrí el candado de " +
    (cerrados.length > 1 ? "esos meses" : "ese mes") + " y volvé a intentarlo.");
  return false;
}

// ─── AUSENCIAS QUE CRUZAN MESES ──────────────────────────────
// Las ausencias se guardan por mes (una clave de localStorage por mes), así que un rango
// que cruza meses se parte en SEGMENTOS: uno por cada mes que toca. Todos los segmentos
// comparten `grupoId` y guardan el rango completo (fDesde/fHasta) para poder mostrarlo entero.
const MESES_CORTO = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
function isoADMY(iso) { const p = String(iso || "").split("-").map(Number); return { anio: p[0], mes: p[1] - 1, dia: p[2] }; }
function fmtFechaCorta(iso) { const f = isoADMY(iso); return (f.dia && MESES_CORTO[f.mes]) ? `${f.dia} ${MESES_CORTO[f.mes]}` : ""; }
function fmtRangoAus(a) {
  if (a.fDesde && a.fHasta) {
    return a.fDesde === a.fHasta ? fmtFechaCorta(a.fDesde) : `${fmtFechaCorta(a.fDesde)} — ${fmtFechaCorta(a.fHasta)}`;
  }
  return a.desde === a.hasta ? `día ${a.desde}` : `días ${a.desde}–${a.hasta}`;   // formato viejo
}
// Parte un rango de fechas completas en {anio, mes, desde, hasta} por cada mes involucrado.
function segmentosPorMes(fDesde, fHasta) {
  const a = isoADMY(fDesde), b = isoADMY(fHasta);
  const segs = [];
  let y = a.anio, m = a.mes;
  while (y < b.anio || (y === b.anio && m <= b.mes)) {
    const totalDias = new Date(y, m + 1, 0).getDate();
    segs.push({
      anio: y, mes: m,
      desde: (y === a.anio && m === a.mes) ? a.dia : 1,
      hasta: (y === b.anio && m === b.mes) ? b.dia : totalDias,
    });
    m++; if (m > 11) { m = 0; y++; }
    if (segs.length > 36) break;   // tope de seguridad
  }
  return segs;
}
function fechaDeDia(d) { return `${state.anio}-${String(state.mes + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`; }
function ausDeDia(fecha) { const d = dnum(fecha); return ausGet().filter(a => d >= a.desde && d <= a.hasta); }
// Ausencias RELEVANTES para la celda del calendario: solo las de médicos que además tienen
// una asignación ese día. Una licencia de 15 días no debe marcar los 15 días del calendario:
// solo aquellos en los que esa persona realmente tenía guardia.
function ausDeDiaConGuardia(fecha) {
  const asigs = diaData(fecha).asignaciones || [];
  return ausDeDia(fecha).filter(a => asigs.some(x => Number(x.medicoId) === Number(a.medicoId)));
}
// Días de ausencia (licencia/enfermedad/solicitud) sin ningún médico asignado => pendientes de cubrir.
function pendientesMes() {
  const dias = new Set();
  ausGet().forEach(a => {
    for (let d = a.desde; d <= a.hasta; d++) {
      const f = fechaDeDia(d);
      if (!asigsReales(f).length) dias.add(d);
    }
  });
  return dias.size;
}
function diaAusSinCubrir(fecha) {
  const aus = ausDeDia(fecha);
  if (!aus.length) return false;
  const cubierto = asigsReales(fecha).length > 0;
  return !cubierto;   // hay ausencia y no hay médico asignado (reemplazo)
}
function abrirAusencias() { state.ausPanel = true; render(); }
function cerrarAusencias() { state.ausPanel = false; render(); }
function abrirAusDetalle(fecha, ev) { if (ev) ev.stopPropagation(); state.ausDetalleFecha = fecha; render(); }
function cerrarAusDetalle() { state.ausDetalleFecha = null; render(); }
function guardarAusencia() {
  const f = state.ausForm;
  const medicoId = Number(f.medicoId);
  if (!medicoId) { alert("Elegí un médico."); return; }
  if (!f.fDesde || !f.fHasta) { alert("Elegí la fecha de inicio y la de fin."); return; }
  if (f.fDesde > f.fHasta) { alert("La fecha de fin no puede ser anterior a la de inicio."); return; }

  const segs = segmentosPorMes(f.fDesde, f.fHasta);
  if (!exigirMesesAbiertos(segs, "registrar la ausencia")) return;
  const grupoId = Date.now();
  const motivo = (f.motivo || "").trim();
  segs.forEach((s, i) => {
    const arr = ausGetMes(s.anio, s.mes);
    arr.push({
      id: grupoId + i, grupoId, medicoId, tipo: f.tipo,
      desde: s.desde, hasta: s.hasta,        // días dentro de ESE mes (lo que usa ausDeDia)
      fDesde: f.fDesde, fHasta: f.fHasta,    // rango completo, para mostrarlo entero
      motivo, ts: grupoId,
    });
    ausSaveMes(s.anio, s.mes, arr);
  });

  state.ausForm = { medicoId: "", tipo: "licencia", fDesde: "", fHasta: "", motivo: "" };
  render();
  if (segs.length > 1) {
    alert(`Ausencia registrada: ${fmtRangoAus({fDesde:f.fDesde, fHasta:f.fHasta})} (${segs.length} meses afectados).`);
  }
}
// Borra la ausencia completa: todos sus segmentos, en todos los meses que toca.
function borrarAusencia(id) {
  const aus = ausGet().find(a => a.id === id);
  if (!aus) return;
  const segsAus = (aus.grupoId && aus.fDesde && aus.fHasta)
    ? segmentosPorMes(aus.fDesde, aus.fHasta)
    : [{ anio: state.anio, mes: state.mes }];
  if (!exigirMesesAbiertos(segsAus, "borrar la ausencia")) return;
  if (aus.grupoId && aus.fDesde && aus.fHasta) {
    segmentosPorMes(aus.fDesde, aus.fHasta).forEach(s => {
      ausSaveMes(s.anio, s.mes, ausGetMes(s.anio, s.mes).filter(x => x.grupoId !== aus.grupoId));
    });
  } else {
    ausSave(ausGet().filter(a => a.id !== id));   // ausencia vieja, de un solo mes
  }
  render();
}

function irHoy() {
  const hoy = new Date();
  const y = hoy.getFullYear(), m = hoy.getMonth();
  const iso = `${y}-${String(m + 1).padStart(2, "0")}-${String(hoy.getDate()).padStart(2, "0")}`;
  /* Esto escribía state.anio/state.mes y renderizaba, sin cargar el mes nuevo ni guardar el
     que dejaba: el mes se dibujaba con el calendario del anterior —ninguna fecha coincide, así
     que salían los 30 días "Sin cubrir"— y el primer guardado lo escribía encima. Era la causa
     de que noviembre 2026 apareciera vacío. Ahora pasa por irAMes, que guarda y carga. */
  if (y === state.anio && m === state.mes) {
    if (state.modoCal === "semana") state.semanaAncla = iso;
    render();
    return;
  }
  irAMes(y, m);
  // Si irAMes no llegó a navegar (mes dañado, o el modal de "generar el mes"), la semana no se
  // mueve: quedaría mostrando una semana de un mes que no está cargado.
  if (state.anio === y && state.mes === m && state.modoCal === "semana") {
    state.semanaAncla = iso;
    render();
  }
}

function prevMes() {
  const na = state.mes === 0 ? state.anio-1 : state.anio;
  const nm = state.mes === 0 ? 11 : state.mes-1;
  irAMes(na, nm);
}

function nextMes() {
  const na = state.mes === 11 ? state.anio+1 : state.anio;
  const nm = state.mes === 11 ? 0 : state.mes+1;
  irAMes(na, nm);
}

// El banner de prototipos y el resaltado ámbar son de UN mes: al navegar dejan de
// aplicar, y si sobreviven "Revisar conflictos" abre una fecha que no pertenece al
// calendario cargado.
function protoLimpiarRevision() { state.protoResumen = null; state.protoConflictos = []; }

function irAMes(anioNuevo, mesNuevo) {
  protoLimpiarRevision();
  /* 1. El mes que se deja. Se guarda SÓLO si el calendario en memoria pertenece a ese mes: si
     no, se descarta en vez de escribirlo. El disco manda, porque lo que hay en memoria en ese
     caso es el calendario de otro mes y guardarlo es exactamente lo que destruía el mes. */
  if (mesCerrado(state.anio, state.mes) || state.mesIlegible === `${state.anio}-${state.mes}`) {
    /* Mes cerrado: no hay nada que guardar —no se pudo editar— y avisarlo en cada navegación
       sería ruido puro. Mes ilegible: lo que hay en pantalla es un mes de mentira y guardarlo
       taparía el texto original; en los dos casos se navega sin escribir. */
    if (!state.mesIlegible) state.historialMeses[`${state.anio}-${state.mes}`] = state.calendario;
  } else if (state.calendario && !calEsDelMes(state.calendario, state.anio, state.mes)) {
    const aj = clavesAjenas(state.calendario, state.anio, state.mes);
    alert("⚠️ " + etiquetaMes(state.anio, state.mes) + " NO se guardó.\n\nEl calendario que había en memoria tiene " +
      detalleAjenas(agruparAjenas(aj)) + ", así que no es el de ese mes. Se descarta y se vuelve a leer del disco: " +
      "no se perdió nada de lo que estaba guardado.");
    delete state.historialMeses[`${state.anio}-${state.mes}`];
  } else {
    state.historialMeses[`${state.anio}-${state.mes}`] = state.calendario;
    if (!guardarEstado()) return;   // almacenamiento lleno o reemplazo rechazado: no se navega
  }

  const clave = `${anioNuevo}-${mesNuevo}`;
  const r = abrirMes(anioNuevo, mesNuevo);
  avisarApertura(anioNuevo, mesNuevo, r);
  if (r.estado === "danado" || r.estado === "error") {
    alert("⚠️ " + etiquetaMes(anioNuevo, mesNuevo) + " está guardado pero no se puede leer (" + r.motivo + ").\n\n" +
      "No se abre y no se escribe nada encima, para no tapar lo que todavía pueda rescatarse de ahí.");
    render();
    return;
  }
  if (r.estado === "ok") {
    state.mesIlegible = null;
    state.calendario = r.cal;
    state.historialMeses[clave] = r.cal;
    state.anio = anioNuevo;
    state.mes = mesNuevo;
    resolverBorradorAlAbrir();
    render();
    return;
  }
  // Vacío: lo que haya en memoria de ese mes y, si no hay nada, el modal para construirlo.
  if (tieneAsigs(state.historialMeses[clave])) {
    state.mesIlegible = null;
    state.calendario = state.historialMeses[clave];
    state.anio = anioNuevo;
    state.mes = mesNuevo;
    resolverBorradorAlAbrir();
    render();
    return;
  }
  /* Un mes que sólo existe como borrador no se vuelve a preguntar: ya lo armaste. Se abre el
     borrador y el cartel avisa que está sin confirmar. */
  const bor = borradorLeer(anioNuevo, mesNuevo);
  if (bor && calEsDelMes(bor, anioNuevo, mesNuevo)) {
    state.mesIlegible = null;
    state.calendario = bor;
    state.historialMeses[clave] = bor;
    state.anio = anioNuevo;
    state.mes = mesNuevo;
    state.borradorEnUso = true;
    state.borradorPendiente = null;
    render();
    return;
  }
  state.modalCopiar = { anioNuevo, mesNuevo, anioOrigen:state.anio, mesOrigen:state.mes };
  render();
}

// Cerrar el modal de cambio de mes sin elegir nada: se queda en el mes que ya estaba en pantalla.
// Ojo: irAMes() NO cambia state.anio/state.mes cuando abre este modal, así que el calendario
// de fondo sigue siendo el de origen y no hay navegación que revertir.
// El caso delicado es venir de "Rehacer mes", que ya borró el mes de localStorage antes de
// preguntar: ahí se vuelve a guardar lo que sigue en memoria para no perder las guardias.
function cancelarCopiaMes() {
  state.modalCopiar = null;
  // Sólo se re-guarda si hay algo que guardar: cancelar en el arranque no tiene que sembrar
  // la clave de un mes en blanco.
  if (tieneAsigs(state.calendario)) {
    state.historialMeses[`${state.anio}-${state.mes}`] = state.calendario;
    guardarEstado();
  }
  render();
}

function aplicarCopia(copiar) {
  const {anioNuevo, mesNuevo, anioOrigen, mesOrigen} = state.modalCopiar;
  const rehacer = !!state.modalCopiar.rehacer;

  // CAMBIO 4: se copia POR DÍA DE SEMANA usando el calendario REAL del mes anterior
  // (no posición a posición, y no el patrón hardcodeado): todos los lunes del mes nuevo
  // quedan como el primer lunes del mes origen, todos los martes como el primer martes, etc.
  const calOrigen = calDelMes(anioOrigen, mesOrigen);   // misma fuente que la vista previa del modal
  const calNuevo = copiar
    ? aplicarPatronDesdeCal(anioNuevo, mesNuevo, calOrigen)
    : generarMesDesdeConfig(anioNuevo, mesNuevo);   // pre-llenado con los turnos de la config, como ⚠️ Pendiente

  /* Rehacer el mes es el único camino que escribe encima de un mes que puede tener guardias
     cargadas, así que la copia se hace acá: cuando ya se eligió con qué reemplazarlo. */
  if (rehacer) {
    const actual = calDelMes(anioNuevo, mesNuevo);
    if (diasConGuardias(actual) && !snapGuardar(anioNuevo, mesNuevo, actual, "antes de rehacer el mes")) {
      if (!confirm("⚠️ No se pudo guardar la copia de seguridad de " + etiquetaMes(anioNuevo, mesNuevo) +
          " (almacenamiento lleno).\n\n¿Rehacer el mes igual? No se va a poder deshacer.")) {
        state.modalCopiar = null; render(); return;
      }
    }
  }

  state.calendario = calNuevo;
  state.historialMeses[`${anioNuevo}-${mesNuevo}`] = calNuevo;
  state.anio = anioNuevo;
  state.mes = mesNuevo;
  state.modalCopiar = null;
  // Rehacer ya preguntó y ya hizo la copia: no se vuelve a preguntar por el reemplazo.
  guardarEstado({ permitirVaciar: rehacer });
  render();
}

// ─── REHACER MES (descarta lo guardado y vuelve a preguntar) ──
// Sirve cuando el mes quedó con datos viejos de una versión anterior de la app:
// como irAMes() carga lo que haya en localStorage, un mes ya guardado nunca vuelve
// a mostrar el modal de "usar el mes anterior como base".
function rehacerMesDesdePatron() {
  const etiqueta = etiquetaMes(state.anio, state.mes);
  if (!exigirMesAbierto("rehacer el mes")) return;
  if (!mesEnMemoriaOk("Rehacer " + etiqueta)) return;
  if (!confirm(`¿Borrar las guardias guardadas de ${etiqueta} y regenerarlo a partir del mes anterior?\n\nEsto descarta los cambios hechos a mano en ${etiqueta}. Las ausencias y el historial no se tocan.\n\nAntes de reemplazarlo se guarda una copia, recuperable desde ≡ → 🕑 Restaurar versión anterior.`)) return;

  // Mes anterior (origen del patrón)
  const anioOrigen = state.mes === 0 ? state.anio - 1 : state.anio;
  const mesOrigen  = state.mes === 0 ? 11 : state.mes - 1;

  /* El mes NO se borra acá. Antes se hacía `removeItem` ANTES de preguntar con qué reemplazarlo:
     si cerrabas la pestaña o recargabas con el modal abierto, el mes ya no existía y no había
     nada que lo reemplazara. Ahora lo reemplaza aplicarCopia(), cuando ya elegiste. */
  state.modalCopiar = { anioNuevo: state.anio, mesNuevo: state.mes, anioOrigen, mesOrigen, rehacer: true };
  render();
}

     todos los cambios (agregar, quitar, horarios, copiar, intercambiar), así que cerrarla es

// ─── CUBRIR UN TURNO PENDIENTE ───────────────────────────────
// Reemplaza el médico fantasma por el médico real, sin tocar rol ni horario del turno.
function cubrirPendiente(fecha, uid, medicoId) {
  const a = asigPorUid(fecha, uid);
  if (!a || !medicoId) return;
  const m = getMedico(medicoId);
  if (!m) return;
  a.medicoId = Number(medicoId);
  histLog(fecha, `✅ Turno pendiente cubierto por ${m.nombre}`, "");
  guardarEstado();
  render();
}
// Cambia el rol/turno de una asignación (se usa para definir el turno de un pendiente).
function cambiarRolAsig(fecha, uid, rol) {
  const a = asigPorUid(fecha, uid);
  if (!a || !rol) return;
  a.rol = rol;
  histLog(fecha, `🕑 Turno pendiente definido como ${getRol(rol).desc}`, "");

}

// Busca una asignación concreta del día por su uid (identidad estable, independiente del orden).
function asigPorUid(fecha, uid) {
  return (diaData(fecha).asignaciones || []).find(a => a.uid === uid) || null;
}

function quitarAsignacion(fecha, uid) {
  const arr = (state.calendario[fecha] && state.calendario[fecha].asignaciones) || [];
  const raw = arr.findIndex(a => a.uid === uid);
  if (raw < 0) return;
  const a = arr[raw];
  const nom = getMedico(a.medicoId) ? getMedico(a.medicoId).nombre : "médico";
  arr.splice(raw, 1);
  histLog(fecha, `➖ ${nom} removido`, "");   // MEJORA 5
  guardarEstado();
  render();
}

// CAMBIO 5: el horario es un override propio de cada asignación (médico + día).

let cancelandoHorario = false;   // evita que el onblur del input guarde cuando se cancela con Escape

  setTimeout(() => { const el = document.getElementById("horario-edit-input"); if (el) { el.focus(); el.select(); } }, 0);

function guardarHorario(fecha, uid, valor) {

  const a = asigPorUid(fecha, uid);
  if (a) {
    const v = String(valor == null ? "" : valor).trim();
    if (v) a.horario = v; else delete a.horario;   // vacío => vuelve al horario del rol
    const nom = getMedico(a.medicoId) ? getMedico(a.medicoId).nombre : "médico";
    histLog(fecha, `🕑 Horario de ${nom} → ${horarioDe(a)}`, "");   // MEJORA 5
  }

}

}

function iniciarCopiarDia(fecha) {
  state.copiarDiaOrigen = fecha;

}
function cancelarCopiarDia() {

}
function clickDia(fecha) {
  if (!state.jefe) { abrirDiaVista(fecha); return; }   // solo lectura: detalle sin edición
  if (state.copiarDiaOrigen) {
    if (fecha === state.copiarDiaOrigen) { cancelarCopiarDia(); return; }  // clic en el origen = cancelar
    copiarDiaDestino(fecha);
    return;
  }
  if (state.swapDiaOrigen) {
    if (fecha === state.swapDiaOrigen) { cancelarSwapDia(); return; }
    swapDiaDestino(fecha);

  }
  if (state.swapMedicoOrigen) {
    if (fecha === state.swapMedicoOrigen.fecha) { cancelarSwapMedicos(); return; }   // clic en el origen = cancelar
    abrirSwapMedicoPicker(fecha);

  }

}
function copiarDiaDestino(destino) {
  const origen = state.copiarDiaOrigen;
  const dOrig = diaData(origen);
  const clon = (dOrig.asignaciones || []).map((a, i) => {
    const c = { ...a };
    delete c.uid;                       // uid nuevo para cada copia
    c.id = Date.now() + i;
    return c;
  });
  if (!state.calendario[destino]) state.calendario[destino] = { asignaciones: [], notas: "" };
  const dDest = state.calendario[destino];
  if (dDest.asignaciones && dDest.asignaciones.length > 0) {
    if (!confirm(`El día ${dnum(destino)} ya tiene ${dDest.asignaciones.length} médico(s). ¿Sobrescribir con las asignaciones del día ${dnum(origen)}?`)) return;
  }
  const motivo = pedirMotivo();   // MEJORA 6
  dDest.asignaciones = clon;
  state.copiarDiaOrigen = null;
  histLog(destino, `📋 Copiado desde el día ${dnum(origen)} (${clon.length} médico/s)`, motivo);   // MEJORA 5
  guardarEstado();
  render();
}

// ─── PEGAR A TODOS LOS DÍA-DE-SEMANA DEL MES ─────────────────
// dow: 0=Lun, 1=Mar, 2=Mié, 3=Jue, 4=Vie, 5=Sáb, 6=Dom (base-lunes)
function pegarEnDiaDeSemana(dow) {
  const origen = state.copiarDiaOrigen;
  if (!origen) return;
  const dOrig = diaData(origen);
  if (!dOrig.asignaciones || !dOrig.asignaciones.length) {
    alert("El día copiado no tiene asignaciones.");
    return;
  }
  const diasSemana = ["Lunes","Martes","Miércoles","Jueves","Viernes","Sábados","Domingos"];
  const totalDias = new Date(state.anio, state.mes + 1, 0).getDate();

  // Todos los días del MES EN PANTALLA que caen en ese día de semana, menos el día origen.
  const destinos = [];
  for (let d = 1; d <= totalDias; d++) {
    const fecha = `${state.anio}-${String(state.mes + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
    if ((new Date(state.anio, state.mes, d).getDay() + 6) % 7 !== dow) continue;   // base-lunes
    if (fecha === origen) continue;   // no pisar el día origen
    destinos.push(fecha);
  }
  if (!destinos.length) { alert(`No hay otros ${diasSemana[dow]} en ${MESES[state.mes]} para pegar.`); return; }

  const conDatos = destinos.filter(f => (diaData(f).asignaciones || []).length).length;
  const aviso = conDatos ? `\n\n${conDatos} de esos días ya tienen guardias y se van a sobrescribir.` : "";
  if (!confirm(`Pegar las ${dOrig.asignaciones.length} asignación/es del día ${dnum(origen)} en los ${destinos.length} ${diasSemana[dow]} de ${MESES[state.mes]} (${destinos.map(dnum).join(", ")})?${aviso}`)) return;

  let cuenta = 0;
  destinos.forEach(fecha => {
    // Clon profundo por día: cada copia es un objeto propio (medicoId, rol y horario incluidos),
    // así editar el horario en un día no arrastra a los demás.
    const clon = dOrig.asignaciones.map((a, i) => {
      const c = { ...a };
      delete c.uid;                                    // uid nuevo por copia
      c.id = Date.now() + dnum(fecha) * 100 + i;
      return c;
    });
    if (!state.calendario[fecha]) state.calendario[fecha] = { asignaciones: [], notas: "" };
    state.calendario[fecha].asignaciones = clon;
    histLog(fecha, `📋 Copiado desde día ${dnum(origen)} (pegar a todos los ${diasSemana[dow]})`, "");
    cuenta++;
  });
  guardarEstado();
  render();
  // No se cancela copiarDiaOrigen: el portapapeles queda activo para pegar en otro día de semana.
  alert(`Listo: ${cuenta} ${diasSemana[dow]} actualizados (días ${destinos.map(dnum).join(", ")}).`);
}

// ─── MEJORA 2: DRAG & DROP DE MÉDICO ENTRE DÍAS ──────────────
function dragStartMed(ev, fecha, uid) {

  ev.dataTransfer.setData("text/plain", JSON.stringify({ fecha, uid }));
  if (ev.currentTarget && ev.currentTarget.style) ev.currentTarget.style.opacity = "0.4";
}
function dragEndMed(ev) {
  if (ev.currentTarget && ev.currentTarget.style) ev.currentTarget.style.opacity = "";
}
function permitirDrop(ev) {
  ev.preventDefault();
  const cell = ev.currentTarget;
  if (cell && cell.style) { cell.style.outline = "2px dashed #2563eb"; cell.style.outlineOffset = "-2px"; }
}
function salirDrop(ev) {
  const cell = ev.currentTarget;
  if (cell && cell.style && !(state.copiarDiaOrigen === cell.id.replace("cell-", ""))) cell.style.outline = "";
}
function soltarMedico(ev, destino) {
  ev.preventDefault();
  const cell = ev.currentTarget; if (cell && cell.style) cell.style.outline = "";
  let payload; try { payload = JSON.parse(ev.dataTransfer.getData("text/plain")); } catch (e) { return; }
  const { fecha: origen, uid } = payload || {};
  if (!origen || origen === destino) return;
  const dOrig = diaData(origen);
  const idx = (dOrig.asignaciones || []).findIndex(a => a.uid === uid);
  if (idx < 0) return;
  const motivo = pedirMotivo();   // MEJORA 6
  const [asig] = dOrig.asignaciones.splice(idx, 1);   // mantiene rol, horario y demás campos
  if (!state.calendario[destino]) state.calendario[destino] = { asignaciones: [], notas: "" };
  state.calendario[destino].asignaciones.push(asig);
  const nom = getMedico(asig.medicoId) ? getMedico(asig.medicoId).nombre : "médico";
  histLog(origen, `➡️ ${nom} movido al día ${dnum(destino)}`, motivo);   // MEJORA 5
  histLog(destino, `⬅️ ${nom} movido desde el día ${dnum(origen)}`, motivo);
  guardarEstado();
  render();
}

// ─── HELPERS COMPARTIDOS ─────────────────────────────────────

// ─── MEJORA 5: HISTORIAL DE CAMBIOS POR DÍA (localStorage) ───
function histKey(fecha) { return `guardias_hist_${fecha}`; }
function histGet(fecha) {
  try { const a = JSON.parse(localStorage.getItem(histKey(fecha))); return Array.isArray(a) ? a : []; }

function histLog(fecha, texto, motivo) {

    arr.push({ ts: Date.now(), texto: texto, motivo: motivo || "" });
    while (arr.length > 60) arr.shift();
    localStorage.setItem(histKey(fecha), JSON.stringify(arr));
  } catch (e) {}
}
function abrirHistorial(fecha, ev) { if (ev) ev.stopPropagation(); state.histModal = fecha; render(); }

// ─── PANEL DE AUSENCIAS Y SOLICITUDES ────────────────────────
// ─── HISTORIAL DE INTERCAMBIOS DEL MES ───────────────────────
// Recorre el historial (localStorage) de todos los días del mes y arma la lista de
// intercambios y movimientos. Cada operación deja DOS entradas (una en cada día
// involucrado), así que se toma solo el lado que contiene el día contrario.
// Quita el emoji inicial del texto de historial para las tablas del PDF.
function limpiarEmoji(t) { return String(t || "").replace(/^[^A-Za-zÁÉÍÓÚÑáéíóúñ0-9]+/, "").trim(); }
/* Intercambios y movimientos de un tramo de días de un mes. eventosIntercambioMes()
   queda como el caso particular del mes en pantalla, que es lo que usa la UI. */
function eventosIntercambioDias(anio, mes, dIni, dFin) {
  const eventos = [];
  const vistos = new Set();
  for (let d = dIni; d <= dFin; d++) {
    const fecha = anio + "-" + String(mes + 1).padStart(2, "0") + "-" + String(d).padStart(2, "0");
    histGet(fecha).forEach(h => {
      const t = String(h.texto || "");

      // Formato nuevo del swap de día completo: "🔄 Día 5 ⇄ 6 — nombres ⇄ nombres".
      const mCompleto = t.match(/Día (\d{1,2}) ⇄ (\d{1,2}) — (.+)$/);
      if (mCompleto) {
        const par = [Number(mCompleto[1]), Number(mCompleto[2])].sort((a, b) => a - b);
        const medicos = mCompleto[3].trim();
        const clave = `I|${par.join("-")}|${medicos}|${Math.round((h.ts || 0) / 1000)}`;
        if (vistos.has(clave)) return;
        vistos.add(clave);
        eventos.push({ dias: par, tipo: "Intercambio", medicos, motivo: h.motivo || "", ts: h.ts || 0, orden: Math.max(...par), detalle: limpiarEmoji(t) });
        return;
      }

      if (/Intercambio/.test(t)) {
        const mDia = t.match(/con (?:el )?día (\d{1,2})/);
        const otro = mDia ? Number(mDia[1]) : null;
        const idx = t.indexOf(":");
        const medicos = idx >= 0 ? t.slice(idx + 1).trim() : "Día completo (todas las asignaciones)";
        const par = otro ? [d, otro].sort((a, b) => a - b) : [d];
        const clave = `I|${par.join("-")}|${medicos}|${Math.round((h.ts || 0) / 1000)}`;
        if (vistos.has(clave)) return;
        vistos.add(clave);
        eventos.push({ dias: par, tipo: "Intercambio", medicos, motivo: h.motivo || "", ts: h.ts || 0, orden: Math.max(...par), detalle: limpiarEmoji(t) });

      } else if (/movido/.test(t)) {
        // Solo el lado del origen ("movido al día N"); el del destino es su espejo.
        const mDest = t.match(/movido al día (\d{1,2})/);
        if (!mDest) return;
        const nombre = (t.match(/^[^A-Za-zÁÉÍÓÚÑáéíóúñ]*(.+?)\s+movido/) || [, "—"])[1].trim();
        eventos.push({ dias: [d, Number(mDest[1])], tipo: "Movimiento", medicos: nombre, motivo: h.motivo || "", ts: h.ts || 0, orden: d, direccional: true, detalle: limpiarEmoji(t) });
      }
    });
  }
  return eventos.sort((a, b) => (b.orden - a.orden) || (b.ts - a.ts));   // fecha descendente
}
function eventosIntercambioMes() {
  return eventosIntercambioDias(state.anio, state.mes, 1, new Date(state.anio, state.mes + 1, 0).getDate());
}

function renderModalAusencias() {
  if (!state.ausPanel) return "";
  const f = state.ausForm;

// ─── MEJORA 4: INTERCAMBIAR (SWAP) DÍAS ──────────────────────
function iniciarSwapDia(fecha) { state.swapDiaOrigen = fecha; state.modalDia = null; render(); }
function cancelarSwapDia() { state.swapDiaOrigen = null; render(); }
function swapDiaDestino(destino) {
  const origen = state.swapDiaOrigen;
  if (!confirm(`¿Intercambiar todas las asignaciones del día ${dnum(origen)} con el día ${dnum(destino)}?`)) return;
  const motivo = pedirMotivo();
  if (!state.calendario[origen]) state.calendario[origen] = { asignaciones: [], notas: "" };
  if (!state.calendario[destino]) state.calendario[destino] = { asignaciones: [], notas: "" };
  const tmp = state.calendario[origen].asignaciones;
  state.calendario[origen].asignaciones = state.calendario[destino].asignaciones;
  state.calendario[destino].asignaciones = tmp;
  state.swapDiaOrigen = null;
  // Se registra con los nombres de ambos lados (tomados ANTES del swap) para que el
  // historial del panel Novedades no diga solamente "Día completo".
  histLog(origen,  `🔄 Día ${dnum(origen)} ⇄ ${dnum(destino)} — ${nombresDeAsigs(tmp)} ⇄ ${nombresDeAsigs(state.calendario[origen].asignaciones)}`, motivo);
  histLog(destino, `🔄 Día ${dnum(origen)} ⇄ ${dnum(destino)} — ${nombresDeAsigs(tmp)} ⇄ ${nombresDeAsigs(state.calendario[origen].asignaciones)}`, motivo);
  guardarEstado();
  render();
}
// Nombres de los médicos de un set de asignaciones, para los mensajes de historial.
function nombresDeAsigs(asigs) {
  const arr = asigs || [];
  if (!arr.length) return "(vacío)";
  const nombres = [];
  arr.forEach(a => {
    const n = esPendiente(a) ? "⚠️ Pendiente" : ((getMedico(a.medicoId) || {}).nombre || "—");
    if (!nombres.includes(n)) nombres.push(n);
  });
  return nombres.length > 5 ? nombres.slice(0, 5).join(", ") + ` +${nombres.length - 5}` : nombres.join(", ");
}

function toggleSelMedico(uid) {

  if (uids.length) iniciarSwapMedicos(fecha, uids);

}

  state.modalDia = null;              // cerrar el modal para elegir el día destino
  state.medicoSelModal = new Set();

}

    if (!a) return "";
    const m = getMedico(a.medicoId);
    const rol = getRol(a.rol);
    if (!m) return "";
    const ops = asigsDestino.map(d => {
