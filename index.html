// ─── MEJORA 4: INTERCAMBIAR (SWAP) DÍAS ──────────────────────
function iniciarSwapDia(fecha) { state.swapDiaOrigen = fecha; state.modalDia = null; render(); }
function cancelarSwapDia() { state.swapDiaOrigen = null; render(); }
function swapDiaDestino(destino) {
  const origen = state.swapDiaOrigen;
  if (!confirm(`¿Intercambiar todas las asignaciones del día ${dnum(origen)} con el día ${dnum(destino)}?`)) return;
  const motivo = pedirMotivo();
  if (!state.calendario[origen]) state.calendario[origen] = { asignaciones: [], notas: "" };
  if (!state.calendario[destino]) state.calendario[destino] = { asignaciones: [], notas: "" };
  const tmp = state.calendario[origen].asignaciones;
  state.calendario[origen].asignaciones = state.calendario[destino].asignaciones;
  state.calendario[destino].asignaciones = tmp;
  state.swapDiaOrigen = null;
  // Se registra con los nombres de ambos lados (tomados ANTES del swap) para que el
  // historial del panel Novedades no diga solamente "Día completo".
  histLog(origen,  `🔄 Día ${dnum(origen)} ⇄ ${dnum(destino)} — ${nombresDeAsigs(tmp)} ⇄ ${nombresDeAsigs(state.calendario[origen].asignaciones)}`, motivo);
  histLog(destino, `🔄 Día ${dnum(origen)} ⇄ ${dnum(destino)} — ${nombresDeAsigs(tmp)} ⇄ ${nombresDeAsigs(state.calendario[origen].asignaciones)}`, motivo);
  guardarEstado();
  render();
}
// Nombres de los médicos de un set de asignaciones, para los mensajes de historial.
function nombresDeAsigs(asigs) {
  const arr = asigs || [];
  if (!arr.length) return "(vacío)";
  const nombres = [];
  arr.forEach(a => {
    const n = esPendiente(a) ? "⚠️ Pendiente" : ((getMedico(a.medicoId) || {}).nombre || "—");
    if (!nombres.includes(n)) nombres.push(n);
  });
  return nombres.length > 5 ? nombres.slice(0, 5).join(", ") + ` +${nombres.length - 5}` : nombres.join(", ");
}

// ─── INTERCAMBIO INDIVIDUAL DE MÉDICOS ───────────────────────
// El botón "🔄 Intercambiar" del modal decide el modo según haya o no médicos tildados:
//   con tildados  → intercambio individual (este bloque)
//   sin tildados  → intercambio de día completo (swapDiaOrigen, sin cambios)
function toggleSelMedico(uid) {
  if (state.medicoSelModal.has(uid)) state.medicoSelModal.delete(uid);
  else state.medicoSelModal.add(uid);
  render();
}
function iniciarIntercambio(fecha) {
  const uids = (diaData(fecha).asignaciones || []).map(a => asigUid(a)).filter(u => state.medicoSelModal.has(u));
  if (uids.length) iniciarSwapMedicos(fecha, uids);
  else iniciarSwapDia(fecha);         // comportamiento de siempre
}
function iniciarSwapMedicos(fecha, uids) {
  state.swapMedicoOrigen = { fecha, uids };
  state.modalDia = null;              // cerrar el modal para elegir el día destino
  state.medicoSelModal = new Set();
  render();
}
function cancelarSwapMedicos() {
  state.swapMedicoOrigen = null;
  state.swapMedicoDestino = null;
  render();
}
// Nombres de los médicos seleccionados, para el banner y los mensajes.
function nombresDeUids(fecha, uids) {
  return uids.map(u => {
    const a = asigPorUid(fecha, u);
    const m = a ? getMedico(a.medicoId) : null;
    return m ? m.nombre : "—";

}

function cerrarSwapMedicoPicker() {
  state.swapMedicoDestino = null;
  render();   // vuelve al banner: se puede elegir otro día destino
}
function ejecutarSwapMedicos() {
  const { fecha: origen, uids } = state.swapMedicoOrigen;
  const destino = state.swapMedicoDestino;

  // Leer el emparejamiento elegido en los selects.
  const pares = [];
  uids.forEach((u, i) => {
    const sel = document.getElementById(`swapmed-${i}`);
    if (sel && sel.value) pares.push({ uidOrigen: u, uidDestino: sel.value });
  });
  if (!pares.length) { alert("No elegiste ningún intercambio."); return; }

  // Un mismo médico del destino no puede recibir dos intercambios.
  const destinosElegidos = pares.map(p => p.uidDestino);
  if (new Set(destinosElegidos).size !== destinosElegidos.length) {
    alert("Elegiste el mismo médico de destino más de una vez. Revisá el emparejamiento.");
    return;
  }

  const motivo = pedirMotivo();
  const detalle = [];
  pares.forEach(p => {
    const a = asigPorUid(origen, p.uidOrigen);
    const b = asigPorUid(destino, p.uidDestino);
    if (!a || !b) return;
    const nomA = getMedico(a.medicoId) ? getMedico(a.medicoId).nombre : "médico";
    const nomB = getMedico(b.medicoId) ? getMedico(b.medicoId).nombre : "médico";
    // Se permutan SOLO los médicos: rol, horario y uid quedan con el turno de cada día,
    // así el destino conserva sus roles y horarios (y el origen los suyos).
    const tmp = a.medicoId;
    a.medicoId = b.medicoId;
    b.medicoId = tmp;
    detalle.push(`${nomA} ⇄ ${nomB}`);
  });
  if (!detalle.length) { alert("No se pudo resolver el intercambio."); return; }

  histLog(origen,  `🔄 Intercambio con día ${dnum(destino)}: ${detalle.join(" · ")}`, motivo);
  histLog(destino, `🔄 Intercambio con día ${dnum(origen)}: ${detalle.join(" · ")}`, motivo);

  state.swapMedicoOrigen = null;
  state.swapMedicoDestino = null;
  guardarEstado();
  render();
}

// ─── MEJORA 9: HORAS POR MÉDICO ──────────────────────────────
function durationHoras(a) {
  const s = String(horarioDe(a));
  const r = s.match(/(\d{1,2})\s*[-–—]\s*(\d{1,2})/);
  if (r) { let d = ((+r[2]) - (+r[1]) + 24) % 24; return d === 0 ? 24 : d; }
  const hm = s.match(/(\d{1,2})\s*h/i);
  return hm ? (+hm[1]) : 0;
}
function resumenHoras() {
  const acc = {};
  const cal = state.calendario || {};
  Object.keys(cal).forEach(fecha => {
    (cal[fecha].asignaciones || []).forEach(a => {
      if (esPendiente(a)) return;   // un turno sin cubrir no suma horas a nadie
      const m = getMedico(a.medicoId); if (!m) return;
      if (!acc[m.id]) acc[m.id] = { medico: m, guardias: 0, horas: 0 };
      acc[m.id].guardias += 1;
      acc[m.id].horas += durationHoras(a);
    });
  });
  return Object.values(acc)
    .map(x => ({ ...x, promedio: x.guardias ? (x.horas / x.guardias) : 0 }))
    .sort((a, b) => b.horas - a.horas);
}

// ─── MEJORA 8: VISTA SEMANAL ─────────────────────────────────
function semanaDeFecha(fecha) {
  const [_sf_y,_sf_m,_sf_d] = fecha.split("-").map(Number);
  const d = new Date(_sf_y, _sf_m-1, _sf_d);
  const dow = (d.getDay() + 6) % 7;   // 0 = lunes
  const lunes = new Date(d); lunes.setDate(d.getDate() - dow);
  const dias = [];
  for (let i = 0; i < 7; i++) {
    const x = new Date(lunes); x.setDate(lunes.getDate() + i);
    dias.push(`${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, "0")}-${String(x.getDate()).padStart(2, "0")}`);
  }
  return dias;
}
function anclaSemana() {
  if (state.semanaAncla) return state.semanaAncla;
  const hoy = hoyISO();
  const primero = `${state.anio}-${String(state.mes + 1).padStart(2, "0")}-01`;
  const enMes = hoy.startsWith(`${state.anio}-${String(state.mes + 1).padStart(2, "0")}`);
  state.semanaAncla = enMes ? hoy : primero;
  return state.semanaAncla;
}
function toggleVista() {
  state.modoCal = state.modoCal === "semana" ? "mes" : "semana";
  if (state.modoCal === "semana") anclaSemana();
  render();
}
function moverSemana(dir) {
  const _anc = anclaSemana(); const [_ms_y,_ms_m,_ms_d] = _anc.split("-").map(Number);
  const d = new Date(_ms_y, _ms_m-1, _ms_d);
  d.setDate(d.getDate() + dir * 7);
  state.semanaAncla = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  // sincronizar mes/año mostrados con la semana
  state.anio = d.getFullYear(); state.mes = d.getMonth();
  cargarEstado();
  render();
}
function navPrev() { state.modoCal === "semana" ? moverSemana(-1) : prevMes(); }
function navNext() { state.modoCal === "semana" ? moverSemana(1) : nextMes(); }

function setNota(fecha, nota) {
  if(!state.calendario[fecha]) state.calendario[fecha] = {asignaciones:[], notas:""};
  state.calendario[fecha].notas = nota;
  guardarEstado();
}

function abrirModalMedico() { state.modalMedico = true; render(); }
function cerrarModalMedico() { state.modalMedico = false; state.nuevoMedico = {nombre:"",sigla:"",color:"#1d4ed8"}; render(); }

function selColor(c) {

  render();
}

function confirmarNuevoMedico() {
  const nm = state.nuevoMedico;
  if(!nm.nombre || !nm.sigla) return;
  medicos.push({id:Date.now(), ...nm});
  state.modalMedico = false;
  state.nuevoMedico = {nombre:"",sigla:"",color:"#1d4ed8"};

  render();
}

function quitarMedico(id) {
  if(medicos.length <= 1) return;
  medicos = medicos.filter(m => m.id !== id);
  guardarEstado();
  render();
}

// ─── EXPORTAR PDF ────────────────────────────────────────────
// ─── PUNTO 6: OPCIONES DE EXPORTACIÓN ────────────────────────
function abrirModalPDF() {
  state.modalPDF = { planilla: true, horas: false, notas: false, ausencias: false, historial: false };
  render();
}
function cerrarModalPDF() { state.modalPDF = null; render(); }
function togglePDFOpt(k) {

}
function confirmarExportarPDF() {
  const o = state.modalPDF;
  if (!o || !algoElegidoPDF(o)) return;   // el botón ya está deshabilitado
  const opciones = { ...o };
  state.modalPDF = null;
  render();
  exportarPDF(opciones);
}
function algoElegidoPDF(o) { return !!(o.planilla || o.horas || o.notas || o.ausencias || o.historial); }
function renderModalPDF() {

function exportarPDF(opciones) {
  const opt = opciones || { planilla: true, horas: true, notas: true, ausencias: false, historial: false };
  const totalD = new Date(state.anio, state.mes+1, 0).getDate();
  const primerD = (new Date(state.anio, state.mes, 1).getDay() + 6) % 7; // base-lunes
  const notas = cargarNotasMes();

  const celdaHTML = (fecha) => {
    const data = diaData(fecha);
    const dia = Number(fecha.split("-")[2]);
    const asigsOrd = ordenarAsignaciones(data.asignaciones);
    // Los pendientes van aparte: en el PDF el rojo queda reservado para ellos.
    const pendientes = asigsOrd.filter(a => esPendiente(a));
    const cubiertas  = asigsOrd.filter(a => !esPendiente(a));
    const principal = cubiertas.filter(a => a.rol === "D12" || a.rol === "N12");
    const apoyo = cubiertas.filter(a => a.rol !== "D12" && a.rol !== "N12");

    // Médico principal en negro
    const principalHTML = principal.map(a => {
      const m = getMedico(a.medicoId);
      if(!m) return "";
      return `<div class="p-med">${escHTML(m.nombre)}<span class="p-hora"> · ${escHTML(horarioDe(a))}</span></div>`;
    }).join("");

    // Médicos de apoyo en ámbar
    const apoyoHTML = apoyo.map(a => {
      const m = getMedico(a.medicoId);
      if(!m) return "";
      return `<div class="a-med">${escHTML(m.nombre)}<span class="a-hora"> · ${escHTML(horarioDe(a))}</span></div>`;
    }).join("");

    // Turnos sin cubrir: franja roja ubicada según el horario que falta.
    // Diurno arriba (antes de los médicos), nocturno abajo (después).
    // Una sola línea discreta: el horario ya dice qué turno falta.
    const franja = a => {
      const hora = (a.horario && String(a.horario).trim())
        ? String(a.horario)
        : (a.rol !== "PEN" ? getRol(a.rol).label : "horario a definir");
      return `<div class="pen-band">⚠ Pendiente · ${escHTML(hora)}</div>`;
    };
    const esNocturno = a => {
      const h = horaInicioDe(a);
      return a.rol === "N12" || ((h != null) && (h >= 19 || h < 6));
    };
    const penArriba = pendientes.filter(a => !esNocturno(a)).map(franja).join("");
    const penAbajo  = pendientes.filter(esNocturno).map(franja).join("");

    const medicosHTML = principalHTML + apoyoHTML;
    const sep = `<div class="pen-sep"></div>`;
    // Separadores solo cuando conviven franja y médicos reales.
    const cuerpo = [
      penArriba,
      (penArriba && medicosHTML) ? sep : "",
      medicosHTML,
      (penAbajo && (medicosHTML || penArriba)) ? sep : "",
      penAbajo,
    ].join("");

    // Día con SOLO pendientes: toda la celda en rojo claro.
    const soloPend = pendientes.length > 0 && cubiertas.length === 0;
    return `<td class="${soloPend ? "solo-pendiente" : ""}"><div class="num">${dia}</div>${cuerpo}</td>`;
  };

  const vacias = Array.from({length:primerD}, () => `<td class="vacio"></td>`);
  const diasCeldas = Array.from({length:totalD}, (_,i) => {
    const f = `${state.anio}-${String(state.mes+1).padStart(2,'0')}-${String(i+1).padStart(2,'0')}`;
    return celdaHTML(f);
  });
  const relleno = Array.from({length:(7-((primerD+totalD)%7))%7}, () => `<td class="vacio"></td>`);
  const todas = [...vacias, ...diasCeldas, ...relleno];
  const filas = [];
  for(let i=0; i<todas.length; i+=7) filas.push(`<tr>${todas.slice(i,i+7).join("")}</tr>`);

  const notasHTML = (opt.notas && notas.trim())
    ? `<div>
         <div class="notas-titulo">Notas</div>
         <div class="notas-cuerpo">${escHTML(notas)}</div>
       </div>`
    : "";

  // MEJORA 9: resumen de horas por médico en el PDF
  const rhPDF = resumenHoras();
  const horasPDF = (opt.horas && rhPDF.length)
    ? `<div class="${opt.planilla ? "bloque-pagina" : ""}">
         <div style="font-size:11pt;font-weight:700;color:#111;margin-bottom:6px">Resumen de horas por médico</div>
         <table style="width:auto;min-width:60%;border-collapse:collapse;font-size:9pt">
           <thead><tr>${["Médico","Guardias","Horas totales","Promedio"].map(h=>`<th style="height:auto;background:#e5e7eb;border:1px solid #9ca3af;padding:4px 10px;text-align:left">${h}</th>`).join("")}</tr></thead>
           <tbody>${rhPDF.map(x=>`<tr>
             <td style="height:auto;border:1px solid #cbd5e1;padding:3px 10px">${escHTML(x.medico.nombre)}</td>
             <td style="height:auto;border:1px solid #cbd5e1;padding:3px 10px;text-align:center">${x.guardias}</td>
             <td style="height:auto;border:1px solid #cbd5e1;padding:3px 10px;text-align:center;font-weight:700">${x.horas} h</td>
             <td style="height:auto;border:1px solid #cbd5e1;padding:3px 10px;text-align:center">${x.promedio.toFixed(1)} h</td>
           </tr>`).join("")}</tbody>
         </table>
       </div>`
    : "";

  // Encabezado que se repite en cada sección extra: servicio + mes.
  const subtituloSec = escHTML([(state.config || {}).servicio, `${MESES[state.mes]} ${state.anio}`].filter(Boolean).join(" · "));

  // ─── Licencias y ausencias del mes ───
  const ausPDF = (function () {
    if (!opt.ausencias) return "";
    const arr = ausGet().slice().sort((a, b) => a.desde - b.desde);

      const m = getMedico(a.medicoId);

      const desde = a.fDesde ? fmtFechaCorta(a.fDesde) : `${a.desde} ${MESES_CORTO[state.mes]}`;
      const hasta = a.fHasta ? fmtFechaCorta(a.fHasta) : `${a.hasta} ${MESES_CORTO[state.mes]}`;
      return `<tr>
        <td>${escHTML(m ? m.nombre : "—")}</td>

        <td>${escHTML(desde)}</td>
        <td>${escHTML(hasta)}</td>
        <td>${escHTML(a.motivo || "—")}</td>
      </tr>`;
    }).join("");
    return `<div>
      <div class="sec-tit">Licencias y ausencias del mes</div>
      <div class="sec-sub">${subtituloSec}</div>
      <table class="sec">
        <thead><tr>${["Médico", "Tipo", "Desde", "Hasta", "Motivo"].map(h => `<th>${h}</th>`).join("")}</tr></thead>
        <tbody>${filas}</tbody>

  })();

  // ─── Historial de intercambios y movimientos ───
  const histPDF = (function () {

      return `<tr>

        <td>${escHTML(e.medicos)}</td>
        <td>${escHTML(e.tipo)}</td>
        <td>${escHTML(e.detalle || "—")}</td>
        <td>${escHTML(e.motivo || "—")}</td>
      </tr>`;
    }).join("");
    return `<div>
      <div class="sec-tit">Historial de intercambios y movimientos</div>
      <div class="sec-sub">${subtituloSec}</div>
      <table class="sec">
        <thead><tr>${["Fecha", "Médico(s)", "Tipo", "Detalle", "Motivo"].map(h => `<th>${h}</th>`).join("")}</tr></thead>
        <tbody>${filas}</tbody>
      </table>
    </div>`;
  })();

  // ─── BLOQUE 3: novedades (notas + ausencias + historial) en UNA sola página ───
  // Se separan entre sí con una línea fina, nunca con salto de página.
  const partesNov = [notasHTML, ausPDF, histPDF].filter(Boolean);
  const novedadesPDF = partesNov.length
    ? `<div class="${(opt.planilla || horasPDF) ? "bloque-pagina" : ""}">${partesNov.join('<div class="nov-sep"></div>')}</div>`
    : "";

  const html = `<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8">
<title>Guardias ${MESES[state.mes]} ${state.anio}</title>
<style>
  @page { size: 297mm 210mm; margin: 12mm 10mm; }   /* A4 apaisado, en mm para máxima compatibilidad */
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family: Arial, Helvetica, sans-serif; color:#111; background:#fff;
         -webkit-print-color-adjust: exact; print-color-adjust: exact; }   /* que los fondos se impriman */

  .pdf-head { position:relative; text-align:center; margin-bottom:26px; min-height:1px; }

  table { width:100%; border-collapse:collapse; table-layout:fixed; }

  /* Franja de turno sin cubrir: una sola línea discreta, bajo los 20px de alto */

${(function(){

function resaltarDia(fecha) {

  const prev = el.style.boxShadow;

}

// Etiqueta corta del turno: "Diurno 08–20 hs", "Nocturno 20–08 hs", "Apoyo 4 horas …"
function etiquetaTurno(a) {
  const rol = getRol(a.rol);
  const override = (a.horario && String(a.horario).trim()) ? String(a.horario) : "";
  if (a.rol === "PEN") return override || "turno sin definir";
  const base = a.rol === "D12" ? "Diurno" : a.rol === "N12" ? "Nocturno" : rol.desc;
  const hora = override || rol.label;
  // El "label" de los apoyos no es un rango horario ("Apoyo 4hs"): repetirlo al lado
  // del nombre del turno no aporta, así que solo se agrega si es un rango real.
  return /\d\s*[-–—]\s*\d/.test(hora) ? `${base} ${hora}` : base;
}
function nombreDiaLargo(fecha) {
  const [y, m, d] = fecha.split("-").map(Number);
  return `${DIAS_FULL[new Date(y, m - 1, d).getDay()]} ${d}`;
}
function renderModalResumen() {
  if (!state.modalResumen) return "";
  const esDias = state.modalResumen === "dias";
  const fechas = Object.keys(state.calendario || {}).sort();

  let filas = [];
  if (esDias) {
    fechas.filter(f => diaSinCubrir(f)).forEach(f => {
      const asigs = diaData(f).asignaciones || [];
      // Qué falta: los turnos de guardia pendientes; si el día está vacío, no hay nada cargado.
      const faltan = asigs.filter(a => esPendiente(a) && (a.rol === "PEN" || esGuardia(a)));
      const detalle = faltan.length
        ? faltan.map(a => escHTML(etiquetaTurno(a))).join(" · ")
        : `<span style="color:#9ca3af">Sin ninguna asignación cargada</span>`;
      filas.push({ fecha: f, detalle });
    });
  } else {
    fechas.forEach(f => {
      (diaData(f).asignaciones || []).filter(esPendiente).forEach(a => {
        filas.push({ fecha: f, detalle: `⚠ Pendiente · ${escHTML(etiquetaTurno(a))}` });
      });

  }

  const listaHTML = filas.length
    ? filas.map(x => `<div onclick="irADia('${x.fecha}')" class="resumen-fila">

// ─── EXPORTAR / IMPORTAR MES JSON (CAMBIO 6) ─────────────────
// ─── REPORTE PARA RRHH (PDF vertical) ────────────────────────
// Una fila por médico del equipo, incluidos los que no tienen guardias en el mes:
// RRHH necesita ver el cero explícito, no una ausencia de fila.
function datosReporteRRHH() {
  const acc = {};
  medicos.forEach(m => {
    acc[m.id] = { medico: m, diurnas: 0, nocturnas: 0, apoyos: 0, horas: 0, licencia: 0, solicitud: 0, enfermedad: 0, otro: 0 };
  });
  Object.keys(state.calendario || {}).forEach(f => {
    (state.calendario[f].asignaciones || []).forEach(a => {
      if (esPendiente(a)) return;              // los turnos sin cubrir no se le imputan a nadie
      const fila = acc[Number(a.medicoId)];
      if (!fila) return;
      if (a.rol === "D12") fila.diurnas++;
      else if (a.rol === "N12") fila.nocturnas++;
      else fila.apoyos++;
      fila.horas += durationHoras(a);
    });
  });
  // Días de ausencia dentro del mes en pantalla (los segmentos ya vienen recortados al mes).
  ausGet().forEach(a => {
    const fila = acc[Number(a.medicoId)];
    if (!fila) return;
    const dias = Math.max(0, (Number(a.hasta) || 0) - (Number(a.desde) || 0) + 1);
    if (a.tipo === "licencia") fila.licencia += dias;
    else if (a.tipo === "solicitud") fila.solicitud += dias;
    else if (a.tipo === "enfermedad") fila.enfermedad += dias;
    else fila.otro += dias;
  });
  return Object.values(acc)
    .map(x => ({ ...x, observaciones: observacionAuto(x) }))
    .sort((x, y) => y.horas - x.horas || x.medico.nombre.localeCompare(y.medico.nombre));
}
// Observación sugerida (el jefe puede sobrescribirla en la previsualización).
function observacionAuto(x) {
  const o = [];
  if (x.enfermedad) o.push(`Enfermedad: ${x.enfermedad} día${x.enfermedad !== 1 ? "s" : ""}`);
  if (x.otro) o.push(`Otros: ${x.otro} día${x.otro !== 1 ? "s" : ""}`);
  if (!x.diurnas && !x.nocturnas && !x.apoyos) o.push("Sin guardias en el mes");
  return o.length ? o.join(" · ") : "—";
}

function exportarMesJSON() {
  const data = {
    app: "GuardiaSync",
    anio: state.anio,
    mes: state.mes,
    mesNombre: MESES[state.mes],
    calendario: state.calendario,
    medicos: medicos,
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `GuardiaSync_${MESES[state.mes]}_${state.anio}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function importarMesJSON(ev) {
  const file = ev.target.files && ev.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      if(data.calendario && typeof data.calendario === "object") state.calendario = data.calendario;
      if(Array.isArray(data.medicos) && data.medicos.length) medicos = data.medicos;
      if(typeof data.anio === "number") state.anio = data.anio;
      if(typeof data.mes === "number") state.mes = data.mes;
      state.historialMeses[`${state.anio}-${state.mes}`] = state.calendario;
      guardarEstado();
      render();
      alert(`Mes importado: ${MESES[state.mes]} ${state.anio}`);
    } catch(err) {
      alert("Archivo JSON inválido.");
    }
    ev.target.value = "";
  };
  reader.readAsText(file);
}

    document.getElementById("login").style.display = "none";
    iniciarApp();
  } else {
    document.getElementById("login-error").style.display = "block";
  }
}

(function bootstrap() {
  // Mes publicado en un gist: se baja el JSON y se abre en solo lectura, sin login.
  const gistId = leerGistDeURL();
  if (gistId) {
    const lg0 = document.getElementById("login");
    if (lg0) lg0.style.display = "none";
    state.compartido = true;   // desde ya: bloquea cualquier escritura mientras carga
    state.jefe = false;
    pantallaCargandoGist();
    cargarDesdeGist(gistId);
    return;
  }

  // Link compartido: entra directo en solo lectura, sin login y sin tocar localStorage.
  const pkgShare = leerShareDeURL();
  if (pkgShare) {
    aplicarPaqueteCompartido(pkgShare);
    const lg = document.getElementById("login");
    if (lg) lg.style.display = "none";
    render();
    return;
  }

  let auth = false;
  try { auth = sessionStorage.getItem("guardias_auth") === "ok"; } catch(e) {}
  if(auth) {
    document.getElementById("login").style.display = "none";
    iniciarApp();
  } else {
    pintarLogin();
    const inp = document.getElementById("login-pass");
    if(inp) inp.focus();
  }
})();
</script>
